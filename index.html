/* On a shared line (sharedAt), the earliest pass owns the optic and others get links, so it intercepts all the light. Sized to the widest. */
function insertNode(segIdx, u, key){
  const s0 = tr.segs[segIdx], type = insertType(key);
  inserting = null; closeInsMenu();
  if (s0.geo < 12){ draw(); return; }
  u = clamp(u, 3, s0.geo - 3);
  let group = sharedAt(segIdx, u);
  const own = group[0], s = tr.segs[own.seg];
  if (type === "fiber" || type === "retro" || type === "pair") group = group.filter(x => x.back === own.back);   // fibers, roofs and pairs only take light at their input
  const el = newElement(key, { d:Math.round(own.u*10)/10, ap:30 });
  if (type === "fiber") fitFiberTo(el, s, own.u);
  else fitApertureTo(el, Math.max(...group.map(x => beamHalfWidthAt(tr.segs[x.seg], x.u))));
  if (HARMONIC[type]) fitHarmonicTo(el, s);
  if (BRANCHING.has(type)) el.branchTail = Math.round(s.geo - own.u);
  const plan = group.map(x => ({ x, t:tr.segs[x.seg] }));   // read everything from this trace before editing
  for (const { x, t } of plan){
    const way = x.back !== own.back ? "back" : "fwd";       // against the owner's pass, or with it
    const item = t === s ? el : Object.assign(makeElement("link", {}), { ref:el.id, along:way, follow:followFor(el, way) },
                                              BRANCHING.has(type) ? { branchTail:el.branchTail } : {});
    t.list.splice(t.endEl ? t.list.indexOf(t.endEl) : t.list.length, 0, item);
    if (!fixedLength(t)) setSegmentLength(t, Math.max(2, Math.round((t.geo - x.u)*10)/10));
  }
  sel = el.id;
  commit();
}

  const items = ids.map(at).filter(Boolean), A0 = at(anchor);
  if (items.length < 2 || !A0) return;
  const deg = v => Math.atan2(v.y, v.x)*180/Math.PI;
  const apart = (a, b) => { const d = ((a - b)%180 + 180)%180; return Math.min(d, 180 - d); };   // between two line directions
  const cx = mean(items.map(i => i.p.x)), cy = mean(items.map(i => i.p.y));
  let sxx = 0, syy = 0, sxy = 0;
  for (const { p } of items){ sxx += (p.x - cx)**2; syy += (p.y - cy)**2; sxy += (p.x - cx)*(p.y - cy); }
  const spread = .5*Math.atan2(2*sxy, sxx - syy)*180/Math.PI;
  const cands = [{ a:0, why:"horizontal" }, { a:90, why:"vertical" }];
  for (const i of items){ const a = deg(i.dir); cands.push({ a, why:"along the beam" }, { a:a + 90, why:"across the beam" }); }
  const sliders = items.filter(i => i.o.kind === "el" && i.o.el.id !== anchor);
  const ok = cands.filter(c => sliders.every(s => apart(c.a, deg(s.dir)) > 5));
  if (!ok.length){ flashStatus("These optics' beams cross at angles no one line can meet them all along", 3500); return; }
  const line = ok.reduce((b, c) => apart(c.a, spread) < apart(b.a, spread) - 1e-6 ? c : b);
  const u = { x:Math.cos(line.a*Math.PI/180), y:Math.sin(line.a*Math.PI/180) }, nrm = leftNormal(u);
  const order = [...scene.sources.filter(s => multi.has(s.id)).map(s => s.id),   // sources first, then optics down their beams
                 ...tr.nodes.filter(n => !n.link && multi.has(n.el.id)).map(n => n.el.id)].filter(id => id !== anchor);
  const stuck = new Set(), moved = new Set();
  inserting = null; closeInsMenu();
  for (let pass = 0; pass < 3; pass++){          // moving a source carries its beam: repeat until settled
    let any = false;
    for (const id of order){
      if (stuck.has(id)) continue;
      const A = at(anchor), it = at(id); if (!A || !it) continue;
      const off = (it.p.x - A.p.x)*nrm.x + (it.p.y - A.p.y)*nrm.y;   // how far off the line
      if (Math.abs(off) < 1e-3) continue;
      let done;
      if (it.o.kind === "src"){
        const src = it.o.src, x0 = src.x, y0 = src.y, x = r3(x0 - off*nrm.x), y = r3(y0 - off*nrm.y);
        done = !src._aimD && editClear(s => { src.x = s ? x : x0; src.y = s ? y : y0; }, true);
      } else {
        const el = it.o.el, d0 = el.d, d = r3(d0 - off/(it.dir.x*nrm.x + it.dir.y*nrm.y));
        done = !el._aimD && d >= GAP && editClear(s => { el.d = s ? d : d0; }, true);
      }
      if (done){ moved.add(id); any = true; } else stuck.add(id);
      indexScene(); tr = trace(scene);
    }
    if (!any) break;
  }
  multi.clear(); for (const id of ids) if (objects.byId.has(id)) multi.add(id);   // the trace and index were rebuilt: keep the selection
  commit();
  const names = [...stuck].map(multiName).join(", ");
  flashStatus(!moved.size && !stuck.size ? "Already collinear"
    : `Lined up ${moved.size} with ${multiName(anchor)}, ${line.why}` + (names ? `  ·  couldn't reach: ${names}` : ""), 3500);
}

/* =====================================================================
   10. PANEL — object browser and properties
   ===================================================================== */
const browser = document.getElementById("browser"), props = document.getElementById("props");
const selectedObject  = () => objects.byId.get(sel) || null;
const selectedElement = () => { const o = selectedObject(); return o && o.kind === "el" ? o : null; };
const selectedSource  = () => { const o = selectedObject(); return o && o.kind === "src" ? o.src : null; };
const srcOfSel = () => { const o = selectedObject(); return o ? o.src : null; };   // the beam the selection is on
const srcOfEl  = el => { const o = objects.byId.get(el.id); return o ? o.src : scene.sources[0]; };
function select(id){
  sel = id; multi.clear();
  const o = objects.byId.get(id);              // unfold whatever holds the selection, so it can be seen
  if (o && o.kind !== "src") for (let h = o.holder; h; h = objects.parentOf.get(h)) ui.closed.delete(h.id);
  refreshPanel(true);
}
/* Removing an optic removes its visiting links. Removing a link disconnects its join (§10). */
function removeElement(o){
  if (o.el.type === "link") return disconnect(o);
  o.list.splice(o.list.indexOf(o.el), 1);
  cullLinksTo(new Set([o.el.id]));
  sel = o.src.id;
}
/* Remove every link visiting the optics in ids. */
function cullLinksTo(ids){
  const cull = list => {
    for (let i = list.length - 1; i >= 0; i--){
      const el = list[i];
      if (el.type === "link" && ids.has(el.ref)){ list.splice(i, 1); continue; }
      cull(el.branch || []); if (el.arms) for (const k in el.arms) cull(el.arms[k].list);
    }
  };
  for (const src of scene.sources) cull(src.chain);
}

/* ---------- joining ----------
   Dropping a beam end on an optic joins it; the arrival direction decides what follows (autoJoin).
   A link into the optic is appended, then links for each optic its light meets downstream.
     two-output optics have four ports (PORT_EXIT): entering the unused side combines with the
     owner's beam on both paths; coming back down an output leaves back along the way in and out
     the unused side. Dichroics route only outputs that carry the beam's lines.
     other optics: follow the owner on, or go back through earlier optics.
   Otherwise the beam is just aimed and starts new ends. Only the heading-for optic can be joined. */
const listOf = (holder, key) => isSource(holder) ? holder.chain : key === "branchTail" ? (holder.branch || (holder.branch = [])) : holder.list;
const followFor = (el, along) => BRANCHING.has(el.type) ? (along === "fwd" ? el.follow : "transmitted") : "transmitted";
/* A planned link; ids are given when applied (giveIds). */
const newLink = (ref, along, follow = "transmitted") => ({ id:"", type:"link", ...ELEMENTS.link.defaults(), ref:ref.id, along, follow });
function giveIds(list){ for (const el of list){ if (!el.id) el.id = "e" + (nextId++); giveIds(el.branch || []); } }
const allLinks = l => [l, ...(l.branch || []).flatMap(allLinks)];

/* Riding with a beam from L[i]: links to its optics and that list's end length (H[K]). At a two-output
   optic the light follows the beam's way and the other output rides its sub-beam (or switches over if a
   dichroic sends it all there). nms: the joining lines. Returns { links, tail, tags, then }. */
function planFwd(L, i, H, K, nms, depth = 0){
  const links = [], tags = [];
  for (let j = i; j < L.length; j++){
    const e = L[j], r = realEl(e); if (!r) continue;
    const l = newLink(r, "fwd"); links.push(l); tags.push(r._tag);
    if (TERMINAL.has(r.type)) break;
    if (r.type === "filter") nms = nms.filter(filterPasses(r));
    if (HARMONIC[r.type]) nms = harmonicLines(r, nms);
    if (!BRANCHING.has(r.type)) continue;
    const outs = litOutputs(r, nms), on = outs.find(o => o.kind === e.follow), off = outs.find(o => o.kind !== e.follow);
    if (!on){                                    // all to the other output: on with its sub-beam
      Object.assign(l, { follow:off.kind, along:"branch", branchTail:DARK_TAIL });
      const sub = depth < MAX_NEST ? planFwd(e.branch || [], 0, e, "branchTail", off.nms, depth + 1) : { links:[], tail:e.branchTail, tags:[], then:null };
      return { links:[...links, ...sub.links], tail:sub.tail, tags, then:{ name:beamName(e), ...sub } };
    }
    l.follow = e.follow; nms = on.nms;
    if (off && depth < MAX_NEST){ const sub = planFwd(e.branch || [], 0, e, "branchTail", off.nms, depth + 1); l.branch = sub.links; l.branchTail = sub.tail; }
    else l.branchTail = off ? DEFAULT_TAIL : DARK_TAIL;
  }
  return { links, tail:H[K] ?? DEFAULT_TAIL, tags, then:null };
}
/* Coming back along a beam: links to L's optics before i, last first, then up into the parent beam.
   At a two-output optic, the matching kind goes back and the rest leaves by the free port.
   Returns { links, tail, tags, end }. */
function planBack(L, i, H, K, nms, depth = 0){
  const links = [], tags = [];
  const meet = (r, k) => {                       // optic r against output kind k: false if light leaves the path
    const l = newLink(r, "back"); links.push(l); tags.push(r._tag);
    if (r.type === "filter") nms = nms.filter(filterPasses(r));
    if (HARMONIC[r.type]) nms = harmonicLines(r, nms);
    if (!BRANCHING.has(r.type)) return true;
    const outs = litOutputs(r, nms), on = outs.find(o => o.kind === k), off = outs.find(o => o.kind !== k);
    if (!on){ Object.assign(l, { follow:off.kind, along:"free", branchTail:DARK_TAIL }); return false; }
    Object.assign(l, { follow:k, branchTail:off ? DEFAULT_TAIL : DARK_TAIL }); nms = on.nms;
    return true;
  };
  for (let j = i - 1; j >= 0; j--){
    const e = L[j], r = realEl(e); if (!r) continue;
    if (!meet(r, e.follow)) return { links, tail:DEFAULT_TAIL, tags, end:{ free:r._tag } };
  }
  const r = realEl(H), row = objects.byId.get(H.id);
  if (K === "branchTail" && r && row && BRANCHING.has(r.type) && depth < MAX_NEST){   // L is a sub-beam: back into the optic that made it
    if (!meet(r, OTHER[H.follow])) return { links, tail:DEFAULT_TAIL, tags, end:{ free:r._tag } };
    const up = planBack(row.list, row.list.indexOf(H), row.holder, row.key, nms, depth + 1);
    return { links:[...links, ...up.links], tail:up.tail, tags:[...tags, ...up.tags], end:up.end };
  }
  return { links, tail:DEFAULT_TAIL, tags, end:isSource(H) ? { source:true } : {} };
}

/* Ways a beam (holder, key) can meet target: [{ along, follow, make }]. make() plans { first, rest, tail }
   (tail null keeps the length). autoJoin picks one. face: a fiber's "in" or "out" end. */
function joinOptions(holder, key, target, face = "in"){
  const row = objects.byId.get(target.id); if (!row) return [];
  const L = row.list, i = L.indexOf(target), H = row.holder, K = row.key;
  const tailSeg = tr.segs.find(s => s.kind === "tail" && s.holder === holder);
  const nms = tailSeg ? tailSeg.chans.map(c => c.nm) : [];
  if (target.type === "fiber"){                   // a fiber's output follows the owner's path either way:
    const back = face === "out";                  // on from the output, or back from the input
    const opt = loose => ({ along:loose ? "" : back ? "back" : "fwd",
      make:() => {
        const p = back ? planBack(L, i, H, K, nms) : planFwd(L, i + 1, H, K, nms);
        return { first:Object.assign(newLink(target, back ? "back" : "fwd"), loose ? { loose:true } : {}), rest:p.links, tail:p.tail };
      } });
    return [opt(false), opt(true)];               // lined up on the owner's way in, or only aimed at the end
  }
  if (TERMINAL.has(target.type))                  // nothing leaves it: the beam ends on it
    return [{ along:"", make:() => ({ first:newLink(target, ""), rest:[], tail:null }) }];
  const opts = [];
  if (BRANCHING.has(target.type)){
    // Entering a port, light leaves by two (PORT_EXIT): owner paths are followed; the unused side is a new end.
    const f = target.follow, outs = litOutputs(target, nms);
    const mainP = portOf(f), subP = portOf(OTHER[f]);
    const route = (port, lines) => {
      if (port === "open") return { links:[], tail:DEFAULT_TAIL };
      if (port === "in") return planBack(L, i, H, K, lines);
      return port === mainP ? planFwd(L, i + 1, H, K, lines) : planFwd(target.branch || [], 0, target, "branchTail", lines);
    };
    const RANK = { [mainP]:0, in:1, [subP]:2, open:3 };   // the likeliest output for the joining list
    const way = entry => {
      const exits = outs.map(o => ({ ...o, port:PORT_EXIT[o.kind][entry] }));
      const main = exits.reduce((a, b) => RANK[b.port] < RANK[a.port] ? b : a), other = exits.find(o => o !== main);
      opts.push({ along:alongFor(main.port, f), follow:main.kind,
        make:() => {
          const m = route(main.port, main.nms), b = other && route(other.port, other.nms);
          const first = Object.assign(newLink(target, alongFor(main.port, f), main.kind), { branch:b ? b.links : [], branchTail:b ? b.tail : DARK_TAIL });
          return { first, rest:m.links, tail:m.tail };
        } });
    };
    way("open");                                 // from the unused side: onto the owner's paths
    way(mainP);                                  // down the owner's way on
    way(subP);                                   // down its other output
    way("in");                                   // in beside the owner
    const one = outs.length === 1 ? outs[0].kind : null;
    opts.push({ along:"",
      make:() => ({ first:Object.assign(newLink(target, "", one || OTHER[f]), { branchTail:one ? DARK_TAIL : DEFAULT_TAIL }), rest:[], tail:DEFAULT_TAIL }) });
  } else {
    opts.push({ along:"fwd",
      make:() => { const p = planFwd(L, i + 1, H, K, nms); return { first:newLink(target, "fwd"), rest:p.links, tail:p.tail }; } });
    opts.push({ along:"back",
      make:() => { const p = planBack(L, i, H, K, nms); return { first:newLink(target, "back"), rest:p.links, tail:p.tail }; } });
    opts.push({ along:"",
      make:() => ({ first:newLink(target, ""), rest:[], tail:DEFAULT_TAIL }) });
  }
  return opts;
}
/* ---------- heading for ----------
   A beam end can only join the first optic its course meets (faceHit, §4) ahead of the last one it left.
   Joining turns the beam only enough to centre it, or to line it up with a nearby path. */
const tailOf = holder => tr.segs.find(s => s.kind === "tail" && s.holder === holder) || null;
/* The optic segment s heads for: { n, t, at, p, face }, or null. skip: an optic to ignore. */
function headingFor(s, skip = null){
  let best = null;
  for (const n of tr.nodes){
    if (n.link || n.el === skip) continue;
    for (const h of n.el.type === "fiber" ? fiberFaceHits(n, s.p0, s.dir) : n.pair ? pairFaceHits(n, s.p0, s.dir) : [faceHit(n, s.p0, s.dir)])
      if (h && h.off <= h.half && h.t >= GAP && (!best || h.t < best.t)) best = { n, t:h.t, at:h.at, p:h.p || n.p, face:h.face || "in" };
  }
  return best;
}
/* Where line P + tD meets a fiber's ends (owner node n), from in front only; packages count. */
function fiberFaceHits(n, P, D){
  const E = n.fiber.ends, el = n.el;
  return [["in", E.in, E.in.dir], ["out", E.out, { x:-E.out.dir.x, y:-E.out.dir.y }]].map(([face, e, N]) => {
    const dn = D.x*N.x + D.y*N.y; if (dn < 0.02) return null;
    const t = ((e.p.x - P.x)*N.x + (e.p.y - P.y)*N.y)/dn, at = { x:P.x + D.x*t, y:P.y + D.y*t };
    const half = (e.end === "collimator" ? collimatorR(el.ap) : FC.nutR) + FACE_SLACK;
    return { t, at, p:e.p, face, off:Math.hypot(at.x - e.p.x, at.y - e.p.y), half };
  });
}
/* What turns the beam on tail segment s: the source or the aimed fold, through axis-neutral optics. { at, src }, { at, node }, or null. */
function steererOf(s){
  for (let k = 0; s && k < 400; k++){
    if (s.prev == null) return { at:s.p0, src:s.src };   // the source's own segment: the source turns
    const el = tr.segs[s.prev].endEl;
    if (!el || el.type === "link") return null;  // a visit isn't steered
    if (el.type === "fiber") return { at:s.p0, fiber:el };   // the output end, which turns and moves as a source does
    if (FOLDS.has(el.type)){
      const onBranch = BRANCHING.has(el.type) && s.list === el.branch, node = nodeOf(el.id);
      return node && (onBranch ? el.follow !== "reflected" : steerable(el)) ? { at:s.p0, node } : null;
    }
    if (!STRAIGHT.has(el.type)) return null;     // a grating or prism: not steered through
    s = tr.segs[s.prev];
  }
  return null;
}
const steerPoint = s => { const st = steererOf(s); return st ? st.at : null; };
/* Whether tail segment s can arrive at Q along Darr: a source moves onto the line (aimSource), a fold slides (aimFold); otherwise it must already be on it. */
function linesUp(st, s, Q, Darr){
  const already = Math.abs(signedAngle(s.dir, Darr)) < 1e-3 && Math.abs(project(Q, s.p0, leftNormal(s.dir))) <= 0.1;
  if (!st || already) return already;            // already on the line (a straight-back mirror can't slide)
  if (st.src || st.fiber) return true;
  const fs = tr.segs[st.node.segIn], P0 = fs.p0, D = fs.dir;
  const den = D.x*Darr.y - D.y*Darr.x; if (Math.abs(den) < 1e-6) return false;
  const t = ((Q.x - P0.x)*Darr.y - (Q.y - P0.y)*Darr.x)/den, a = Math.abs(signedDeg(D, Darr));
  return t >= GAP && project(Q, { x:P0.x + D.x*t, y:P0.y + D.y*t }, Darr) >= GAP && a >= 1 && a <= 179;
}
/* A beam end meets its heading-for optic: centred from its steering mirror, snapped onto an existing
   path if close and reachable (outputs follow it), else just aimed (new ends). Returns the option and D. */
const SNAP_DEG = 10;                             // widest miss that still lines up
function autoJoin(holder, key, target, ahead = null){   // ahead: where it meets the optic (headingFor)
  const ops = joinOptions(holder, key, target, ahead ? ahead.face : "in"), plain = ops.find(o => !o.along) || ops[0];
  const node = nodeOf(target.id), s = tailOf(holder);
  if (!node || !s || !plain) return { op:plain, D:null };
  const Q = ahead ? ahead.p : node.p, st = steererOf(s), v = st ? unit({ x:Q.x - st.at.x, y:Q.y - st.at.y }) : s.dir;
  const cands = ops.filter(o => o.along).map(o => ({ o, D:arrivalDir(o, node) })).filter(c => c.D);
  const ang = (a, b) => Math.acos(clamp(a.x*b.x + a.y*b.y, -1, 1))*180/Math.PI;
  if (node.retro){                               // a roof's two ways in: the one nearer the course
    const near = c => Math.abs(project(c.Q, s.p0, leftNormal(s.dir)));
    const c = cands.map(c => ({ ...c, Q:faceOf(c.o, node) })).sort((a, b) => near(a) - near(b))[0];
    const vc = c && (st ? unit({ x:c.Q.x - st.at.x, y:c.Q.y - st.at.y }) : s.dir);
    return c && ang(vc, c.D) <= SNAP_DEG && linesUp(st, s, c.Q, c.D) ? { op:c.o, D:c.D } : { op:plain, D:null };
  }
  if (node.pair){                                // mirror pair: on its way in, or back down its way out
    const c = cands.find(c => c.o.along === (ahead && ahead.face === "out" ? "back" : "fwd"));
    return c && ang(v, c.D) <= SNAP_DEG && linesUp(st, s, Q, c.D) ? { op:c.o, D:c.D } : { op:plain, D:null };
  }
  let tol = SNAP_DEG;
  for (let a = 0; a < cands.length; a++) for (let b = a + 1; b < cands.length; b++) tol = Math.min(tol, 0.45*ang(cands[a].D, cands[b].D));
  let best = null, bd = Infinity;
  for (const c of cands){ const d = ang(v, c.D); if (d < bd){ bd = d; best = c; } }
  return best && bd <= tol && linesUp(st, s, Q, best.D) ? { op:best.o, D:best.D } : { op:plain, D:null };
}
/* Join holder[key]'s beam to target in scene and trace: { undo, first }, or null if the optic isn't placed
   in time or the aimed beam would hit another first. tail0: prior end length. Runs live while dragging. */
function tryJoin(holder, key, target, tail0){
  const s = target && tailOf(holder), h = s && headingFor(s);
  if (!h || h.n.el !== target) return null;
  const { op } = autoJoin(holder, key, target, h); if (!op) return null;
  const list = listOf(holder, key), oldTail = holder[key], undoAims = aimState(), id0 = nextId;
  const { first, rest, tail } = op.make(), added = [first, ...rest];
  first.tail0 = tail0 ?? oldTail;
  giveIds(added);
  list.push(...added);
  if (tail != null) holder[key] = tail;
  inserting = null; closeInsMenu();
  indexScene(); tr = trace(scene);
  const undo = () => {
    list.splice(list.length - added.length, added.length); holder[key] = oldTail;
    undoAims(); nextId = id0;                    // the aiming turned and slid optics: put them back
    indexScene(); tr = trace(scene);
  };
  const at = tr.nodes.find(n => n.el === first), way = at && tr.segs[at.segIn], block = way && headingFor(way, target);
  if (added.flatMap(allLinks).some(l => l._miss === "unplaced") || (block && block.t < way.geo - 1)){ undo(); return null; }
  return { undo, first };
}

/* ---------- disconnecting ----------
   A join's links run to the beam's next own optic (or end). Disconnecting removes that run and what rode
   on it; an emptied end returns to its prior length, or stops short. */
function linkRun(o){                             // o: a link's row → [i, j) of its list, the run from it
  const L = o.list, i = L.indexOf(o.el); let j = i + 1;
  while (j < L.length && L[j].type === "link") j++;
  return [i, j];
}
/* The link starting a list's closing run of links, or null. */
function endRun(list){
  let i = list.length; while (i > 0 && list[i - 1].type === "link") i--;
  return i < list.length ? list[i] : null;
}
function disconnect(o){
  const L = o.list, [i, j] = linkRun(o); if (i < 0) return "";
  const gone = L.splice(i, j - i), first = gone[0];
  const ids = new Set();                         // optics on removed links' outputs go too
  (function scan(list){ for (const el of list){ if (el.type !== "link") ids.add(el.id); scan(el.branch || []); if (el.arms) for (const k in el.arms) scan(el.arms[k].list); } })(gone);
  if (ids.size) cullLinksTo(ids);
  if (i === L.length) o.holder[o.key] = first.tail0 ?? Math.max(GAP, Math.round((first._d > 0 ? first._d : DEFAULT_TAIL)*0.7));
  sel = i < L.length ? L[i].id : endId(o.holder);
  inserting = null; closeInsMenu();
}
/* An optic's joins in its panel, each with Disconnect. */
function joinedByHTML(el){                       // listed first, for quick undo
  const own = objects.byId.get(el.id);
  const visits = objects.rows.filter(r => r.kind === "el" && r.el.type === "link" && r.el.ref === el.id);
  if (!visits.length) return "";
  return `<div class="struct">` + heading("Joined by") + visits.map(r => `<div class="row"><label>${esc(beamName(r.holder))}${own && r.src === own.src ? ", again" : ""}</label>`
    + `<button class="mini" data-unjoin="${r.el.id}">Disconnect</button></div>`).join("") + `</div>`;
}
/* At a beam end: its last join, if any. */
function joinedEndHTML(o){
  const first = endRun(listOf(o.holder, o.key)), ref = first && realEl(first); if (!ref) return "";
  return `<div class="row"><label>Joins</label><span class="ro">${ref._tag}</span></div>`
    + `<div class="actions"><button data-unjoin="${first.id}">Disconnect</button></div>`;
}

/* ---------- sources ----------
   A new beam: beside the selected (or last) source, same direction, unused colour, two pitches right (further if taken), snapped. */
const NEW_BEAM_NM = [532, 633, 488, 405, 561, 780, 1064];
function addSource(){
  const ref = srcOfSel() || scene.sources[scene.sources.length - 1];
  const a = ref.rot*Math.PI/180, right = { x:Math.sin(a), y:-Math.cos(a) };
  const inUse = new Set(scene.sources.flatMap(s => s.lambdas));
  const src = { ...DEFAULT_SOURCE(), rot:ref.rot, lambdas:[NEW_BEAM_NM.find(nm => !inUse.has(nm)) ?? 633],
                id:"s" + freeNumber(new Set(scene.sources.map(srcNum))) };
  for (let k = 2; k < 40; k++){
    const p = { x:ref.x + right.x*GRID*k, y:ref.y + right.y*GRID*k };
    Object.assign(src, ui.snap ? snapToGrid(p) : { x:+p.x.toFixed(1) + 0, y:+p.y.toFixed(1) + 0 });
    if (scene.sources.every(s => Math.hypot(s.x - src.x, s.y - src.y) > GRID/2)) break;
  }
  scene.sources.push(src);
  scene.sources.sort((x, y) => srcNum(x) - srcNum(y));
  inserting = null; closeInsMenu();
  sel = src.id;
  commit();
  const c = view.pt(src), W = svg.clientWidth || 800, H = svg.clientHeight || 600;
  if (c[0] < 30 || c[1] < 30 || c[0] > W - 30 || c[1] > H - 60) fitView();   // bring it into view
}
/* Remove a source and its beam (keeping one); select a neighbour. */
function removeSource(src){
  const list = scene.sources, i = list.indexOf(src);
  if (list.length <= 1 || i < 0) return false;
  list.splice(i, 1);
  sel = list[Math.min(i, list.length - 1)].id;
  inserting = null; closeInsMenu();
  return true;
}
function refreshPanel(withProps = true){ pruneMulti(); buildBrowser(); if (withProps) buildProps(); }

/* ---------- browser ---------- */
const IND = 15, PAD0 = 20;                       // indent per depth, first rail offset (px)
const rowPad = depth => PAD0 + depth*IND + 14;
let insertGaps = [];                             // targets of the browser "+" gaps, by index

/* A beam's vertical colour key. */
function beamBarCSS(nms, src){
  if (!nms || !nms.length) return "var(--line)";
  if (src && src.color) return src.color;
  const cols = sortedNums(nms).map(nm => rgb(beamColor(nm)));
  if (cols.length === 1) return cols[0];
  const step = 100/cols.length;
  return "linear-gradient(180deg," + cols.map((c, i) => `${c} ${Math.round(i*step)}% ${Math.round((i + 1)*step)}%`).join(",") + ")";
}
function railsHTML(depth, barCSS){
  let r = "";
  for (let L = 0; L < depth; L++) r += `<i class="rail guide" style="left:${PAD0 + L*IND}px"></i>`;
  return r + `<i class="rail beam" style="left:${PAD0 + depth*IND}px;background:${barCSS}"></i>`;
}
const wlLabel  = a => a.length ? [...new Set(sortedNums(a).map(fmtNm))].join("·") + " nm" : "no light";
const endLabel = o => "End of " + beamName(o.holder);
/* The detector or block a beam ends on, or null. */
const endsOnOf = o => { const s = tr.segs.find(g => g.kind === "tail" && g.holder === o.holder); return s ? s.endsOn || null : null; };
/* An optic's list and panel name: a prism by its form. */
const FIBER_NAMES = { SM:"Single-mode fiber", PM:"PM fiber", MM:"Multimode fiber" };
const typeName = el => el.type === "polygon" && PRISM_FORMS[el.form] ? PRISM_FORMS[el.form].label
                     : el.type === "fiber" ? FIBER_NAMES[fiberSpec(el).kind] : ELEMENTS[el.type].name;
function badges(el){
  let b = "";
  if (el.type === "splitter") b = `<span class="bdg">R ${el.R}%</span>`;
  if (el.type === "dichroic") b = `<span class="bdg dic">${passAbbr(el)}·${el.cut}</span>`;
  if (el.type === "grating")  b = `<span class="bdg dic">${el.geom === "reflective" ? "R" : "T"}·${linesPerMm(el)}/mm</span>`;
  if (el.type === "polygon")  b = `<span class="bdg">n${el.n.toFixed(3)}</span>`;
  if (el.type === "axicon")   b = `<span class="bdg">${el.alpha}°</span>`;
  if (el.type === "aperture") b = `<span class="bdg">Ø ${fx(el.ap*2)}</span>`;
  if (el.type === "filter")   b = `<span class="bdg dic">${el.cwl}/${el.bw}</span>`;
  if (WAVEPLATES[el.type])    b = `<span class="bdg">${el.axis}°</span>`;
  if (el.type === "faraday")  b = `<span class="bdg">${el.rotation}°</span>`;
  if (BRANCHING.has(el.type) && el.disp === "cube") b += `<span class="bdg">cube</span>`;
  if (el.type === "lens" && HOUSED.has(el.shape)) b = `<span class="bdg">${el.shape}</span>`;
  if (el.type === "fiber") b = `<span class="bdg">NA ${fiberSpec(el).NA}</span>`;
  if (el.type === "scanner")  b = `<span class="bdg">${scannerFacets(el)} facets</span>`;
  if (el.type === "retro")    b = `<span class="bdg">Δ ${fx(2*Math.abs(el.off))}</span>`;
  if (el.type === "diffuser") b = `<span class="bdg">±${el.scatter}°</span>`;
  if (el.type === "eom")      b = `<span class="bdg">${el.effect === "deflection" ? `δ ${el.dev}°` : eomRet(el.ret)}</span>`;
  if (el.type === "pair"){ const n = nodeOf(el.id); if (n && n.pair) b = `<span class="bdg">${n.pair.n}×</span>`; }
  if (el.type === "shutter")  b = shutterBadge(el);
  if (HARMONIC[el.type])      b = `<span class="bdg dic">→ ${nlcOut(el)}</span>`;

}
/* A shutter's clickable state in the list. */
const shutterBadge = el => `<span class="bdg${el.open ? "" : " warn"}" data-shut="${el.id}" role="button" title="${el.open ? "Close" : "Open"} the shutter">${el.open ? "open" : "closed"}</span>`;

function buildBrowser(){
  const arriving = new Map(), atEnd = new Map();   // wavelengths reaching each element / beam end
  for (const nd of tr.nodes) arriving.set(nd.el, tr.segs[nd.segIn].chans.map(c => c.nm));
  for (const s of tr.segs) if (s.kind === "tail" && !atEnd.has(s.holder))   // a beam that ends on a detector or block: what reaches it
    atEnd.set(s.holder, (s.endsOn && s.prev != null ? tr.segs[s.prev] : s).chans.map(c => c.nm));
  insertGaps = [];
  const gap = (list, idx, depth) => {
    insertGaps.push({ list, idx });
    return `<div class="ins-gap" data-insgap="${insertGaps.length - 1}" style="padding-left:${rowPad(depth)}px"><span class="ln"></span><span class="pl"><svg viewBox="-8 -8 16 16" width="16" height="16" aria-hidden="true">${PLUS_ICON}</svg></span></div>`;
  };
  let rowSrc = null;                             // the beam the row being written is on, for its colour key
  const row = ({ cls, pick, depth, nms, tag, name, extra = "", dist }) =>
    `<div class="obj${cls}" data-pick="${pick}" style="padding-left:${rowPad(depth)}px">${railsHTML(depth, beamBarCSS(nms, rowSrc))}`
    + `${tag}<span class="nm">${name}</span>${extra}<span class="d">${dist}</span></div>`;
  const selCls = id => sel === id || multi.has(id) ? " sel" : "";
  // Folding: a closed head hides its rows and summarizes them. hidden(h): some holder up to the source is closed.
  const hidden = h => { for (; h; h = objects.parentOf.get(h)) if (ui.closed.has(h.id)) return true; return false; };
  const fold = (holder, depth) => `<span class="fold${ui.closed.has(holder.id) ? " closed" : ""}" data-fold="${holder.id}" style="left:${PAD0 + depth*IND - 15}px"></span>`;
  const within = (h, top) => { for (; h; h = objects.parentOf.get(h)) if (h === top) return true; return false; };
  const closedBadge = holder => { if (!ui.closed.has(holder.id)) return ""; let n = 0; for (const r of objects.rows) if (r.kind === "el" && within(r.holder, holder)) n++; return `<span class="bdg">${n} optic${n !== 1 ? "s" : ""}</span>`; };

  const polBadge = src => !src.pol ? "" : `<span class="bdg">${src.polMode === "unpolarized" ? "Unpol" : "Lin p"}</span>`;
  let h = "";
  for (const o of objects.rows){
    if (o.kind === "ann") continue;              // listed after every beam
    rowSrc = o.src || objects.srcOf.get(o.holder) || null;
    if (o.kind === "src"){                       // each beam opens with its source
      const src = o.src;
      h += row({ cls:" source" + selCls(src.id), pick:src.id, depth:0, nms:src.lambdas, tag:fold(src, 0) + `<span class="tag">${srcTag(src)}</span>`,
                 name:beamName(src), extra:closedBadge(src) + polBadge(src), dist:fmtWL(src.lambdas) });
      continue;
    }
    if (hidden(o.kind === "branchhead" ? objects.parentOf.get(o.holder) : o.holder)) continue;
    else if (o.kind === "el" && o.el.type === "link"){   // a visit: optic tag, its beam, any miss
      const el = o.el, ref = realEl(el), orow = ref && objects.byId.get(ref.id), same = orow && orow.src === o.src;
      const bdg = (el._miss ? `<span class="bdg warn">${MISS[el._miss]}</span>` : "") + (ref && ref.type === "shutter" ? shutterBadge(ref) : "")
        + `<span class="bdg">${!ref ? "gone" : same ? "again" : esc(beamName(orow.holder))}</span>`;
      h += gap(o.list, o.list.indexOf(el), o.depth)
         + row({ cls:selCls(el.id), pick:el.id, depth:o.depth, nms:arriving.get(el) || [], tag:`<span class="tag lk">${el._tag}</span>`,
                 name:ref ? typeName(ref) : "Link", extra:bdg, dist:el._miss ? "—" : `${fx(el._d ?? 0)} mm` });
    }
    else if (o.kind === "el"){
      const el = o.el;
      h += gap(o.list, o.list.indexOf(el), o.depth)
         + row({ cls:selCls(el.id), pick:el.id, depth:o.depth, nms:arriving.get(el) || [], tag:`<span class="tag">${el._tag}</span>`,
                 name:typeName(el), extra:badges(el), dist:`${el.d} mm` });
    }
    else if (o.kind === "branchhead"){
      const nms = atEnd.get(o.holder) || [];
      h += row({ cls:" bh", pick:o.origin.id, depth:o.depth, nms, tag:fold(o.holder, o.depth) + `<span class="tag bh">↳</span>`,
                 name:beamName(o.holder), extra:closedBadge(o.holder), dist:wlLabel(nms) });
    }
    else {
      const list = isSource(o.holder) ? o.holder.chain : o.key === "branchTail" ? (o.holder.branch || (o.holder.branch = [])) : o.holder.list;
      h += gap(list, list.length, o.depth)
         + row({ cls:" end" + selCls(o.id), pick:o.id, depth:o.depth, nms:atEnd.get(o.holder) || [], tag:`<span class="tag">—</span>`,
                 name:endLabel(o), dist:endsOnOf(o) ? `at ${endsOnOf(o)._tag}` : `${o.holder[o.key]} mm` });
    }
  }
  if (scene.annotations.length){                 // then the annotations, each with what it reads
    h += `<div class="ann-hd">Annotations</div>`;
    for (const a of scene.annotations)
      h += `<div class="obj ann${selCls(a.id)}" data-pick="${a.id}" style="padding-left:${rowPad(0)}px"><span class="tag">${ANN_TYPES[a.type].tag}</span>`
        + `<span class="nm">${esc(annName(a))}</span>${a.type === "label" && a.bold ? `<span class="bdg">bold</span>` : ""}<span class="d">${annValue(a)}</span></div>`;
  }

}
/* An annotation in the browser: a label by its text. */
function annName(a){
  if (a.type !== "label") return ANN_TYPES[a.type].name;

const annValue = a => a.type === "ruler" ? fmtLen(rulerLength(a)) : a.type === "protractor" ? fmtDeg(protractorAngles(a).deg) : "";

/* ---------- properties ---------- */
const numField = (label, key, value, step, unit = "", attrs = "") =>

/* Angle spinner step: ROT_SNAP with Snap on. */
const rotField = n => ui.snap ? ROT_SNAP : n;
const heading  = text => `<div class="row"><label>${text}</label></div>`;
const readout  = (label, key, el) => `<div class="row"><label>${label}</label><span class="ro" data-ro="${key}">${liveRO(key, el)}</span></div>`;
/* Computed panel values; syncLiveProps refreshes them while typing. */
const LIVE_RO = {
  lpmm:  el => `${linesPerMm(el)} /mm`,
  zeroth:el => `${fx(180 - 2*Math.abs(el.tilt))}°`,
  ft:    el => `${fx(tangentialF(el))} mm`,
  axDev: el => { const b = axiconDeflection(el, axisLambda(el)); return b == null ? "reflected inside" : `${fx(b)}°`; },
  polIn: (el, via) => linesPol(arrivingChans(el, via)),
  polOut:(el, via) => { const n = passNode(el, via); return n && n.pol ? linesPol(arrivingChans(el, via).map(c => ({ nm:c.nm, J:jonesApply(c.J, n.pol) }))) : "no light"; },
  polLeave:(el, via) => { const n = passNode(el, via); return n && n.leave ? linesPol(n.leave) : "no light"; },
  pbsT:  (el, via) => { const ch = arrivingChans(el, via); return ch.length ? linesPol(ch, J => pct(J.a)) : "—"; },
  pbsR:  (el, via) => { const ch = arrivingChans(el, via); return ch.length ? linesPol(ch, J => pct(J.b)) : "—"; },
  hgConv:(el, via) => harmonicWords(el, passNode(el, via)),
  fibEta:(el, via) => {                          // one line's coupling on one pass: via = "<element id>~<line>"
    const [id, k] = via.split("~"), n = tr.nodes.find(x => x.el.id === id), c = n && n.fiber && n.fiber.couple[+k];
    return c ? pct(c.eta) : "—"; },
  mfd:     el => { const nm = axisLambda(el); return `${fx(2e3*modeRadius(fiberSpec(el), nm))} µm at ${fx(nm)} nm`; },
  fibMatch:el => { const c = arrivingChan(el); if (!c) return "—"; const b = bestCollimator(fiberSpec(el), c); return `${fx(b.f)} mm, ${pct(b.eta)}`; },
  fibOut:  el => { const F = fiberSpec(el), o = fiberOutput(F, { end:el.outEnd, f:el.fOut }, axisLambda(el));
    return el.outEnd === "collimator" ? `Ø ${fx(2*o.W)} mm` + (F.kind === "MM" ? `, spreading ${fx(o.th*1e3)} mrad` : "")
                                      : `NA ${Math.sin(Math.atan(o.th)).toFixed(3)}`; },
  pairN:   el => { const n = nodeOf(el.id), g = n && n.pair; return !g ? "—" : g.trapped ? `${g.n}+, trapped` : String(g.n); },
};
/* A readout key may name a pass: "polIn@e11" is element e11's pass. */
const liveRO = (key, el) => { const [k, via] = key.split("@"); return LIVE_RO[k](el, via); };
/* Every pass through an optic: owner's and each link's. */
const passesOf = el => tr.nodes.filter(n => n.link ? n.ref === el : n.el === el);
const passNode = (el, via) => via ? tr.nodes.find(n => n.el.id === via) || null : nodeOf(el.id);
/* Lines reaching an element on a pass, with power and polarization. */
function arrivingChans(el, via){
  const node = passNode(el, via);

/* What a crystal converted on a pass: each conversion's share. */
function harmonicWords(el, n){
  const from = HARMONIC[el.type] === 2 ? fmtNm(el.pm) : `${fmtNm(el.pm)} + ${fmtNm(el.pm/2)}`;
  if (!n || !n.harm || !n.harm.length) return `no ${from} nm light`;
  return n.harm.map(h => `${pct(h.share)} of ${h.from.map(fmtNm).join(" + ")} nm`).join("\n");

/* A pass's name: its beam, plus "again" on a return through its own optic. */
function passName(el, n){
  const s = tr.segs[n.segIn], own = objects.byId.get(el.id);
  return beamName(s.holder) + (n.link && own && own.src === s.src ? ", again" : "");
}
/* What reaches a detector or block, per pass: each line's share of emission and its state. */
function arrivalHTML(el, title){
  const ps = passesOf(el);
  if (!ps.length) return "";
  const rows = ps.map(n => {
    const s = tr.segs[n.segIn], ch = mergeLines(s.chans), many = ch.length > 1;   // several lines: one each, states where they differ
    const own = s.src.pol && new Set(ch.map(c => polKey(c.J))).size > 1;
    const text = !ch.length ? "no light" : ch.map(c => `${fmtNm(c.nm)} nm · ${pct(c.pow)}` + (own ? ` · ${describePol(c.J)}` : "")).join("\n")
      + (s.src.pol && !own ? (many ? "\n" : " · ") + describePol(ch[0].J) : "");
    return `<div class="row"><label>${esc(passName(el, n))}</label><span class="ro">${text}</span></div>`;
  }).join("");

}

/* ---------- glass dispersion editor ----------

const DG = { W:244, H:132, l:40, r:14, t:8, b:20 };   // viewBox size and plot margins
let dispDrag = null;                             // { which, el, yr, y0, v0, n1, n2, q }

function dispYRange(el, [lo, hi]){

function dispGraphMarkup(el){

  const pw = DG.W - DG.l - DG.r, ph = DG.H - DG.t - DG.b, bot = DG.t + ph;
  const X = lam => DG.l + (lam - lo)/(hi - lo)*pw, Y = v => DG.t + (yr[1] - v)/(yr[1] - yr[0])*ph;
  const txt = (x, y, anchor, t) => `<text x="${fx(x)}" y="${fx(y)}" text-anchor="${anchor}" font-size="9.5" fill="var(--ink3)">${t}</text>`;
  let g = `<defs><clipPath id="dispClip"><rect x="${DG.l}" y="${DG.t}" width="${pw}" height="${ph}"/></clipPath></defs>`
    + `<rect x="${DG.l}" y="${DG.t}" width="${pw}" height="${ph}" rx="2" fill="var(--field)" stroke="var(--line)"/>`;

    const x = X(i*xs);
    g += `<path d="M${fx(x)},${DG.t}V${bot}" stroke="var(--line)" stroke-width=".6"/>` + txt(x, bot + 12, "middle", i*xs);
  }
  const ys = niceStep((yr[1] - yr[0])/4), dec = Math.max(0, -Math.floor(Math.log10(ys) + 1e-9));

    g += `<path d="M${DG.l},${fx(y)}H${DG.l + pw}" stroke="var(--line)" stroke-width=".6"/>` + txt(DG.l - 4, y + 3.2, "end", (i*ys).toFixed(dec));
  }
  g += txt(3, bot + 12, "start", "nm");          // λ unit, in the corner under the n labels
  // solid across the handles, dashed when extrapolated
  const run = (a, b) => { if (b <= a) return ""; const pts = [];

    + (c.exact ? `<path d="${run(lo, hi)}"/>`

  for (const nm of sourceLines(srcOfEl(el)))    // where each of the beam's lines sits on the curve
    g += `<circle cx="${fx(X(nm))}" cy="${fx(Y(c.at(nm)))}" r="3.2" fill="${rgb(beamColor(nm))}" stroke="var(--panel)" stroke-width="1"/>`;
  const H = [["hi", DISP_NM[0], c.n1], ["mid", DISP_NM[1], c.at(DISP_NM[1])], ["lo", DISP_NM[2], c.n2]];
  for (const [k, lam, v] of H){
    const x = X(lam), y = Y(v);
    g += k === "mid"
      ? `<circle cx="${fx(x)}" cy="${fx(y)}" r="5" fill="var(--accent)" stroke="var(--panel)" stroke-width="1.5"/>`
      : `<rect x="${fx(x - 4.5)}" y="${fx(y - 4.5)}" width="9" height="9" rx="1.5" fill="var(--accent)"/>`;
    g += `<circle data-dh="${k}" cx="${fx(x)}" cy="${fx(y)}" r="11" fill="transparent" style="cursor:ns-resize"/>`;
  }
  if (dispDrag){                                 // readout for the handle in hand
    const [, lam, v] = H.find(h => h[0] === dispDrag.which);
    g += `<text x="${DG.l + pw - 5}" y="${DG.t + 13}" text-anchor="end" font-size="10" fill="var(--ink2)">n ${v.toFixed(4)} at ${lam} nm</text>`;
  }

     width="${(w*mm).toFixed(2)}mm" height="${(h*mm).toFixed(2)}mm" viewBox="${bx0} ${by0} ${w} ${h}">

/* ---------- saving files ----------

const MIME = { svg:"image/svg+xml", json:"application/json" };

const downloadsCap = hosted ? Promise.resolve().then(() => window.claude.use("downloads")).catch(() => null) : Promise.resolve(null);
let statusTimer = 0;
function flashStatus(msg, ms = 3000){             // a note in the status line, then back to the scene summary

function browserDownload(filename, blob){

  const cap = await Promise.race([downloadsCap, new Promise(r => setTimeout(r, 1500, null))]);
  if (cap){
    try { await cap.save({ filename, data:blob }); flashStatus("Saved " + filename); return; }
    catch (err){
      const code = err && err.code;

/* Field k's value checked against its default: same type, valid choice, within LIMITS; else the default. */
function cleanValue(k, v, def){

function cleanList(list, ctx, depth){

function cleanElement(raw, ctx, depth){

  if (++ctx.count > MAX_OPTICS) refuse(`it has more than ${MAX_OPTICS} optics`);

/* Element ids "e<n>" are made unique; links follow the first holder. Grating arms named for their optic. Returns the highest number. */

/* The current system as a file object. */
function systemFile(){

  f.scene = JSON.parse(JSON.stringify({ exag:scene.exag, mode:scene.mode, show:scene.show, scale:scene.scale, text:scene.text, lines:scene.lines,

/* Diffable JSON: each optic on one line (arms below); other values inline if under WIDTH, else one member per line. */
function prettyJSON(v, ind = "", width = 100){
  const flat = JSON.stringify(v);
  if (v === null || typeof v !== "object") return flat;
  const inner = ind + "  ";
  if (!Array.isArray(v) && typeof v.type === "string" && "id" in v){
    const nest = Object.entries(v).filter(([k, x]) => (k === "branch" || k === "arms") && JSON.stringify(x).length > 2);
    if (!nest.length) return flat;
    const head = JSON.stringify(Object.fromEntries(Object.entries(v).filter(([k]) => !nest.some(([n]) => n === k))));
    return head.slice(0, -1) + nest.map(([k, x]) => `,\n${inner}${JSON.stringify(k)}:${prettyJSON(x, inner, width)}`).join("") + "\n" + ind + "}";
  }
  if (flat.length + ind.length <= width) return flat;
  const items = Array.isArray(v) ? v.map(x => inner + prettyJSON(x, inner, width))
    : Object.entries(v).map(([k, x]) => inner + JSON.stringify(k) + ": " + prettyJSON(x, inner, width));
  return Array.isArray(v) ? `[\n${items.join(",\n")}\n${ind}]` : `{\n${items.join(",\n")}\n${ind}}`;
}

/* Make a checked system live: replace scene fields, reset selection and panel, fit the view. Throws if undrawable (openSystem restores). */
function adopt(sys){

  scene.scale = sys.scene.scale; scene.text = sys.scene.text; scene.lines = sys.scene.lines; scene.annotations = sys.scene.annotations;
  nextId = sys.top + 1;

  tool = null; placing = null; snapCue = null; syncToolButtons();

/* Open a system file. label: status note ("" none; a function gets the doc); undo offers the old system back. */

});
saveDlg.addEventListener("keydown", e => {         // Enter in a one-line field, or Ctrl/Cmd+Enter, saves
  if (e.isComposing) return;
  const mod = e.ctrlKey || e.metaKey;
  if (e.key === "Enter" && (mod || e.target.tagName === "INPUT")){ e.preventDefault(); confirmSave(); }
});
saveDlg.addEventListener("close", () => document.getElementById("save").focus());

/* ---------- new: a blank system, after confirming ----------
   One empty source, defaults, no name. Cancel, Escape or an outside click keeps the layout. */
const newDlg = document.getElementById("newDlg");
const BLANK_SYSTEM = () => ({ format:FILE_FORMAT, version:FILE_VERSION, scene:{ sources:[{}] } });
function openNewDialog(){
  if (newDlg.open || saveDlg.open) return;
  closeInsMenu(); inserting = null;
  newDlg.showModal();
  newDlg.querySelector('[data-new="cancel"]').focus();   // the safe choice under Enter
}
function startNewSystem(){
  newDlg.close();
  openSystem(BLANK_SYSTEM(), { stem:"scene", label:"New system", undo:false });
}
newDlg.addEventListener("click", e => {
  if (e.target === newDlg){ newDlg.close(); return; }     // on the backdrop, outside the window
  const b = e.target.closest("[data-new]"); if (!b) return;
  if (b.dataset.new === "ok") startNewSystem(); else newDlg.close();
});
newDlg.addEventListener("close", () => document.getElementById("newSys").focus());
document.getElementById("newSys").addEventListener("click", openNewDialog);

/* ---------- info window ----------
   Info, at the top of the gear menu (or ?): copyright, issues link and controls. Done, Escape or an
   outside click closes it. */
const keysDlg = document.getElementById("keysDlg");
const MAC = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent || "");
function keysHTML(){
  const K = (...ks) => ks.map(k => `<kbd>${k}</kbd>`).join(""), or = `<span class="or">or</span>`;
  const mod = MAC ? "⌘" : "Ctrl", alt = MAC ? "⌥" : "Alt";
  const sect = t => `<tr><th colspan="2">${t}</th></tr>`;
  const row = (keys, what) => `<tr><td>${keys}</td><td>${what}</td></tr>`;
  const arrows = K("←", "→", "↑", "↓"), brackets = K("[", "]"), del = K(MAC ? "Delete" : "Del");
  return sect("Selected optic")
    + row(arrows, "Move along its beam")
    + row(brackets, "Rotate")
    + row(K("Space"), "Open or close a shutter")
    + sect("Selected source")
    + row(arrows, "Move")
    + row(brackets, "Rotate")
    + sect("Annotations")
    + row(K("R"), "Ruler")
    + row(K("A"), "Protractor")
    + row(K("T"), "Label")
    + sect("View")
    + row(K("0"), "Show all")
    + row(K("1"), "Zoom to 100%")
    + sect("Anywhere")
    + row(K("Shift"), "Hold for larger steps")
    + row("Snap on", "Turns land on multiples of 11.25°")
    + row(K("?"), "Show these controls")
    + sect("With the mouse")
    + row("Click a beam", "Add an optic there")
    + row("Double-click a shutter", "Open or close it")
    + row("Double-click a label", "Edit its text")
    + row("Drag a vertex", "Reshape a prism, or bend a fiber's cable")
    + row("Right-click", "Remove a prism corner or a cable point, or coat a face")
    + row(K(alt) + " click ▾", "Fold or unfold every beam");
}
function openKeys(){
  if (keysDlg.open || saveDlg.open || newDlg.open) return;
  closeInsMenu(); setViewMenu(false); inserting = null;
  document.getElementById("keysTable").innerHTML = keysHTML();
  keysDlg.showModal();
  keysDlg.querySelector("[data-keys]").focus();
}
keysDlg.addEventListener("click", e => {
  if (e.target === keysDlg || e.target.closest("[data-keys]")) keysDlg.close();   // Done, or the backdrop outside the window
});
keysDlg.addEventListener("close", () => gearBtn.focus());   // the controls open from the view settings (or ?)
document.getElementById("showKeys").addEventListener("click", openKeys);
{ const bar = document.querySelector(".bar"), stage = document.querySelector(".stage");
  const fit = () => stage.style.setProperty("--bar-h", bar.offsetHeight + "px");
  new ResizeObserver(fit).observe(bar); fit(); }

/* ---------- undo open ---------- */
function offerUndo(before){ ui.undo = before; document.getElementById("undoOpen").hidden = false; }
function dropUndo(){ if (!ui.undo) return; ui.undo = null; document.getElementById("undoOpen").hidden = true; }
document.getElementById("undoOpen").addEventListener("click", () => {
  const u = ui.undo; if (!u) return;
  dropUndo();
  adopt(cleanSystem(u.file));
  Object.assign(doc, u.doc);
  flashStatus("Back to " + (doc.name || "the system before"));
});

/* ---------- open: button, drop ---------- */
const openInput = document.getElementById("openFile");
document.getElementById("open").addEventListener("click", () => openInput.click());
openInput.addEventListener("change", () => { const f = openInput.files[0]; openInput.value = ""; if (f) openLocalFile(f); });
document.getElementById("save").addEventListener("click", openSaveDialog);
const stage = document.querySelector(".stage");
const carriesFiles = e => !!e.dataTransfer && [...e.dataTransfer.types].includes("Files");
addEventListener("dragover", e => { if (!carriesFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = "copy"; stage.classList.add("drop"); });
addEventListener("dragleave", e => { if (!e.relatedTarget) stage.classList.remove("drop"); });   // left the window
addEventListener("drop", e => {
  stage.classList.remove("drop");
  if (!carriesFiles(e)) return;
  e.preventDefault();
  const f = e.dataTransfer.files[0]; if (f) openLocalFile(f);
});

/* ---------- boot: a blank system ---------- */
{
  openSystem(BLANK_SYSTEM(), { stem:"scene", undo:false });
  requestAnimationFrame(fitView);
}
</script>
</body>
</html>
