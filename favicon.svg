<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- optical table, 2x2 holes (browser tab): hole = 0.26 x pitch, as M6 (~6.6 mm) on a 25 mm grid -->
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D3D7DA"/><stop offset="1" stop-color="#BCC1C5"/></linearGradient>
    <radialGradient id="h" cx=".45" cy=".4" r=".6"><stop offset="0" stop-color="#14171A"/><stop offset="1" stop-color="#2E3439"/></radialGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#t)"/>
  <g fill="url(#h)"><circle cx="8.00" cy="8.00" r="2.08"/><circle cx="24.00" cy="8.00" r="2.08"/><circle cx="8.00" cy="24.00" r="2.08"/><circle cx="24.00" cy="24.00" r="2.08"/></g>
