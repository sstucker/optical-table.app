    const { X, u } = line(h, m), k = (X.x - F.x)*N.x + (X.y - F.y)*N.y, j = u.x*N.x + u.y*N.y;
    const X2 = { x:X.x - 2*k*N.x, y:X.y - 2*k*N.y }, u2 = { x:u.x - 2*j*N.x, y:u.y - 2*j*N.y };
    const ud = u2.x*Dout.x + u2.y*Dout.y; if (ud < lim) return null;
    const s = -((X2.x - A.x)*Dout.x + (X2.y - A.y)*Dout.y)/ud;
    return { h:(X2.x + u2.x*s - A.x)*no.x + (X2.y + u2.y*s - A.y)*no.y, m:(u2.x*no.x + u2.y*no.y)/ud };
  };
  const before = new Map(), byCi = chanIndex(beam.chans);
  beam.rays = beam.rays.filter(r => { const c = byCi.get(r.ci); return c && lands(c.h + r.h*K, c.m + r.m*K); });
  beam.chans = beam.chans.filter(c => {
    const o = off(c.h, c.m); if (!o) return false;
    before.set(c.ci, { h:c.h, m:c.m }); c.h = o.h; c.m = o.m; c.J = mirrorJ(c.J); return true;
  });
  beam.rays = beam.rays.filter(r => {
    const b = before.get(r.ci); if (!b) return false;
    const o = off(b.h + r.h, b.m + r.m), c = byCi.get(r.ci); if (!o) return false;
    r.h = o.h - c.h; r.m = o.m - c.m; return true;
  });
  beam.dir = Dout;
  seg.cutEnd = N; seg.cutEndAt = { ...F }; beam.cut = N; beam.cutAt = { ...F };   // rays end and start on the facet itself
}

/* Shutter: open, clips to its opening; closed, stops everything. The axis runs on dark. */
function stepShutter(T, route, beam, el){
  if (!el.open){ beam.chans = []; beam.rays = []; }
}

/* Diffuser: each ray turned by a seeded random angle within ±scatter, the same at every wavelength
   and every trace. Chief rays go straight. Each line's q is kept and M² grows: the scatter adds in
   quadrature to M²λ/πW. Polarization unchanged. */
const newSeed = () => 1 + Math.floor(Math.random()*2147483646);
const rayRandom = (seed, k) => mulberry32((seed ^ Math.imul(k + 1, 0x9E3779B1)) | 0)();   // one draw per ray, in [0, 1)
function stepDiffuser(T, route, beam, el){
  const sc = clamp(el.scatter, 0, 60)*RAD, ts = Math.tan(sc), byCi = chanIndex(beam.chans);
  if (sc <= 0) return;
  for (const c of beam.chans){
    const M2 = c.m2 || 1, iq = cInv(c.q), W = Math.sqrt(-c.lam*M2/(Math.PI*iq.im));
    const M2n = Math.PI*W*Math.hypot(c.lam*M2/(Math.PI*W), ts)/c.lam;
    c.q = cInv({ re:iq.re, im:iq.im*M2n/M2 }); c.m2 = M2n;
  }
  const s = srcNum(route.src)*7919;
  beam.rays = beam.rays.filter(r => r.draw !== "fill");   // an axicon's edge rays no longer bound the fan
  for (const r of beam.rays){
    const c = byCi.get(r.ci), m0 = c ? c.m : 0;
    const a = clamp(Math.atan(m0 + r.m) + (2*rayRandom(el.seed + s, r.ri) - 1)*sc, -85*RAD, 85*RAD);
    r.m = Math.tan(a) - m0;
  }
  // Rays now cross, so reindex by slope; the fill spans the outermost two
  for (const c of beam.chans){
    const rs = beam.rays.filter(r => r.ci === c.ci).sort((p, q) => p.m - q.m || p.ri - q.ri);
    rs.forEach((r, i) => { r.ri = i; delete r.draw; });
  }
}

/* Axicon (§3): each ray takes the cone's slope at its height, per-line indices giving different
   angles. Thin, no power: q and state unchanged. TIR rays are lost.
   The tip splits the fan: ri across the tip are moved apart, each half filled separately, and each
   half gets an edge ray from the tip (draw "fill", never drawn). A ray on the tip goes straight,
   drawn as a ray but left out of the fill (draw "rays"). */
function stepAxicon(T, route, beam, el){
  const out = axiconRefractor(el), chiefIn = new Map();
  beam.chans = beam.chans.filter(c => {
    const m = out(c.h, c.m, c.nm); if (m == null) return false;
    chiefIn.set(c.ci, c.m); c.m = m; return true;
  });
  const byCi = chanIndex(beam.chans), at = new Map();   // ray → arriving height, slope and side of the tip
  beam.rays = beam.rays.filter(r => {
    const c = byCi.get(r.ci); if (!c) return false;
    const h = c.h + r.h, mIn = chiefIn.get(r.ci) + r.m, m = out(h, mIn, c.nm); if (m == null) return false;
    at.set(r, { h, mIn, side:Math.abs(h) < 1e-9 ? 0 : Math.sign(h) }); r.m = m - c.m; return true;
  });
  const edges = [];
  const edgeRay = (from, side, mIn, ri) => {     // leaving the tip on `side`, having arrived at slope mIn
    const c = byCi.get(from.ci), m = out(side*1e-6, mIn, c.nm);
    if (m != null) edges.push({ ...from, id:from.id + (side > 0 ? "_tipU" : "_tipD"), ri, h:-c.h, m:m - c.m, draw:"fill" });
  };
  for (const c of beam.chans){                   // walk each fan in order, opening at the tip
    const rs = beam.rays.filter(r => r.ci === c.ci).sort((p, q) => p.ri - q.ri), ri0 = rs.map(r => r.ri);
    let shift = 0;
    for (let i = 0; i < rs.length; i++){
      const r = rs[i];
      if (i && at.get(rs[i - 1]).side !== at.get(r).side && ri0[i] === ri0[i - 1] + 1){   // light runs on across the tip between them
        const p = rs[i - 1], A = at.get(p), B = at.get(r);
        const m0 = A.side === 0 ? A.mIn : B.side === 0 ? B.mIn : A.mIn + (B.mIn - A.mIn)*A.h/(A.h - B.h);   // the fan's slope at the tip
        if (A.side) edgeRay(p, A.side, m0, p.ri + 1); else p.draw = "rays";
        if (!B.side) r.draw = "rays";
        shift += A.side && B.side ? 3 : 2;       // free slots either side: edge, gap, edge (or the tip ray)
        if (B.side) edgeRay(r, B.side, m0, ri0[i] + shift - 1);
      }
      r.ri = ri0[i] + shift;
    }
  }
  beam.rays.push(...edges);
}

/* Ideal thin lens f (mm): Gaussian q and ray slopes. */
function focus(beam, f){
  if (!isFinite(f) || f === 0) return;
  for (const c of beam.chans){ c.q = lensQ(c.q, f); c.m -= c.h/f; }
  for (const r of beam.rays) r.m -= r.h/f;
}
function stepLens(T, route, beam, el){ focus(beam, el.f); }
/* Detector and block absorb everything. */
function stepAbsorb(T, route, beam){ beam.chans = []; beam.rays = []; beam.absorbed = true; }

/* Curved mirror in-plane focal length: f·cos(90° − δ/2). */
const tangentialF = el => el.f*Math.abs(Math.sin(el.angle*Math.PI/360));

/* Ideal bandpass: channels pass or stop by wavelength. */
function stepFilter(T, route, beam, el){
  const pass = filterPasses(el);
  beam.chans = beam.chans.filter(c => pass(c.nm));
  beam.rays  = beam.rays.filter(r => pass(r.nm));
}

/* Wave plate: each state turns about the fast axis by the retardance; node.pol keeps the matrix. */
function stepWaveplate(T, route, beam, el, node){
  const M = plateMatrix(el);
  node.pol = M;
  for (const c of beam.chans) c.J = jonesApply(c.J, M);
}
/* Faraday rotator (§3): each state rotated at the axis wavelength. Thin. */
function stepFaraday(T, route, beam, el, node){
  const M = rotatorMatrix(el.rotation);
  node.pol = M;
  for (const c of beam.chans) c.J = jonesApply(c.J, M);
}
/* EOM (§3), thin. Retarder: states turn about the crystal axis by ret. Deflector: rays turn dev
   about a straight axis, so later optics stay; q and state unchanged. */
function stepEom(T, route, beam, el, node){
  if (el.effect === "deflection"){
    const a = clamp(el.dev, -15, 15)*RAD; if (!a) return;
    const turn = m => Math.tan(Math.atan(m) + a), was = new Map(beam.chans.map(c => [c.ci, c.m]));
    for (const c of beam.chans) c.m = turn(c.m);
    const byCi = chanIndex(beam.chans);
    for (const r of beam.rays){ const m0 = was.get(r.ci); if (m0 != null) r.m = turn(m0 + r.m) - byCi.get(r.ci).m; }
    return;
  }
  const M = retarder(el.axis, 2*Math.PI*clamp(el.ret, -1, 1));
  node.pol = M;
  for (const c of beam.chans) c.J = jonesApply(c.J, M);
}

/* Nonlinear crystal (§3, harmonics): each matched line gives up its converted share as a new line
   on its chief ray, same q, rays 1/√k. Fully converted lines end. Thin. Node keeps harm and leave.
   A harmonic made on a later pass is its own line. */
function stepHarmonic(T, route, beam, el, node){
  const k = HARMONIC[el.type], f = clamp(el.conv, 0, 100)/100, near = (nm, to) => Math.abs(nm - to) <= PM_TOL;
  const made = [], rays = [], harm = [], gone = new Set();
  const tagFor = c => { let t = "h" + k, n = 0;   // a channel id no line in the beam has yet
    while ([...beam.chans, ...made].some(x => x.ci === c.ci + t)) t = "h" + k + String.fromCharCode(98 + n++);
    return t; };
  const emit = (c, P) => {                       // the harmonic of line c, carrying power P
    const t = tagFor(c), h = { ...c, nm:c.nm/k, lam:c.lam/k, ci:c.ci + t, q:{ ...c.q }, pow:P, J:harmonicState(el, c.J) };
    made.push(h);
    for (const r of beam.rays) if (r.ci === c.ci)
      rays.push({ ...r, id:r.id + "_" + t, ci:h.ci, nm:h.nm, h:r.h/Math.sqrt(k), m:r.m/Math.sqrt(k), pow:r.pow*P/c.pow });
  };
  const deplete = (c, lost) => {                 // line c, less power lost
    const keep = 1 - lost/c.pow;
    if (keep < EXTINCTION){ gone.add(c.ci); return; }
    c.pow *= keep;
    for (const r of beam.rays) if (r.ci === c.ci) r.pow *= keep;
  };
  if (k === 2){
    for (const c of beam.chans.filter(c => near(c.nm, el.pm))){
      harm.push({ from:[c.nm], share:f });
      if (f < EXTINCTION) continue;
      emit(c, f*c.pow); deplete(c, f*c.pow);
    }
  } else {
    const twos = beam.chans.filter(c => near(c.nm, el.pm/2));
    for (const c1 of beam.chans.filter(c => near(c.nm, el.pm))){
      const c2 = twos.shift(); if (!c2) break;
      const N = f*Math.min(c1.pow, c2.pow/2);    // pairs, as fundamental power: a harmonic photon carries twice it
      harm.push({ from:[c1.nm, c2.nm], share:3*N/(c1.pow + c2.pow) });
      if (N < EXTINCTION*c1.pow) continue;
      emit(c1, 3*N); deplete(c1, N); deplete(c2, 2*N);
    }
  }
  beam.chans = beam.chans.filter(c => !gone.has(c.ci)).concat(made);
  beam.rays = beam.rays.filter(r => !gone.has(r.ci)).concat(rays);
  node.harm = harm;
  node.leave = beam.chans.map(c => ({ nm:c.nm, J:c.J, pow:c.pow }));
}

/* Fiber (§3): input end A square to the beam; output where the list continues. Node keeps ends and cable. */
function stepFiber(T, route, beam, el, node){
  const ends = fiberEnds(el, beam.p, beam.dir);
  node.fiber = { ends, cable:fiberCable(el, ends) };
  fiberPass(T, route, beam, el, node, ends.in, ends.out, el.key, 0, 0);
}
/* Carry the beam through fiber el from `entry` to `exit`, with axis offset off (mm) and tilt (rad).
   Each line keeps its coupled share (node.fiber.couple); near-zero lines drop. Output has the source's ray count. */
function fiberPass(T, route, beam, el, node, entry, exit, key, off, tilt){
  const F = fiberSpec(el), src = route.src, NR = clamp(Math.round(src.rays || 11), 1, 401);
  const frac = rayFractions({ profile:src.profile === "gaussian" ? "gaussian" : "even" }, NR);
  const couple = [], chans = [], rays = [];
  for (const c of beam.chans){
    const eta = clamp(fiberCoupling(F, entry, c, off + c.h, Math.tan(Math.atan(c.m) + tilt)), 0, 1);
    couple.push({ nm:c.nm, eta });
    if (!(eta >= EXTINCTION)) continue;
    const out = fiberEmission(F, exit, { ...c, pow:c.pow*eta, J:fiberPolarization(F, c.J, key) }, frac, node.el.id);
    chans.push(out.chan); rays.push(...out.rays);
  }
  node.fiber = { ...node.fiber, couple, entry, exit };
  node.dirOut = { ...exit.dir };
  beam.p = { ...exit.p }; beam.dir = { ...exit.dir }; beam.chans = chans; beam.rays = rays;
  beam.cut = null; beam.arc = null; beam.ap = exit.end === "collimator" ? el.ap : FC.ferrule;
}
/* Visiting a fiber (§2): "back" enters the output and leaves the input; otherwise input to output.
   Couples by its offset and angle; one on the owner's path is taken as aligned; a loose one need only meet the end. */
function stepFiberVisit(T, route, beam, link, target){
  const ref = target.el, E = target.fiber.ends, back = link.along === "back", neg = v => ({ x:-v.x, y:-v.y });
  const entry = back ? { ...E.out, dir:neg(E.out.dir) } : E.in, exit = back ? { ...E.in, dir:neg(E.in.dir) } : E.out;
  const D = beam.dir, N = entry.dir, dn = D.x*N.x + D.y*N.y;
  if (dn < 0.02){ link._miss = "misses"; return; }             // from behind the end, or along its face: the beam runs on
  const t = ((entry.p.x - beam.p.x)*N.x + (entry.p.y - beam.p.y)*N.y)/dn;
  if (t < 0.5){ link._miss = "behind"; return; }
  const at = { x:beam.p.x + D.x*t, y:beam.p.y + D.y*t }, side = project(entry.p, beam.p, leftNormal(D));
  let off = project(at, entry.p, leftNormal(N)), tilt = signedAngle(N, D);
  const half = (entry.end === "collimator" ? collimatorR(ref.ap) : FC.nutR) + FACE_SLACK;
  link._miss = Math.abs(off) > half || (!link.loose && Math.abs(side) > 0.1) ? "misses" : "";
  if (!link.loose && !link._miss && Math.abs(tilt) < 1e-3){ off = 0; tilt = 0; }
  link._d = r3(t);
  const seg = advance(T, route, beam, t, t, link, "free");
  const node = { el:link, ref, eff:ref, link:true, p:{ ...beam.p }, dirIn:{ ...D }, segIn:seg.i };
  T.nodes.push(node);
  fiberPass(T, route, beam, ref, node, entry, exit, back ? -ref.key : ref.key, off, tilt);
}

/* Plate: exact Snell per ray, reduced length t/n(λ) per line (focus shift). Axis drawn at the axis λ. */
function stepWindow(T, route, beam, el, node){
  node.dirOut = { ...beam.dir };
  const nOf = glassCurve(el).at, memo = new Map();
  const n = nm => { let v = memo.get(nm); if (v === undefined) memo.set(nm, v = nOf(nm)); return v; };
  for (const r of beam.rays){
    const sn = r.m/Math.hypot(1, r.m), sg = sn/n(r.nm);
    r.mg = sg/Math.sqrt(Math.max(1e-12, 1 - sg*sg));
  }
  advance(T, route, beam, el.t, el.t/n(T.refLam), el, "glass", c => el.t/n(c.nm));
}

/* Mirror, curved mirror, splitter, dichroic: deflect by el.angle. */
function stepFold(T, route, beam, el, node, seg){
  const dIn = { ...beam.dir };
  const dRefl = rot(beam.dir, el.angle*Math.PI/180);
  const N = unit({ x:dRefl.x - dIn.x, y:dRefl.y - dIn.y });     // fold-plane normal
  node.N = N;
  seg.cutEnd = N; beam.cut = N;                  // rays end and restart exactly on the fold plane
  if (BRANCHING.has(el.type) && el.disp === "cube") throughCube(beam, el);
  if (el.type === "curved"){                     // rays meet the drawn face, not the plane
    const Rd = mirrorDrawRadius(el);
    if (isFinite(Rd)){
      const arc = { id:el.id, c:{ x:beam.p.x + N.x*Rd, y:beam.p.y + N.y*Rd }, r:Math.abs(Rd) };
      seg.arcEnd = arc; beam.arc = arc;
    }
  }

  if (BRANCHING.has(el.type)){
    // Two outputs: reflected (turned, parity flipped) and transmitted. Power split by R (splitter),
    // by wavelength (dichroic), by polarization (PBS, s reflected). Shares under EXTINCTION drop.
    // The chain follows el.follow; the other walks the branch.
    let share;                                   // channel → [reflected share, state, transmitted share, state]
    if (el.type === "splitter"){ const R = clamp(el.R/100, 0.01, 1); share = c => [R, c.J, 1 - R, c.J]; }
    else if (el.type === "dichroic"){
      const reflects = dichroicReflects(el);
      share = c => reflects(c.nm) ? [1, c.J, 0, c.J] : [0, c.J, 1, c.J];
    }
    else share = c => [c.J.b, S_STATE, c.J.a, P_STATE];
    const output = (dir, flip) => {
      const sg = flip ? -1 : 1, frac = new Map(), chans = [];
      for (const c of beam.chans){
        const sh = share(c), f = flip ? sh[0] : sh[2], J = flip ? mirrorJ(sh[1]) : sh[3];
        if (f < EXTINCTION) continue;
        frac.set(c.ci, f);
        chans.push({ ...c, q:{ ...c.q }, pow:c.pow*f, J, h:sg*c.h, m:sg*c.m });
      }
      return { dir, chans, rays:beam.rays.filter(r => frac.has(r.ci))
        .map(r => ({ ...r, pow:r.pow*frac.get(r.ci), h:sg*r.h, m:sg*r.m })) };
    };
    const refl = output(dRefl, true), trans = output(dIn, false);
    const [main, other] = el.follow === "reflected" ? [refl, trans] : [trans, refl];
    if (route.depth < MAX_BRANCH_DEPTH)
      walkSub(T, { list:el.branch || (el.branch = []), holder:node.el, key:"branchTail", depth:route.depth + 1, src:route.src },   // node.el: the list element (a link, when el is its effective form)
           { p:{ ...beam.p }, dir:{ ...other.dir }, chans:other.chans, rays:other.rays, cut:N, ap:el.ap, last:seg.i });
    beam.dir = { ...main.dir }; beam.chans = main.chans; beam.rays = main.rays;
    node.dirOut = { ...dRefl };                  // grip and glyph show the reflection
    node.dirMain = { ...main.dir };              // where the list continues, for joins
    return;
  }

  // Mirrors: the chain follows the reflection.
  beam.dir = dRefl;
  for (const c of beam.chans){ c.h = -c.h; c.m = -c.m; c.J = mirrorJ(c.J); }   // reflection flips parity
  for (const r of beam.rays){  r.h = -r.h; r.m = -r.m; }
  if (el.type === "curved") focus(beam, tangentialF(el));
}

/* A curved mirror as drawn: arc with the true rim sag, or enough to read as curved. Drawing only. Signed radius (mm), + concave. */
function mirrorDrawRadius(el){
  const a = Math.max(0.5, el.ap), R = 2*el.f;
  if (!isFinite(R) || R === 0) return Infinity;
  const sag = Math.max(sagMag(R, a), a*clamp(0.1 + 1.2*a/Math.abs(R), 0.1, 0.4));
  return Math.sign(R)*(a*a + sag*sag)/(2*sag);
}

/* A cube: the beam crosses ap·√2 of glass, shifting focus by t(1 − 1/n(λ)) per wavelength. */
function throughCube(beam, el){
  const t = el.ap*Math.SQRT2, nOf = glassCurve(el).at, memo = new Map();
  const shift = nm => { let v = memo.get(nm); if (v === undefined) memo.set(nm, v = t*(1 - 1/nOf(nm))); return v; };
  for (const c of beam.chans){ const d = shift(c.nm); c.h -= c.m*d; c.q = { re:c.q.re - d, im:c.q.im }; }
  for (const r of beam.rays) r.h -= r.m*shift(r.nm);
}

/* Vector grating equation: tangential out = in + m·λ/d. Transmission keeps the normal's sign, reflection flips it. */
function stepGrating(T, route, beam, el, node, seg){
  const dIn = { ...beam.dir }, nIn = leftNormal(dIn);
  const tilt = el.tilt*Math.PI/180, refl = el.geom === "reflective";
  const N = rot(dIn, -tilt);                     // grating normal
  const g = rot(dIn, Math.PI/2 - tilt);          // along the grating face
  const sgn = refl ? -1 : 1;
  const pitch = Math.max(0.05, el.pitch)*1e-3;   // µm → mm

  // outgoing direction for slope mTot at lam (mm), order k; null if evanescent
  const dirOf = (mTot, lam, k) => {
    const d = rot(dIn, Math.atan(mTot));
    const sO = d.x*g.x + d.y*g.y + k*lam/pitch;
    if (Math.abs(sO) > 1) return null;
    const cO = Math.sqrt(1 - sO*sO);
    return unit({ x:sO*g.x + sgn*cO*N.x, y:sO*g.y + sgn*cO*N.y });
  };
  // a ray at hTot meets the grating plane here, across the outgoing axis
  const dNN = dIn.x*N.x + dIn.y*N.y, nNN = nIn.x*N.x + nIn.y*N.y;
  const hitOffset = (hTot, nOut) => {
    const t = -hTot*nNN/dNN;
    const Px = hTot*nIn.x + dIn.x*t, Py = hTot*nIn.y + dIn.y*t;
    return Px*nOut.x + Py*nOut.y;
  };

  const orders = sortedNums(el.orders);
  const axisDir = new Map();                     // outgoing axis per propagating order, at the axis λ
  for (const k of orders){ const d = dirOf(0, T.refLam*NM, k); if (d) axisDir.set(k, d); }
  let main = gratingMain(el);                    // the order the chain follows
  if (!axisDir.has(main)){                       // evanescent: 0, else lowest ≥ 0, else lowest
    const live = orders.filter(k => axisDir.has(k));
    main = live.includes(0) ? 0 : (live.find(k => k >= 0) ?? live[0] ?? null);
  }
  seg.cutEnd = N; beam.cut = N;
  node.grating = { N, g, refl };

  const diffract = (k, chans, rays) => {
    const Dk = axisDir.get(k), nOut = leftNormal(Dk);
    const outC = [], outR = [], inBy = chanIndex(chans), outBy = new Map();
    for (const c of chans){
      const dC = rot(dIn, Math.atan(c.m)), dO = dirOf(c.m, c.lam, k);
      if (!dO) continue;
      // anamorphic magnification cosθ_out/cosθ_in
      const Mf = Math.abs(dO.x*N.x + dO.y*N.y)/Math.max(1e-9, Math.abs(dC.x*N.x + dC.y*N.y));
      const out = { ...c, q:{ re:c.q.re*Mf*Mf, im:c.q.im*Mf*Mf }, h:hitOffset(c.h, nOut), m:slopeRel(Dk, dO),
                    J:refl ? mirrorJ(c.J) : c.J };
      outC.push(out); outBy.set(c.ci, out);
    }
    for (const r of rays){
      const cIn = inBy.get(r.ci), cOut = outBy.get(r.ci);
      if (!cOut) continue;
      const dO = dirOf(cIn.m + r.m, cIn.lam, k);
      if (!dO) continue;
      outR.push({ ...r, h:hitOffset(cIn.h + r.h, nOut) - cOut.h, m:slopeRel(Dk, dO) - cOut.m });
    }
    return { chans:outC, rays:outR };
  };

  if (route.depth < MAX_BRANCH_DEPTH) for (const k of orders){
    if (k === main || !axisDir.has(k)) continue;
    const arm = gratingArmFor(el, k), out = diffract(k, beam.chans, beam.rays);
    walkSub(T, { list:arm.list, holder:arm, key:"tail", depth:route.depth + 1, src:route.src },
         { p:{ ...beam.p }, dir:{ ...axisDir.get(k) }, chans:out.chans, rays:out.rays, cut:N, ap:el.ap, last:seg.i });
  }
  if (main == null){ beam.chans = []; beam.rays = []; return; }
  const out = diffract(main, beam.chans, beam.rays);
  beam.chans = out.chans; beam.rays = out.rays; beam.dir = { ...axisDir.get(main) };
}

/* Convex glass body: refract in, follow internal legs (TIR), refract out. The axis follows the reference λ; others are offsets. */
function stepPolygon(T, route, beam, el, visit = el){   // visit: the list element (a link, when el is its effective form)
  const dIn = { ...beam.dir }, V = polyVerts(el), nOf = glassCurve(el).at, mir = new Set(el.mirrors || []);
  const axis = refractPath(V, { x:0, y:0 }, { x:1, y:0 }, nOf(T.refLam), mir);
  if (!axis){                                    // the axis misses the glass: pass straight on
    const seg = advance(T, route, beam, el.d, el.d, visit, "free");
    const node = { el:visit, p:{ ...beam.p }, dirIn:{ ...dIn }, segIn:seg.i, poly:{ V, dIn:{ ...dIn } }, dirOut:{ ...beam.dir } };
    T.nodes.push(node);
    beam.ap = el.ap;
    return node;
  }
  // The feed segment ends on the entry face, xe from the anchor.
  const xe = axis.entry.x, feed = Math.max(1, el.d + xe);
  const feedSeg = advance(T, route, beam, feed, feed, visit, "free");
  const anchor = { x:beam.p.x + dIn.x*(el.d - feed), y:beam.p.y + dIn.y*(el.d - feed) };
  const toModel  = L => localToModel(anchor, dIn, L);
  const dirModel = L => { const n = leftNormal(dIn); return unit({ x:L.x*dIn.x + L.y*n.x, y:L.x*dIn.y + L.y*n.y }); };
  const node = { el:visit, p:{ ...anchor }, dirIn:{ ...dIn }, segIn:feedSeg.i, poly:{ V, dIn:{ ...dIn } } };
  T.nodes.push(node);
  beam.ap = el.ap;
  feedSeg.cutEnd = dirModel(axis.entryN);        // free rays meet the entry face

  // A ray must cross the axis's faces, or the shared cut planes are wrong.
  const nLegs = axis.legs.length;
  const sameFace = (a, b) => a.x*b.x + a.y*b.y > 0.999;     // outward normals align
  const followsAxis = o => !!o && o.legs.length === nLegs && sameFace(o.entryN, axis.entryN)
    && o.legs.every((L, k) => sameFace(L.endN, axis.legs[k].endN));
  // Offsets were taken at the entry face (x = xe); back-project to x = 0 by slope·xe.
  const launch = (h, m, nm) => refractPath(V, { x:0, y:h - m*xe }, slopeDir(m), nOf(nm), mir);

  const chanPath = new Map();                    // ci → full glass path of that channel's chief ray
  beam.chans = beam.chans.filter(c => {
    const o = launch(c.h, c.m, c.nm);
    if (!followsAxis(o)) return false;
    chanPath.set(c.ci, o); return true;
  });
  const byCi = chanIndex(beam.chans), rayPath = new Map();
  beam.rays = beam.rays.filter(r => {
    const c = byCi.get(r.ci); if (!c) return false;
    const o = launch(c.h + r.h, c.m + r.m, c.nm);
    if (!followsAxis(o)) return false;
    rayPath.set(r, o); return true;
  });

  // Polarization through bare glass (§3): Fresnel at entry and exit, TIR phases, along the axis.
  // Coated faces reflect as diag(1, −1).
  const nA = nOf(T.refLam), cosAt = (D, N) => Math.abs(D.x*N.x + D.y*N.y);
  const faceJones = k => k === 0 ? fresnelTransmit(cosAt({ x:1, y:0 }, axis.entryN), 1, nA)
    : k < nLegs ? (axis.legs[k - 1].coated ? diagJones(cx(1), cx(-1)) : fresnelTIR(cosAt(axis.legs[k - 1].D, axis.legs[k - 1].endN), nA, 1))
    : fresnelTransmit(cosAt(axis.legs[nLegs - 1].D, axis.exitN), nA, 1);
  const throughFace = k => {                     // k: 0 entry, 1…nLegs−1 bounces, nLegs exit
    const M = faceJones(k), t = new Map();
    for (const c of beam.chans){ const o = jonesPass(c.J, M); c.J = o.J; c.pow *= o.t; t.set(c.ci, o.t); }
    for (const r of beam.rays) r.pow *= t.get(r.ci) ?? 1;
  };

  for (let k = 0; k < nLegs; k++){               // one glass segment per internal leg
    throughFace(k);
    const aL = axis.legs[k], legDir = dirModel(aL.D), nLeg = leftNormal(legDir);
    const p0 = toModel(aL.P0), len = Math.hypot(aL.P1.x - aL.P0.x, aL.P1.y - aL.P0.y);
    const offset = P => { const q = toModel(P); return (q.x - p0.x)*nLeg.x + (q.y - p0.y)*nLeg.y; };
    for (const c of beam.chans){
      const L = chanPath.get(c.ci).legs[k];
      c.h = offset(L.P0); c.m = slopeRel(legDir, dirModel(L.D));
    }
    for (const r of beam.rays){
      const L = rayPath.get(r).legs[k], c = byCi.get(r.ci);
      r.h = offset(L.P0) - c.h; r.mg = slopeRel(legDir, dirModel(L.D)) - c.m;
    }
    beam.cut = dirModel(k === 0 ? axis.entryN : axis.legs[k - 1].endN);
    beam.dir = legDir;
    advance(T, route, beam, len, len, el, "glass").cutEnd = dirModel(aL.endN);
  }

  const outAxis = dirModel(axis.exitD), nOut = leftNormal(outAxis), exitM = toModel(axis.exit);
  const exitOffset = o => {                      // launch offset at exitM so the ray passes its true exit
    const q = toModel(o.exit), dx = q.x - exitM.x, dy = q.y - exitM.y;
    const perp = dx*nOut.x + dy*nOut.y, lon = dx*outAxis.x + dy*outAxis.y;
    return perp - slopeRel(outAxis, dirModel(o.exitD))*lon;
  };
  for (const c of beam.chans){
    const o = chanPath.get(c.ci);
    c.h = exitOffset(o); c.m = slopeRel(outAxis, dirModel(o.exitD));
  }
  for (const r of beam.rays){
    const o = rayPath.get(r), c = byCi.get(r.ci);
    r.h = exitOffset(o) - c.h; r.m = slopeRel(outAxis, dirModel(o.exitD)) - c.m;
  }
  throughFace(nLegs);
  beam.dir = outAxis; beam.p = { ...exitM }; node.dirOut = { ...outAxis };
  beam.cut = dirModel(axis.exitN);               // outgoing rays meet the exit face too
  return node;
}

/* Furthest a beam can run from the apex and meet both faces: off/sin(45° ± tilt) ≤ ap·√2. */
const retroMaxOff = el => el.ap*Math.SQRT2*Math.sin((45 - Math.min(40, Math.abs(el.tilt)))*RAD);

/* Retroreflector (§3). The owner places the apex d on, off to the beam's right, turned by tilt;
   links meet it as placed (g). Traced as two flat mirrors, exact either order; only drawing needs
   each ray's order (roofEnd/Mid/Start, rayEnds). The inside is "glass" (nothing placed there).
   Light missing the opening is stopped; if the axis misses, the beam passes. Polarization kept.
   Node at the apex; inP, outP where the owner's axis enters and leaves (faceOf). */
function retroOf(el, P0, D){
  const n = leftNormal(D), A = { x:P0.x + D.x*el.d, y:P0.y + D.y*el.d };
  return retroGeom({ x:A.x - n.x*el.off, y:A.y - n.y*el.off },
                   rot({ x:-D.x, y:-D.y }, clamp(el.tilt, -40, 40)*RAD), Math.max(0.5, el.ap));
}
function stepRetro(T, route, beam, el, visit = el, g = null){
  const D = { ...beam.dir }, n = leftNormal(D), K = T.K, owner = !g;
  if (owner) g = retroOf(el, beam.p, D);
  const ax = retroPath(beam.p, D, g);
  if (!ax){
    const run = Math.max(0.5, project(g.O, beam.p, D)), seg = advance(T, route, beam, run, run, visit, "free");
    if (owner) seg.lead = run - el.d;
    const node = { el:visit, p:{ ...g.O }, dirIn:D, segIn:seg.i, retro:{ ...g, inP:{ ...beam.p }, outP:{ ...beam.p } }, dirOut:{ ...D } };
    T.nodes.push(node);
    beam.ap = el.ap;
    return node;
  }
  const feed = advance(T, route, beam, ax.t1, ax.t1, visit, "free");
  if (owner) feed.lead = ax.t1 - el.d;
  feed.cutEnd = ax.N1; feed.roofEnd = g;
  const node = { el:visit, p:{ ...g.O }, dirIn:{ ...D }, segIn:feed.i, retro:{ ...g, inP:{ ...ax.P1 }, outP:{ ...ax.P2 } } };
  T.nodes.push(node);
  beam.ap = el.ap;
  const enters = (h, m) => {                     // a line at offset h, slope m: in by the opening?
    const u = unit({ x:D.x + n.x*m, y:D.y + n.y*m });
    return !!retroPath({ x:beam.p.x + n.x*h - u.x*1e4, y:beam.p.y + n.y*h - u.y*1e4 }, u, g);
  };
  beam.chans = beam.chans.filter(c => enters(c.h, c.m));
  const byCi = chanIndex(beam.chans);
  beam.rays = beam.rays.filter(r => { const c = byCi.get(r.ci); return c && enters(c.h + r.h*K, c.m + r.m*K); });
  const reflect = () => {                        // a flat mirror through the axis's point, as stepFold
    for (const c of beam.chans){ c.h = -c.h; c.m = -c.m; c.J = mirrorJ(c.J); }
    for (const r of beam.rays){ r.h = -r.h; r.m = -r.m; }
  };
  reflect(); beam.dir = { ...ax.u1 }; beam.cut = ax.N1;
  for (const r of beam.rays) r.mg = r.m;         // inside a hollow roof the rays run straight
  const leg = advance(T, route, beam, ax.t2, ax.t2, visit, "glass");
  leg.cutEnd = ax.N2; leg.roofMid = g;
  reflect(); beam.dir = { x:-D.x, y:-D.y }; beam.cut = ax.N2; beam.roof = g;
  node.dirOut = { ...beam.dir };
  return node;
}
/* Visiting a roof: met as placed, entering by its opening. */
function stepRetroVisit(T, route, beam, link, target){
  const D = beam.dir, ax = retroPath(beam.p, D, target.retro);
  if (!ax){ link._miss = "misses"; return; }     // the beam runs on
  if (ax.t1 < 0.5){ link._miss = "behind"; return; }
  link._miss = link.along && Math.abs(project(faceOf(link, target), beam.p, leftNormal(D))) > 0.1 ? "misses" : "";
  link._d = r3(ax.t1);
  const node = stepRetro(T, route, beam, target.el, link, target.retro);
  node.ref = target.el; node.eff = target.el; node.link = true;
}

/* Mirror pair (§3). The beam runs d mm to the first bounce and zigzags; the list continues from the
   last. Each bounce is an exact flat mirror; runs between are "glass". Polarization kept. Node at the
   first bounce keeps pairGeom. */
function pairBounce(beam, seg, N){               // run seg ends on mirror N and reflects
  seg.cutEnd = N; beam.cut = N;
  for (const c of beam.chans){ c.h = -c.h; c.m = -c.m; c.J = mirrorJ(c.J); }
  for (const r of beam.rays){ r.h = -r.h; r.m = -r.m; r.mg = r.m; }   // inside the pair the rays run straight
  beam.dir = reflectDir(beam.dir, N);
}
function stepPair(T, route, beam, el){
  const D = { ...beam.dir }, feed = advance(T, route, beam, el.d, el.d, el, "free"), g = pairGeom(el, beam.p, D);
  const node = { el, p:{ ...beam.p }, dirIn:D, segIn:feed.i, pair:g };
  T.nodes.push(node);
  beam.ap = el.ap;
  clipToAperture(T, beam, el);
  let seg = feed;
  g.hits.forEach((h, k) => {                     // along the axis's path, so runs meet bounces exactly
    pairBounce(beam, seg, h.N);
    const next = g.hits[k + 1];
    if (!next){ beam.dir = { ...g.exitDir }; return; }
    const L = Math.hypot(next.P.x - h.P.x, next.P.y - h.P.y);
    beam.dir = { x:(next.P.x - h.P.x)/L, y:(next.P.y - h.P.y)/L };
    seg = advance(T, route, beam, L, L, el, "glass");
    beam.p = { ...next.P };
  });
  if (g.trapped){ beam.chans = []; beam.rays = []; }   // light that never gets out: none goes on
  node.dirOut = { ...beam.dir };
  return node;
}
/* Visiting a pair: bounces while it lands on the mirrors. Coming back the owner's way out, it retraces and leaves along the way in. */
function stepPairVisit(T, route, beam, link, target){
  const g = target.pair, D = { ...beam.dir };
  let hit = pairHit(g, beam.p, D);
  if (!hit){ link._miss = "misses"; return; }    // the beam runs on
  if (hit.t < 0.5){ link._miss = "behind"; return; }
  link._miss = link.along && Math.abs(project(faceOf(link, target), beam.p, leftNormal(D))) > 0.1 ? "misses" : "";
  link._d = r3(hit.t);
  let seg = advance(T, route, beam, hit.t, hit.t, link, "free");
  const node = { el:link, ref:target.el, eff:target.el, link:true, p:{ ...beam.p }, dirIn:D, segIn:seg.i };
  T.nodes.push(node);
  beam.ap = target.el.ap;
  for (let k = 0; k < PAIR_MAX && hit; k++){
    pairBounce(beam, seg, hit.N);
    hit = pairHit(g, beam.p, beam.dir);
    if (hit && k < PAIR_MAX - 1) seg = advance(T, route, beam, hit.t, hit.t, link, "glass");
  }
  if (hit){ beam.chans = []; beam.rays = []; }   // still bouncing: trapped
  node.dirOut = { ...beam.dir };
}


/* =====================================================================
   5. BEAM WIDTH QUERIES (on demand)
   ===================================================================== */
const pointAt = (s, u) => ({ x:s.p0.x + s.dir.x*s.geo*u, y:s.p0.y + s.dir.y*s.geo*u });

/* Gaussian half-width (mm) at fraction u: widest channel radius plus chief-ray offset (÷ draw gain). */
function envelopeAt(s, u, K){
  let w = 0;
  for (const c of s.chans)
    w = Math.max(w, radius({ re:c.q0.re + c.opt*u, im:c.q0.im }, c.lam*(c.m2 || 1)) + Math.abs(c.h0 + c.m*c.opt*u)/K);   // each line its own reduced length
  return w;
}
/* Sample fractions for a Gaussian envelope, densified at waists. */
function envelopeGrid(s){
  const us = new Set([0, 1]);
  for (let k = 0; k <= 60; k++) us.add(k/60);
  for (const c of s.chans){
    const z = -c.q0.re, o = c.opt;               // waist position, in that line's reduced length
    if (o > 1e-9 && z > -o && z < 2*o)
      for (let k = -30; k <= 30; k++){ const u = (z + k*c.q0.im*0.12)/o; if (u > 0 && u < 1) us.add(u); }
  }
  return sortedNums(us);
}
/* Half-width samples {u, w} (mm, before ×exag). Ray extent is constant per segment, so its ends suffice. Unlit: none. */
function widthProfile(s, sc){
  if (!s.chans.length) return [];
  if (rayDrawn(sc)) return [{ u:0, w:s.rayMax }, { u:1, w:s.rayMax }];
  return envelopeGrid(s).map(u => ({ u, w:envelopeAt(s, u, sc.exag) }));
}
/* Drawn half-width (mm) where an element is dropped. */
function beamHalfWidthAt(s, u){
  if (rayDrawn(scene)) return Math.max(s.rayMax*scene.exag, 4);
  return envelopeAt(s, u/s.geo, scene.exag)*scene.exag;
}
/* Model box around lit segments, padded by beam half-width or aperture. Frames view and export. */
function beamBounds(tr, sc){
  const b = { x0:1e9, y0:1e9, x1:-1e9, y1:-1e9 };
  for (const s of tr.segs) for (const { u, w } of widthProfile(s, sc)){
    const p = pointAt(s, u), r = Math.max(w*sc.exag, s.apA ?? 0);
    b.x0 = Math.min(b.x0, p.x - r); b.x1 = Math.max(b.x1, p.x + r);
    b.y0 = Math.min(b.y0, p.y - r); b.y1 = Math.max(b.y1, p.y + r);
  }
  return b;
}


/* =====================================================================
   6. COLOUR
   Bruton colour across the visible. UV (<380) and NIR (>780) are FALSE-COLOURED
   to stay distinct; the nm label is authoritative.
   ===================================================================== */
const colorCache = new Map();
function beamColor(nm){
  let c = colorCache.get(nm);
  if (!c){ c = computeBeamColor(nm); colorCache.set(nm, c); }
  return c;
}
function computeBeamColor(nm){
  let r, g, b, f = 1;
  if      (nm < 300){ r = .35; g = .45; b = .85; f = .6; }                  // deep UV: cool grey-blue
  else if (nm < 380){ const t = (380 - nm)/80; r = .55 - .20*t; g = .20; b = .95; f = .6 - .05*t; }
  else if (nm < 440){ r = -(nm - 440)/60; g = 0; b = 1; f = .3 + .7*(nm - 380)/60; }
  else if (nm < 490){ r = 0; g = (nm - 440)/50; b = 1; }
  else if (nm < 510){ r = 0; g = 1; b = -(nm - 510)/20; }
  else if (nm < 580){ r = (nm - 510)/70; g = 1; b = 0; }
  else if (nm < 645){ r = 1; g = -(nm - 645)/65; b = 0; }
  else if (nm <= 780){ r = 1; g = 0; b = 0; f = nm > 700 ? .45 + .55*(780 - nm)/80 : 1; }
  else if (nm <= 1100){                          // NIR false colour: crimson → purple → blue
    const t = (nm - 780)/320;
    r = .72 - .56*t; g = .06 + .13*t; b = .12 + .79*t;
  }
  else {                                         // far NIR / SWIR: blue → deep indigo, still separable
    const t = clamp((nm - 1100)/900, 0, 1);
    r = .16 - .07*t; g = .19 - .13*t; b = .91 - .42*t;
  }
  const ch = v => Math.round(255*Math.pow(clamp(v*f, 0, 1), .85));
  return [ch(r), ch(g), ch(b)];
}
/* Optional per-beam colour (src.color) from Trubetskoy's palette, for close wavelengths. */
const BEAM_PALETTE = [["#E6194B", "Red"], ["#F58231", "Orange"], ["#FFE119", "Yellow"], ["#3CB44B", "Green"], ["#469990", "Teal"],
                      ["#42D4F4", "Cyan"], ["#4363D8", "Blue"], ["#911EB4", "Purple"], ["#F032E6", "Magenta"], ["#9A6324", "Brown"]];
/* The colour line nm of src's beam is drawn in. */
const lineColor = (src, nm) => src && src.color ? hexRGB(src.color) : beamColor(nm);
const rgb  = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const mixc = (c, t, to) => rgb(c.map(v => Math.round(v + (to - v)*t)));
/* A dichroic's tint: its reflected band's colour. */
function dichroicColor(el){
  return beamColor(el.pass === "longpass" ? el.cut - 70 : el.cut + 70);   // longpass reflects short
}


/* =====================================================================
   7. FIGURE
   ===================================================================== */
const makeView = (S, ox, oy) => ({ S, ox, oy,
  pt:  p => [p.x*S + ox, -p.y*S + oy],
  inv: (x, y) => ({ x:(x - ox)/S, y:-(y - oy)/S }) });

const FIG_FONT = "Helvetica, Arial, sans-serif";
/* Materials: fill colour and opacity with outlines on (op) and off (solo). Glass faint blue,
   metal and structure grey; solo fills about twice as heavy. Ferrite solid dark grey. */
const materials = (dark, ink) => dark
  ? { glass:{ fill:"#9BBDD9", op:.15, solo:.30 }, metal:{ fill:ink, op:.15, solo:.32 }, ferrite:{ fill:"#4B5058" }, cyl:CYL_DARK }
  : { glass:{ fill:"#5A85AA", op:.13, solo:.30 }, metal:{ fill:ink, op:.15, solo:.36 }, ferrite:{ fill:"#4A4D52" }, cyl:CYL_LIGHT };
/* Cylinder shading for housed optics, lit from above: body tone, highlight, core shadow.
   CYL_SHADE scales each ramp toward flat (0) to sit with the 2D glyphs. Chrome: objective barrel;
   white: its collar; black: tubes and cones; green: 16× band; silver: EOM housing (more modelled). */
const CYL_SHADE = { objective:.15, tube:.25, galvo:.25, mems:.2, eom:.6, dump:.3 };   // galvo barrel, MEMS package, beam dump
const CYL_LIGHT = {
  chrome:["#C4CAD0", "#E8ECEF", "#969FA7"], white:["#E3E6E9", "#F9FAFB", "#AAB1B8"],
  black: ["#2A2E33", "#4C535B", "#15171A"], green:["#47AF64", "#8FD8A2", "#2A7B41"],
  silver:["#DCDEE0", "#F7F8F8", "#AEB2B6"] };
const CYL_DARK = {
  chrome:["#737C84", "#98A1AA", "#4C535A"], white:["#A9B1B8", "#CBD2D8", "#7E878E"],
  black: ["#2F343A", "#4F575F", "#1F2227"], green:["#3A8D53", "#61B37A", "#265F38"],
  silver:["#959BA1", "#BFC4C9", "#666C72"] };
function readScreenPalette(){
  const root = document.documentElement, cs = getComputedStyle(root), v = n => cs.getPropertyValue(n).trim();
  const theme = root.getAttribute("data-theme");
  const dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const ink = v("--ink"), bg = v("--bg") || "#fff";
  return { ink, ink2:v("--ink2"), ink3:v("--ink3"), accent:v("--accent"), bg,
           ...materials(dark, ink), dark, font:FIG_FONT, mono:FIG_FONT,
           halo:theme === "gray" ? bg : null };   // table text gets a halo against the dark holes
}
/* A text halo w px wide, where the palette has one. */
const textHalo = (pal, w) => pal.halo ? ` style="stroke:${pal.halo};stroke-width:${fx(w)}px;stroke-linejoin:round;paint-order:stroke"` : "";
let screenPal = null;                            // cleared when the theme changes
const screenPalette = () => screenPal || (screenPal = readScreenPalette());
const PRINT = { ink:"#1A1A1A", ink2:"#4A4A4A", ink3:"#7A7A7A", accent:"#1A1A1A", bg:"#FFFFFF",
                ...materials(false, "#1A1A1A"), dark:false, font:FIG_FONT, mono:FIG_FONT };

/* Paint for a body of material m: ink edge sw px (or `edge`) with outlines, heavier fill without.
   k scales the fill; thin bodies fill denser, capped at 1.8×. */
function body(fig, m, { k = 1, sw = 1.5, edge, w = Infinity } = {}){
  const on = fig.outlines, op = clamp(on ? m.op*k : m.solo*Math.min(1.8, k*clamp(7/w, 1, 1.6)), 0, 1);
  return `fill="${m.fill}" fill-opacity="${fx(op)}"`
    + (on ? ` stroke="${edge || fig.pal.ink}" stroke-width="${sw}" stroke-linejoin="round"` : "");
}

const passAbbr   = el => el.pass === "shortpass" ? "SP" : "LP";
const linesPerMm = el => Math.round(1000/Math.max(0.05, el.pitch));
const screenDeg  = d => -Math.atan2(d.y, d.x)*180/Math.PI;     // rotate() angle aligning local x with d
/* Screen normal to model direction d on the label side: up, or left if vertical. */
function labelNormal(d){
  const sx = d.x, sy = -d.y; let px = -sy, py = sx;
  if (py > 1e-6 || (Math.abs(py) <= 1e-6 && px > 0)){ px = -px; py = -py; }
  return { x:px, y:py };
}
/* A label: tag (L1) over details (f = 50 mm); either may be null. Lines stack outward; T is text size (§8). */
function placeLabel(c, side, off, tag, sub, pal, T = 1){
  const x = c[0] + side.x*off, y = c[1] + side.y*off;
  const vert = Math.abs(side.y) > 0.5;
  const anchor = vert ? "middle" : (side.x < 0 ? "end" : "start");
  const lines = [];
  if (tag != null) lines.push(`font-family="${pal.font}" font-size="${fx(12.5*T)}" font-weight="600" fill="${pal.ink}"${textHalo(pal, 3.2*T)}>${esc(tag)}`);
  if (sub != null) lines.push(`font-family="${pal.mono}" font-size="${fx(10.5*T)}" fill="${pal.ink2}"${textHalo(pal, 2.8*T)}>${esc(sub)}`);
  const n = lines.length, lh = 14*T;             // first baseline: above, last line at y + 6; below, the first
  const ty = !vert ? (n > 1 ? y - 4*T : y + 4*T) // under y − 3; beside, centred on y
           : side.y < 0 ? y + 6 - lh*(n - 1) : y - 3 + 9*T;
  return { x, y, markup:lines.map((l, i) => `<text x="${fx(x)}" y="${fx(ty + lh*i)}" text-anchor="${anchor}" ${l}</text>`).join("") };
}
/* Line weights (§8): stroke-width attributes scale by the figure's lines size; physical widths are styles, left alone. */
const scaleStrokes = (markup, L) => L === 1 ? markup : markup.replace(/stroke-width="([\d.]+)"/g, (m, w) => `stroke-width="${fx(+w*L)}"`);

/* ---------- lens outline ----------
   Curvature from power split across surfaces. Drawing only: rays use the thin-lens matrix. */
const NDISP = 1.5;                               // index assumed for drawing curvature
/* Thorlabs AC achromat radii in units of f. */
const DBL = { R1:0.63, R2:-0.46, R3:-1.28 };
const CROWN_FRAC = 0.55;                         // rim share given to the crown element

function sagMag(R, a){                           // circular sagitta at half-aperture a
  if (!isFinite(R) || R === 0) return 0;
  const aa = Math.min(a, Math.abs(R)*0.985);
  return Math.abs(R) - Math.sqrt(Math.max(0, R*R - aa*aa));
}
/* Signed bulge, + downstream; R > 0 bulges upstream. */
const bulge = (R, a) => (!isFinite(R) || R === 0) ? 0 : (R > 0 ? -1 : 1)*sagMag(R, a);

/* Surface radii for the display form, ∝ f. flip swaps and negates. */
function lensRadii(el){
  const f = (isFinite(el.f) && el.f !== 0) ? el.f : Infinity;
  let R;
  if (el.shape === "doublet") R = [DBL.R1*f, DBL.R2*f, DBL.R3*f];
  else {
    const P = 1/f;
    const [P1, P2] = el.shape === "plano" ? [0, P] : [P/2, P/2];
    R = [P1 ? (NDISP - 1)/P1 : Infinity, P2 ? -(NDISP - 1)/P2 : Infinity];
  }
  if (el.flip) R = R.reverse().map(r => isFinite(r) ? -r : r);
  return R;
}
function lensMarkup(fig, el, h){
  const S = fig.S, a = Math.max(1e-6, el.ap), cap = 0.92*h;
  const b = lensRadii(el).map(R => clamp(bulge(R, a)*S, -cap, cap));
  const gap = Math.max(3, h*0.16)*(b.length > 2 ? CROWN_FRAC : 1);
  const X = [0];                                 // rims pushed out to keep each centre positive
  for (let i = 1; i < b.length; i++) X[i] = X[i - 1] + gap + Math.max(0, -(b[i] - b[i - 1]));
  const n = b.length - 1;
  const shift = -(Math.min(X[0], X[0] + b[0]) + Math.max(X[n], X[n] + b[n]))/2;
  for (let i = 0; i < X.length; i++) X[i] += shift;

  // mean thickness: rim gap + 2/3 the bulge difference
  const piece = (i, j, k) => `<path d="M${fx(X[i])},${fx(-h)} Q${fx(X[i] + 2*b[i])},0 ${fx(X[i])},${fx(h)}`
    + ` L${fx(X[j])},${fx(h)} Q${fx(X[j] + 2*b[j])},0 ${fx(X[j])},${fx(-h)} Z"`
    + ` ${body(fig, fig.pal.glass, { k, w:Math.max(1, X[j] - X[i] + (b[j] - b[i])*2/3) })}/>`;
  const CROWN = .85, FLINT = 1.6;                // the denser flint reads darker
  if (b.length > 2)
    return el.flip ? piece(0, 1, FLINT) + piece(1, 2, CROWN)    // flint leads
                   : piece(0, 1, CROWN) + piece(1, 2, FLINT);   // crown leads
  return piece(0, 1, 1);
}

/* ---------- housed lenses ----------
   Opaque skins, drawing only. Local frame: x along the beam (px), lens plane at x = 0.
   · objective  After a Nikon 16×/0.80 W LWD: barrel with green band, white then black cone to a
                flat tip (flip: tip upstream). Lens plane D px behind the tip; nose blunter only
                for very slow lenses.
   · tube       Black lens tube centred on the plane, threaded end upstream (flip: downstream).
                Length 5·√f mm, diameter from the aperture.
   S: view scale (px/mm). */
const HOUSED = new Set(["objective", "tube"]);
function housing(el, S){
  const h = Math.max(3, el.ap*S);
  if (el.shape === "tube"){
    const H = 1.22*h + 2, f = isFinite(el.f) && el.f !== 0 ? Math.abs(el.f) : null;
    const L = Math.max(.35*H, f ? 5*Math.sqrt(f)*S : 2.4*H);     // 5·√f mm; never thinner than a ring
    const g = { H, L, Lt:.18*H, Rt:.86*H, x0:-L/2 - .18*H, x1:L/2 };   // thread: length, radius
    if (el.flip) [g.x0, g.x1] = [-g.x1, -g.x0];
    return g;
  }
  // Proportions in barrel radii H, from the photo.
  const H = Math.max(1.6*h, h + 6), Lk = .45*H, Lw = .6*H, Lb = 3.4*H, wall = Math.max(1.5, .06*H);
  const fpx = isFinite(el.f) && el.f !== 0 ? el.f*S : Infinity;
  const D  = Math.min(Lk + Lw + 1.4*H, .7*Math.abs(fpx));        // lens plane to tip, 30% of f working distance
  const rb = h*Math.abs(1 - D/fpx);                              // radius at the tip of a full-aperture beam
  const beamAt = u => u >= D ? h : rb + (h - rb)*u/D;            // ... u px back from the tip
  const Rj = clamp(beamAt(Lk) + wall, .68*H, H);                 // white–black joint, widened if needed
  const rt = clamp(rb + wall, .22*H, Rj);                        // tip: as pointed as the light allows
  const g = { H, Lk, Lw, Lb, Rj, D, rt, x0:D - Lk - Lw - Lb, x1:D };
  if (el.flip) [g.x0, g.x1] = [-g.x1, -g.x0];
  return g;
}
/* Box (px) of an optic with a body along the beam: x0 … x1 along, ±H across; null if thin. */
const bodyBox = (el, S) => el.type === "lens" && HOUSED.has(el.shape) ? housing(el, S) : el.type === "faraday" ? faradayBody(el, S)
                         : el.type === "shutter" ? shutterBody(el, S) : el.type === "eom" ? eomBody(el, S)
                         : el.type === "block" ? blockBody(el, S) : el.type === "gain" ? gainBody(el, S)
                         : HARMONIC[el.type] ? nlcBody(el, S) : null;
/* How far bodies at a segment's ends cover it (px from each end) and their max half-height, for glyph clearance. */
function housedCover(tr, s, S){
  const g = e => { const el = realEl(e); return el ? bodyBox(el, S) : null; };
  const a = g(s.prev != null ? tr.segs[s.prev].endEl : null), b = g(s.endEl);
  const start = a ? Math.max(0, a.x1) : 0, end = b ? Math.max(0, -b.x0) : 0;
  return { start, end, H:Math.max(start > 8 ? a.H : 0, end > 8 ? b.H : 0) };
}
/* A finish's vertical gradient; up = lit from −y. */
const hexRGB = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mixHex = (c, t, to) => "#" + hexRGB(c).map(v => Math.round(v + (to - v)*t).toString(16).padStart(2, "0")).join("");   // to 0 (black) or 255 (white)
function cylGradient(id, [body, hi, lo], up, k){               // k: shade strength, 0–1
  const B = hexRGB(body), toward = (c, t) => { const C = hexRGB(c); return rgb(B.map((v, i) => Math.round(v + (C[i] - v)*t*k))); };
  const stops = [[0, toward(lo, .5)], [.24, toward(hi, 1)], [.52, body], [.86, toward(lo, 1)], [1, toward(lo, .55)]];
  return `<linearGradient id="${id}" x1="0" y1="${up ? 0 : 1}" x2="0" y2="${up ? 1 : 0}">`
    + stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join("") + `</linearGradient>`;
}
function housedMarkup(fig, el, S, up){
  const { pal } = fig, g = housing(el, S), H = g.H, shade = (key, up) => fig.cyl(key, up, el.shape);
  const edge = (sw = 1.5) => fig.outlines ? ` stroke="${pal.ink}" stroke-width="${sw}" stroke-linejoin="round"` : "";
  if (el.shape === "tube"){                      // slight overlap hides the seam
    const { L, Lt, Rt } = g, lap = .8;
    return `<g${el.flip ? ' transform="scale(-1,1)"' : ""}>`
      + `<rect x="${fx(-L/2 - Lt)}" y="${fx(-Rt)}" width="${fx(Lt + lap)}" height="${fx(2*Rt)}" fill="${shade("black", up)}"${edge(1.2)}/>`
      + `<rect x="${fx(-L/2)}" y="${fx(-H)}" width="${fx(L)}" height="${fx(2*H)}" rx="1.2" fill="${shade("black", up)}"${edge()}/></g>`;
  }
  const { D, Lk, Lw, Lb, Rj, rt } = g, xk = D - Lk, xe = xk - Lw, xb = xe - Lb;   // joint, barrel end, back
  const ch = .05*H, bw = .1*H, xg = xe - .5*H;                   // back chamfer, band width and front edge
  const P = (...q) => q.map(([x, y], i) => (i ? "L" : "M") + fx(x) + "," + fx(y)).join("") + "Z";
  // barrel and cones share corners (xe, ±H) and (xk, ±Rj)
  const barrel = P([xb, -H + ch], [xb + ch, -H], [xe, -H], [xe, H], [xb + ch, H], [xb, H - ch]);
  const band   = P([xg - bw, -H], [xg, -H], [xg, H], [xg - bw, H]);
  const white  = P([xe, -H], [xk, -Rj], [xk, Rj], [xe, H]);
  const black  = P([xk, -Rj], [D, -rt], [D, rt], [xk, Rj]);
  // Fills first, outlines on top; fills overlap a hair to hide seams.
  const lap = .8;
  const whiteFill = P([xe - lap, -H], [xe, -H], [xk, -Rj], [xk, Rj], [xe, H], [xe - lap, H]);
  const blackFill = P([xk - lap, -Rj], [xk, -Rj], [D, -rt], [D, rt], [xk, Rj], [xk - lap, Rj]);
  const fill = (d, key) => `<path d="${d}" fill="${shade(key, up)}"/>`;
  const line = d => fig.outlines ? `<path d="${d}" fill="none"${edge()}/>` : "";
  return `<g${el.flip ? ' transform="scale(-1,1)"' : ""}>`
    + fill(barrel, "chrome") + fill(band, "green") + fill(whiteFill, "white") + fill(blackFill, "black")
    + line(barrel) + line(white) + line(black) + `</g>`;
}

/* A thin plate edge-on: face ±h px along t through p, backed th px along `back`. */
function plate(fig, p, t, back, h, th){
  const { P, S } = fig;
  const a  = P({ x:p.x + t.x*h/S, y:p.y + t.y*h/S }), b = P({ x:p.x - t.x*h/S, y:p.y - t.y*h/S });
  const q1 = P({ x:p.x + t.x*h/S + back.x*th/S, y:p.y + t.y*h/S + back.y*th/S });
  const q2 = P({ x:p.x - t.x*h/S + back.x*th/S, y:p.y - t.y*h/S + back.y*th/S });
  fig.markAll([a, b, q1, q2]);
  return { outline:pathD([a, b, q2, q1]) + "Z", face:pathD([a, b]) };
}

/* A curved mirror edge-on: arc of signed radius Rd (mm, + concave) through p, ±h px along t, backed th px. */
function curvedPlate(fig, p, t, n, h, th, Rd){
  const { P, S } = fig, a = h/S, Rm = Math.abs(Rd);
  const sag = u => isFinite(Rd) ? Math.sign(Rd)*(Rm - Math.sqrt(Math.max(0, Rm*Rm - u*u))) : 0;
  const at = (u, off) => P({ x:p.x + t.x*u + n.x*off, y:p.y + t.y*u + n.y*off });
  const face = [];
  for (let k = 0; k <= 24; k++){ const u = -a + 2*a*k/24; face.push(at(u, sag(u))); }
  const recede = Math.max(0, -sag(a)), backOff = -(th/S + recede);
  const rim = [at(a, backOff), at(-a, backOff)];
  fig.markAll(face.concat(rim));
  return { outline:pathD(face.concat(rim)) + "Z", face:pathD(face), recede:recede*S };
}

/* A bandpass: a thin plate tinted with its passband colour. */
function paintFilter(fig, node){
  const { P, S, pal, layers, mark } = fig, el = node.el, c = P(node.p), h = Math.max(3, el.ap*S), tpx = 5;
  const col = beamColor(el.cwl), edge = pal.dark ? rgb(col) : mixc(col, .30, 0);
  const tint = { fill:rgb(col), op:.30, solo:.36 };
  layers.optics.push(`<g id="${el._sid}" transform="translate(${fx(c[0])},${fx(c[1])}) rotate(${fx(screenDeg(node.dirIn))})">`
    + `<rect x="${fx(-tpx/2)}" y="${fx(-h)}" width="${tpx}" height="${fx(2*h)}" ${body(fig, tint, { edge, w:tpx })}/></g>`);
  mark(c[0] - h, c[1] - h); mark(c[0] + h, c[1] + h);
  fig.label(c, labelNormal(node.dirIn), h + 12, el._tag, `${el.cwl}/${el.bw}`, 34);
}

/* Build the figure: layered markup plus an estimated screen bounding box bb (frames the view;
   export crops to measured bounds, §11). asLayers marks the six groups as Inkscape layers. */
const LAYER_LABELS = { beam:"Beam", axis:"Axis", polarization:"Polarization", optics:"Optics", labels:"Labels", annotations:"Annotations", legend:"Legend" };
function buildFigure(tr, sc, view, pal, { asLayers = false } = {}){
  const layers = { beam:[], axis:[], pol:[], optics:[], labels:[], ann:[], legend:[] };
  const bb = { x0:1e9, y0:1e9, x1:-1e9, y1:-1e9 };
  const mark = (x, y) => { if (x < bb.x0) bb.x0 = x; if (y < bb.y0) bb.y0 = y; if (x > bb.x1) bb.x1 = x; if (y > bb.y1) bb.y1 = y; };
  const defs = new Map();                        // gradients, written once each ahead of the layers
  const fig = { tr, sc, pal, S:view.S, P:view.pt, K:sc.exag, layers, mark, outlines:sc.show.outlines,
    T:sc.text || 1, L:sc.lines || 1,             // the figure's text and line-weight sizes (§8)
    markAll: pts => { for (const q of pts) mark(q[0], q[1]); },
    /* Fill ref for a cylinder shade (pal.cyl key) at a skin's strength, lit from top or bottom. */
    cyl(key, up, skin){
      const id = `bench-${skin}-${key}-${up ? "u" : "d"}`;
      if (!defs.has(id)) defs.set(id, cylGradient(id, pal.cyl[key], up, CYL_SHADE[skin]));
      return `url(#${id})`;
    },
    /* Round shading for a body of colour hex at strength k. */
    shade(hex, up, k){
      const id = `bench-tint-${hex.slice(1)}-${up ? "u" : "d"}`;
      if (!defs.has(id)) defs.set(id, cylGradient(id, [hex, mixHex(hex, .6, 255), mixHex(hex, .45, 0)], up, k));
      return `url(#${id})`;
    },
    /* Element label; halfW: estimated half-width for bb. */
    label(c, side, off, tag, sub, halfW){
      if (!sc.show.labels && !sc.show.details) return;
      const T = fig.T, L = placeLabel(c, side, off, sc.show.labels ? tag : null, sc.show.details ? sub : null, pal, T);
      if (sc.show.labels && tag) halfW = Math.max(halfW, String(tag).length*4.2);   // a renamed optic's tag can run long
      layers.labels.push(L.markup); mark(L.x - halfW*T, L.y - 26*T); mark(L.x + halfW*T, L.y + 24*T);
    } };
  if (sc.mode === "beam") paintBeam(fig);         // Fill beam: shaded fan with edges, replacing rays
  else if (rayDrawn(sc)) paintRays(fig);          // the rays
  if (sc.show.axis) paintAxis(fig);
  if (sc.show.pol && sc.sources.some(s => s.pol)) paintPolarization(fig);
  paintSource(fig);
  fig.focal = [];
  for (const node of tr.nodes) if (!node.link) GLYPHS[node.el.type](fig, node);   // an optic is drawn once, by its owner
  layers.optics.push(...fig.focal);              // focal marks over every optic
  paintAnnotations(fig);                         // annotations, over everything
  if (sc.show.legend) paintLegend(fig, bb);       // the wavelength key, under the drawing
  const group = (id, parts) => !parts.length ? "" : `<g id="${id}"`
    + (asLayers ? ` inkscape:groupmode="layer" inkscape:label="${LAYER_LABELS[id]}"` : "") + `>${parts.join("")}</g>`;
  return { bb, markup: (defs.size ? `<defs>${[...defs.values()].join("")}</defs>` : "")
                     + scaleStrokes(group("beam", layers.beam) + group("axis", layers.axis) + group("polarization", layers.pol)
                     + group("optics", layers.optics)
                     + group("labels", layers.labels) + group("annotations", layers.ann) + group("legend", layers.legend), fig.L) };
}

/* Legend: one entry per drawn wavelength (harmonics included), sorted, in the line's colour (or a beam's manual colour). Wraps under the drawing at its width (min 260 px). */
function paintLegend({ tr, pal, layers, mark, T = 1 }, bb){
  if (!(bb.x1 > bb.x0)) return;
  const seen = new Map();
  for (const pc of tr.pieces){
    if (!(pc.pow > 0)) continue;
    const ink = rayStroke(pal, tr.segs[pc.seg].src, pc.nm), key = ink + "|" + fmtNm(pc.nm);
    if (!seen.has(key)) seen.set(key, { nm:pc.nm, ink });
  }
  const items = [...seen.values()].sort((a, b) => a.nm - b.nm || (a.ink < b.ink ? -1 : 1));
  if (!items.length) return;
  const fs = 10.5*T, sw = 20*T, gap = 6*T, sep = 16*T, lh = 17*T, wmax = Math.max(260*T, bb.x1 - bb.x0);
  let x = bb.x0, y = bb.y1 + 22*T;
  const out = [];
  for (const it of items){
    const text = fmtNm(it.nm) + " nm", w = sw + gap + text.length*fs*.62;
    if (x > bb.x0 && x + w > bb.x0 + wmax){ x = bb.x0; y += lh; }
    out.push(`<path d="M${fx(x)},${fx(y)}h${fx(sw)}" stroke="${it.ink}" stroke-width="2.5" stroke-linecap="round" fill="none"/>`
      + `<text x="${fx(x + sw + gap)}" y="${fx(y + .36*fs)}" font-family="${pal.mono}" font-size="${fx(fs)}" fill="${pal.ink}">${esc(text)}</text>`);
    mark(x, y - lh/2); mark(x + w, y + lh/2);
    x += w + sep;
  }
  layers.legend.push(out.join(""));
}

/* Rays: straight lines per segment, met exactly at fold planes and faces. */
function meetPlane(A, B, Q, N){                  // point on line AB that lies on the plane through Q ⟂ N
  const vx = B.x - A.x, vy = B.y - A.y, vn = vx*N.x + vy*N.y;
  if (Math.abs(vn) < 1e-9) return null;
  const t = clamp(((Q.x - A.x)*N.x + (Q.y - A.y)*N.y)/vn, -1, 2);
  return { x:A.x + vx*t, y:A.y + vy*t };
}
/* Where line AB crosses arc {c, r}, nearest B; null if it misses. */
function meetArc(A, B, arc){
  const dx = B.x - A.x, dy = B.y - A.y, fx0 = A.x - arc.c.x, fy0 = A.y - arc.c.y;
  const a = dx*dx + dy*dy, b = 2*(fx0*dx + fy0*dy), c = fx0*fx0 + fy0*fy0 - arc.r*arc.r;
  const disc = b*b - 4*a*c;
  if (a < 1e-12 || disc < 0) return null;
  const sq = Math.sqrt(disc), t1 = (-b - sq)/(2*a), t2 = (-b + sq)/(2*a);
  const t = Math.abs(t1 - 1) < Math.abs(t2 - 1) ? t1 : t2;
  return { x:A.x + dx*t, y:A.y + dy*t };
}
/* Each ray piece's drawn ends in trace order: chief at true scale, fan exaggerated, met exactly on faces. In a roof each ray follows its own face order. */
function rayEnds({ tr, P, K, mark }){
  const out = [], arcHits = new Map(), roofHits = new Map();   // "rayId|mirrorId" → hit point; rayId → its roof path
  for (const pc of tr.pieces){
    const s = tr.segs[pc.seg], n = leftNormal(s.dir);
    const oA = pc.c0 + pc.h0*K, oB = pc.c1 + pc.h1*K;
    let A = { x:s.p0.x + n.x*oA, y:s.p0.y + n.y*oA };
    let B = { x:s.p1.x + n.x*oB, y:s.p1.y + n.y*oB };
    if (s.cutStart) A = meetPlane(A, B, s.cutStartAt || s.p0, s.cutStart) || A;   // a plane through the segment's end,
    if (s.cutEnd)   B = meetPlane(A, B, s.cutEndAt || s.p1, s.cutEnd) || B;       // or an off-axis facet
    if (s.arcStart) A = arcHits.get(pc.id + "|" + s.arcStart.id) || A;
    if (s.arcEnd){ const X = meetArc(A, B, s.arcEnd); if (X){ B = X; arcHits.set(pc.id + "|" + s.arcEnd.id, X); } }
    if (s.roofStart){ const h = roofHits.get(pc.id); if (h) A = h.P2; }
    if (s.roofMid){ const h = roofHits.get(pc.id); if (h){ A = h.P1; B = h.P2; } }
    if (s.roofEnd){

      // The head's tip sits at the top, like ↻; aimed from its base along the curve, not the tangent.
      let top = 0; for (let k = 1; k < N; k++) if (ring[k][1] < ring[top][1]) top = k;
      const len = G.head + 0.6, tip = ring[top], dist = q => Math.hypot(q[0] - tip[0], q[1] - tip[1]);
      let i0 = 1; while (i0 < N/2 && dist(ring[(top + i0) % N]) < 3) i0++;
      let i1 = N - 1; while (i1 > N/2 && dist(ring[(top + i1) % N]) < len) i1--;
      const arc = []; for (let k = i0; k < i1; k += 3) arc.push(ring[(top + k) % N]);
      arc.push(ring[(top + i1) % N]);
      lines.push(pathD(arc));
      const base = ring[(top + i1) % N], bl = dist(base) || 1;   // the head runs from its base to its tip
      head(heads, tip, [tip[0] - (tip[0] - base[0])/bl*40, tip[1] - (tip[1] - base[1])/bl*40], len, G.hw + 0.4);
    }
  }
  const star = [], un = 1 - dop;
  if (un > 0.008){                               // unpolarized part: a headless three-spoke star,
    const avoid = dop > 0.008 ? [0, 90, psi*180/Math.PI] : [0, 90];   // turned clear of the p, s axes and the polarized arrow
    const gap = t => Math.min(...avoid.map(a => { const d = ((t - a) % 180 + 180) % 180; return Math.min(d, 180 - d); }));
    let best = 0, clear = -1;
    for (let t0 = 0; t0 < 60; t0++){ const c = Math.min(gap(t0), gap(t0 + 60), gap(t0 + 120)); if (c > clear){ clear = c; best = t0; } }
    for (let k = 0; k < 3; k++){
      const th = (best + 60*k)*Math.PI/180, len = Math.sqrt(un);
      star.push(pathD([pt(-Math.cos(th)*len, -Math.sin(th)*len), pt(Math.cos(th)*len, Math.sin(th)*len)]));
    }
  }
  const hw = G.halo, bg = pal.bg;
  const strokeP = (d, ink, w) => d.length ? `<path d="${d.join("")}" fill="none" stroke="${ink}" stroke-width="${fx(w)}" stroke-linecap="round" stroke-linejoin="round"/>` : "";
  const fillP = (d, ink, halo) => d.length ? `<path d="${d.join("")}" fill="${ink}"${halo ? ` stroke="${ink}" stroke-width="${hw}" stroke-linejoin="round"` : ""}/>` : "";
  const ink = AXIS_INK(pal.dark), all = [axes.k, axes.p, axes.s];
  return `<g>`
    + strokeP(all, bg, G.aw + hw) + strokeP([...star, ...lines], bg, G.w + hw) + fillP(heads, bg, true)
    + ["k", "p", "s"].map(a => strokeP([axes[a]], ink[a], G.aw)).join("")
    + strokeP(star, field || pal.ink2, G.w)
    + strokeP(lines, field || pal.ink, G.w) + fillP(heads, field || pal.ink, false) + `</g>`;
}

/* Sources: an emitter bar across the beam. */
/* A source drawing's reach (px, x along the beam, 0 at emission): back and half-width. For label, bounds and picking. h: drawn beam radius (≥ 9 px). */
const LED_DIE = 1.19;          // LED die centre, in dome radii behind emission
function sourceShape(src, h){
  switch (src.display){
    case "laser": { const H = Math.max(h + 5, 12), L = Math.max(60, 4.2*H); return { back:L + .3*H, half:H, H, L }; }
    case "led":   { const r = Math.max(h + 1, 7); return { back:2.28*r, half:1.16*r, r }; }   // back: the flange
    case "object": return { back:0, half:h };
    default:       return { back:3, half:h };
  }
}
/* A source in its own frame (beam leaves x = 0 along +x), sized from the drawn beam, not to scale:
     beam    bars across the beam
     object  an arrow across the axis, for imaging diagrams
     laser   black head, chrome front plate, band in the line colour, cable boot
     led     5 mm LED tinted its colour, die in the middle */
function sourceMarkup(fig, src, h, d){
  const { pal } = fig, sh = sourceShape(src, h), up = .9*d.x + .45*d.y >= 0;
  const edge = (sw = 1.4) => fig.outlines ? ` stroke="${pal.ink}" stroke-width="${sw}" stroke-linejoin="round"` : "";
  const lines = sourceLines(src).map(nm => lineColor(src, nm)), tint = [0, 1, 2].map(k => Math.round(lines.reduce((m, c) => m + c[k], 0)/lines.length));
  switch (src.display){
    case "object": {
      const sg = Math.abs(d.x) > 1e-6 ? Math.sign(d.x) : Math.sign(d.y), tip = -h*sg, base = tip + 8*sg;   // local −y·sign is up the page
      return `<line x1="0" y1="${fx(h*sg)}" x2="0" y2="${fx(base)}" stroke="${pal.ink}" stroke-width="1.8" stroke-linecap="round"/>`
        + `<path d="M0,${fx(tip)}L${fx(-4)},${fx(base)}L4,${fx(base)}Z" fill="${pal.ink}"/>`;
    }
    case "laser": {
      const { H, L } = sh, a = h + 2;
      return `<rect x="${fx(-L - .3*H)}" y="${fx(-.3*H)}" width="${fx(.3*H + .5)}" height="${fx(.6*H)}" fill="${fig.cyl("chrome", up, "tube")}"${edge(1.1)}/>`
        + `<rect x="${fx(-L)}" y="${fx(-H)}" width="${fx(L - 4)}" height="${fx(2*H)}" rx="2" fill="${fig.cyl("black", up, "tube")}"${edge()}/>`
        + `<rect x="${fx(-.66*L)}" y="${fx(-H + .7)}" width="${fx(.07*L)}" height="${fx(2*H - 1.4)}" fill="${rgb(tint)}" fill-opacity=".9"/>`
        + `<rect x="-4.5" y="${fx(-a)}" width="4.5" height="${fx(2*a)}" rx=".8" fill="${fig.cyl("chrome", up, "tube")}"${edge(1)}/>`;
    }
    case "led": {
      const { r } = sh;
      return `<rect x="${fx(-2.28*r)}" y="${fx(-1.16*r)}" width="${fx(.3*r)}" height="${fx(2.32*r)}" rx=".6" fill="${rgb(tint)}" fill-opacity=".72"${edge(1.1)}/>`
        + `<path d="M${fx(-2*r)},${fx(-r)}L${fx(-r)},${fx(-r)}A${fx(r)},${fx(r)} 0 0 1 ${fx(-r)},${fx(r)}L${fx(-2*r)},${fx(r)}Z" fill="${rgb(tint)}" fill-opacity=".55"${edge(1.2)}/>`
        + `<rect x="${fx(-1.3*r)}" y="${fx(-.2*r)}" width="${fx(.22*r)}" height="${fx(.4*r)}" fill="${pal.ink}" fill-opacity=".8"/>`
        + `<ellipse cx="${fx(-.55*r)}" cy="${fx(-.52*r)}" rx="${fx(.28*r)}" ry="${fx(.15*r)}" fill="#FFFFFF" fill-opacity=".55" transform="rotate(35 ${fx(-.55*r)} ${fx(-.52*r)})"/>`;
    }
    default:
      return `<line x1="0" y1="${fx(-h)}" x2="0" y2="${fx(h)}" stroke="${pal.ink}" stroke-width="2.4"/>`
        + `<line x1="${fx(-3)}" y1="${fx(-h)}" x2="${fx(-3)}" y2="${fx(h)}" stroke="${pal.ink}" stroke-width="1"/>`;
  }
}
function paintSource(fig){
  const { tr, sc, P, S, K, pal, layers, mark } = fig;
  for (const { src, seg } of tr.emitters){
    const s0 = tr.segs[seg], a = P(s0.p0), d = s0.dir;
    const h = Math.max(9, src.w0*K*S);           // half-length = beam radius, as drawn
    layers.optics.push(`<g id="${srcTag(src)}" transform="translate(${fx(a[0])},${fx(a[1])}) rotate(${fx(screenDeg(d))})">`
      + sourceMarkup(fig, src, h, d) + `</g>`);
    const sh = sourceShape(src, h), at = lensToScreen(a, d);
    if (sh.back > 3) fig.markAll([at(-sh.back, -sh.half), at(-sh.back, sh.half), at(0, -sh.half), at(0, sh.half)]);
    else { const nS = [-d.y, -d.x];              // the bar's direction on screen
      for (const sg of [1, -1]){ const ex = a[0] + sg*h*1.15*nS[0], ey = a[1] + sg*h*1.15*nS[1]; mark(ex - 6, ey - 6); mark(ex + 6, ey + 6); } }
    if (sc.show.labels || sc.show.details){      // behind the emitter, clear of a housing
      const side = { x:-d.x, y:d.y };
      const T = fig.T, L = placeLabel(a, side, Math.max(h, sh.back) + 10, sc.show.labels ? beamName(src) : null, sc.show.details ? fmtWL(src.lambdas) : null, pal, T);
      const w0 = Math.abs(side.y) > 0.5 ? 36 : side.x < 0 ? 66 : 8, w1 = Math.abs(side.y) > 0.5 ? 36 : side.x < 0 ? 8 : 66;
      layers.labels.push(L.markup); mark(L.x - w0*T, L.y - 22*T); mark(L.x + w1*T, L.y + 22*T);
    }
  }
}

const GLYPHS = { lens:paintLens, mirror:paintFold, curved:paintFold, splitter:paintFold, dichroic:paintFold, pbs:paintFold,
                 filter:paintFilter, grating:paintGrating, window:paintWindow, aperture:paintAperture, polygon:paintPolygon,
                 qwp:paintWaveplate, hwp:paintWaveplate, faraday:paintFaraday, detector:paintDetector, block:paintBlock, axicon:paintAxicon,
                 fiber:paintFiber, scanner:paintScanner, retro:paintRetro, shutter:paintShutter, diffuser:paintDiffuser,
                 eom:paintEom, pair:paintPair, gain:paintGain, shg:paintNlc, thg:paintNlc };

/* Focal marks: short grey ticks f either side, drawn over every optic (fig.focal); exported as tag + "-focus" in Optics. */
const FOCAL_TICK = 7;                            // px, each way from the axis
function focalMarks(fig, el, c, d){
  if (!el.showF || !isFinite(el.f) || !el.f) return;
  const x = Math.abs(el.f)*fig.S, L = FOCAL_TICK, at = lensToScreen(c, d), ends = [at(x, -L), at(x, L), at(-x, -L), at(-x, L)];
  fig.markAll(ends);
  fig.focal.push(`<path id="${el._sid}-focus" d="${pathD(ends.slice(0, 2))}${pathD(ends.slice(2))}" fill="none" stroke="${fig.pal.ink3}"`
    + ` stroke-width="1" stroke-linecap="round"/>`);
}
function paintLens(fig, node){
  const { P, S, layers, mark } = fig, el = node.el, c = P(node.p), h = Math.max(3, el.ap*S), d = node.dirIn;
  const tf = `translate(${fx(c[0])},${fx(c[1])}) rotate(${fx(screenDeg(d))})`;
  if (!HOUSED.has(el.shape)){
    layers.optics.push(`<g id="${el._sid}" transform="${tf}">${lensMarkup(fig, el, h)}</g>`);
    focalMarks(fig, el, c, d);
    mark(c[0] - h*1.3, c[1] - h*1.3); mark(c[0] + h*1.3, c[1] + h*1.3);
    fig.label(c, labelNormal(d), h + 12, el._tag, `f = ${el.f} mm`, 54);
    return;
  }
  // Housings are lit from the page's upper left; local top (−y) is lit when it faces that way.
  const up = .9*d.x + .45*d.y >= 0, g = housing(el, S), at = lensToScreen(c, d);
  layers.optics.push(`<g id="${el._sid}" transform="${tf}">${housedMarkup(fig, el, S, up)}</g>`);
  focalMarks(fig, el, c, d);
  fig.markAll([at(g.x0, -g.H), at(g.x1, -g.H), at(g.x0, g.H), at(g.x1, g.H)]);
  fig.label(at((g.x0 + g.x1)/2, 0), labelNormal(d), g.H + 12, el._tag, `f = ${el.f} mm`, 54);
}
/* Screen point for local lens coords (x along d, y across; px) about screen point c. */
const lensToScreen = (c, d) => (x, y) => [c[0] + x*d.x + y*d.y, c[1] - x*d.y + y*d.x];

/* A mirror's mount, behind its face, in its own frame (+x into the body). Display only. Returns
   markup and depth, for the label.
     galvo     shaft into a slender steel barrel with a connector band
     mems      a small anodized package with two screws */
function mirrorMount(fig, node, h, mount, startBack){
  const pal = fig.pal, c = fig.P(node.p);
  const n = unit(node.N), bd = { x:-n.x, y:-n.y };             // into the body, away from the light
  const up = .9*bd.x + .45*bd.y >= 0, at = lensToScreen(c, bd);
  const tf = `translate(${fx(c[0])},${fx(c[1])}) rotate(${fx(screenDeg(bd))})`;
  const edge = (sw = 1.3) => fig.outlines ? ` stroke="${pal.ink}" stroke-width="${sw}" stroke-linejoin="round"` : "";
  const dot = (x, y, r) => `<circle cx="${fx(x)}" cy="${fx(y)}" r="${fx(r)}" fill="${pal.ink}" fill-opacity=".3"/>`;
  const parts = [], corner = (x, y) => { const q = at(x, y); fig.mark(q[0], q[1]); };
  let back;                                                     // px the body reaches behind the face
  if (mount === "mems"){
    const hp = Math.max(1.3*h, h + 5), Lp = Math.max(.95*h, 10), x0 = startBack, x1 = x0 + Lp, r = Math.min(.12*hp, 2.2);
    parts.push(`<rect x="${fx(x0)}" y="${fx(-hp)}" width="${fx(Lp)}" height="${fx(2*hp)}" rx="${fx(r)}" fill="${fig.cyl("black", up, "mems")}"${edge()}/>`
      + dot(x1 - .28*Lp, -(hp - .28*Lp), Math.max(1, .12*hp)) + dot(x1 - .28*Lp, hp - .28*Lp, Math.max(1, .12*hp)));
    back = x1;
    corner(x0, -hp); corner(x1, -hp); corner(x0, hp); corner(x1, hp);
  } else {
    // hs sizes the mount: barrel half as thick, 2.8 hs long
    const hs = Math.max(.5*h, 5), hb = hs/2, Lb = 2.8*hs;
    const ys = Math.max(.11*hs, 1.2), xs1 = startBack + Math.max(.55*hs, 4), xb1 = xs1 + Lb, rr = Math.min(.12*hb, 1.6);
    const bw = Math.max(.14*2.8*hs, 3);                                   // the connector band
    parts.push(`<rect x="${fx(startBack - .5)}" y="${fx(-ys)}" width="${fx(xs1 - startBack + 1)}" height="${fx(2*ys)}" ${body(fig, pal.metal, { k:.9, sw:1 })}/>`   // rotor shaft
      + `<rect x="${fx(xs1)}" y="${fx(-hb)}" width="${fx(Lb)}" height="${fx(2*hb)}" rx="${fx(rr)}" fill="${fig.cyl("chrome", up, "galvo")}"${edge()}/>`   // motor barrel
      + `<rect x="${fx(xb1 - bw)}" y="${fx(-hb)}" width="${fx(bw)}" height="${fx(2*hb)}" fill="${pal.ink}" fill-opacity=".16"/>`);                          // connector band
    back = xb1;
    corner(xs1, -hb); corner(xb1, -hb); corner(xs1, hb); corner(xb1, hb);
  }
  return { markup:`<g transform="${tf}">${parts.join("")}</g>`, loff:back + 16 };
}

/* Folds: a mirror is a grey substrate with a heavy face. Splitters are glass plates or cubes, coating marked on the fold plane: dashed (partial), band colour (dichroic), wire-grid (PBS). */
function paintFold(fig, node){
  const { P, S, pal, layers } = fig, el = node.el, tag = el._tag;
  const c = P(node.p), h = Math.max(3, el.ap*S);
  const n = unit(node.N), t = leftNormal(n), back = { x:-n.x, y:-n.y };
  const dich = el.type === "dichroic", pbs = el.type === "pbs", dc = dich ? dichroicColor(el) : null;
  const coating = d => dich ? `<path d="${d}" fill="none" stroke="${pal.dark ? rgb(dc) : mixc(dc, .22, 0)}" stroke-width="2.4"/>`
                    : pbs  ? `<path d="${d}" fill="none" stroke="${pal.ink}" stroke-width="2"/>${pbsRulings(fig, node.p, t, n, h)}`
                    :        `<path d="${d}" fill="none" stroke="${pal.ink}" stroke-width="1.4" stroke-dasharray="4 2.5"/>`;
  let loff;
  if (el.type === "mirror" || el.type === "curved"){
    const q = el.type === "curved" ? curvedPlate(fig, node.p, t, n, h, 5, mirrorDrawRadius(el)) : plate(fig, node.p, t, back, h, 5);
    const mount = el.type === "mirror" ? el.mount || "plain" : "plain";
    const mnt = mount === "plain" ? null : mirrorMount(fig, node, h, mount, 5);
    layers.optics.push(`<g id="${el._sid}">${mnt ? mnt.markup : ""}<path d="${q.outline}" ${body(fig, pal.metal)}/>`
      + `<path d="${q.face}" fill="none" stroke="${pal.ink}" stroke-width="2.4"/></g>`);
    loff = mnt ? mnt.loff : 5 + 20 + (q.recede || 0);
  } else if (el.disp === "cube"){
    // cube: splitting diagonal on the fold plane
    const corner = (a, b) => {
      const q = P({ x:node.p.x + t.x*a*h/S + n.x*b*h/S, y:node.p.y + t.y*a*h/S + n.y*b*h/S });
      fig.mark(q[0], q[1]); return q;
    };
    const box = pathD([corner(1, 0), corner(0, 1), corner(-1, 0), corner(0, -1)]) + "Z";
    const diag = pathD([corner(-1, 0), corner(1, 0)]);
    layers.optics.push(`<g id="${el._sid}"><path d="${box}" ${body(fig, pal.glass, { k:.7, sw:1.4 })}/>${coating(diag)}</g>`);
    loff = h + 14;
  } else {
    const q = plate(fig, node.p, t, back, h, 3.5);
    layers.optics.push(`<g id="${el._sid}"><path d="${q.outline}" ${body(fig, pal.glass, { sw:1.4, w:3.5 })}/>${coating(q.face)}</g>`);
    loff = 3.5 + 20;
  }
  const sub = el.type === "mirror" ? null      // no angles or glass in details: the figure shows the fold
            : el.type === "curved" ? `f = ${el.f} mm`
            : dich ? `${passAbbr(el)} ${el.cut}`
            : pbs ? `T p, R s`
            : `R ${el.R}%`;
  fig.label(c, { x:back.x, y:-back.y }, loff, tag, sub, 52);
}

/* A PBS coating mark: wire-grid rulings on the lit side. p, n, t model-space; h half-span px. */
function pbsRulings(fig, p, t, n, h){
  const { P, S, pal } = fig, k = clamp(Math.floor(2*h/5), 3, 40), d = [];
  for (let i = 1; i < k; i++){
    const u = (-1 + 2*i/k)*h/S, q = { x:p.x + t.x*u, y:p.y + t.y*u };
    d.push(pathD([P(q), P({ x:q.x + n.x*3/S, y:q.y + n.y*3/S })]));
  }
  return `<path d="${d.join("")}" stroke="${pal.ink}" stroke-width=".7" stroke-opacity=".75"/>`;
}

function paintGrating(fig, node){
  const { P, S, pal, layers } = fig, el = node.el, tag = el._tag;
  const c = P(node.p), h = Math.max(3, el.ap*S), { N, g, refl } = node.grating;
  const th = refl ? 5 : 4;                       // plate thickness (px)
  const q = plate(fig, node.p, g, N, h, th);
  const nT = clamp(Math.floor(2*h/4.5), 4, 60), ticks = [];   // rulings, evenly spaced along the face
  for (let i = 1; i < nT; i++){
    const f = -1 + 2*i/nT;
    const r0 = P({ x:node.p.x + g.x*h*f/S, y:node.p.y + g.y*h*f/S });
    const r1 = P({ x:node.p.x + g.x*h*f/S + N.x*th/S, y:node.p.y + g.y*h*f/S + N.y*th/S });
    ticks.push(pathD([r0, r1]));
  }
  layers.optics.push(`<g id="${el._sid}"><path d="${q.outline}" ${body(fig, pal.metal, { k:refl ? 1 : .8, sw:1.4 })}/>`
    + `<path d="${ticks.join("")}" stroke="${pal.ink}" stroke-width=".6" stroke-opacity=".7"/>`
    + `<path d="${q.face}" stroke="${pal.ink}" stroke-width="${refl ? 2.4 : 1.4}"/></g>`);
  const ords = sortedNums(el.orders).map(fmtOrd).join(" ");
  fig.label(c, labelNormal(node.dirIn), h + 12, tag, `${refl ? "R" : "T"} ${linesPerMm(el)}/mm · ${ords}`, 70);
}

function paintWindow(fig, node){
  const { P, S, pal, layers, mark } = fig, el = node.el, c = P(node.p), h = Math.max(3, el.ap*S);
  const tpx = Math.max(6, el.t*S);
  layers.optics.push(`<g id="${el._sid}" transform="translate(${fx(c[0])},${fx(c[1])}) rotate(${fx(screenDeg(node.dirIn))})">`
    + `<rect x="0" y="${fx(-h)}" width="${fx(tpx)}" height="${fx(2*h)}" ${body(fig, pal.glass)}/></g>`);
  mark(c[0] - h, c[1] - h); mark(c[0] + h + tpx, c[1] + h);
  fig.label(c, labelNormal(node.dirIn), h + 12, el._tag, `${el.t} mm`, 30);
}

/* An axicon side-on: flat back, rim, cone to the tip. Drawing only; shallow cones drawn deeper. */
function paintAxicon(fig, node){
  const { P, S, pal, layers } = fig, el = node.el, d = node.dirIn, c = P(node.p), h = Math.max(3, el.ap*S);
  const ta = Math.tan(clamp(el.alpha, 0.1, 40)*RAD);
  const sag = Math.min(1.2*h, Math.max(h*ta, h*Math.min(0.32, 0.1 + 0.9*ta)));   // px from the rim to the tip
  const rim = Math.max(3, 0.16*h), L = rim + sag, x0 = -L/2, x1 = x0 + rim, f = el.flip ? -1 : 1;   // flip: the cone toward the light
  const pts = [[x0, -h], [x1, -h], [L/2, 0], [x1, h], [x0, h]].map(([x, y]) => [f*x, y]);
  layers.optics.push(`<g id="${el._sid}" transform="translate(${fx(c[0])},${fx(c[1])}) rotate(${fx(screenDeg(d))})">`
    + `<path d="${pathD(pts)}Z" ${body(fig, pal.glass, { w:rim + sag/2 })}/></g>`);
  const at = lensToScreen(c, d);
  fig.markAll(pts.map(([x, y]) => at(x, y)));
  fig.label(c, labelNormal(d), h + 12, el._tag, `α = ${el.alpha}°`, 34);
}

/* A wave plate: a thin plate (half-wave twice as thick as quarter), with a fast-axis line. */
function paintWaveplate(fig, node){
  const { P, S, pal, layers, mark } = fig, el = node.el, c = P(node.p), h = Math.max(3, el.ap*S);
  const tpx = el.type === "hwp" ? 7 : 3.5;
  layers.optics.push(`<g id="${el._sid}" transform="translate(${fx(c[0])},${fx(c[1])}) rotate(${fx(screenDeg(node.dirIn))})">`
    + `<rect x="${fx(-tpx/2)}" y="${fx(-h)}" width="${fx(tpx)}" height="${fx(2*h)}" ${body(fig, pal.glass, { w:tpx })}/>`
    + `<path d="M0,${fx(-h + 2)}V${fx(h - 2)}" stroke="${pal.ink}" stroke-width=".8" stroke-dasharray="2 2"/></g>`);
  mark(c[0] - h, c[1] - h); mark(c[0] + h, c[1] + h);
  fig.label(c, labelNormal(node.dirIn), h + 12, el._tag, el.type === "hwp" ? `${el.axis}°` : null, 30);
}

/* A Faraday rotator in section: crystal in a ferrite ring magnet, len long, out to outR. Drawing only; local frame as lenses. */
function faradayBody(el, S){
  const h = Math.max(3, el.ap*S);
  const L = Math.max(8, clamp(el.len || 20, 1, 500)*S), H = Math.max(h + 6, el.outR*S);
  return { h, L, H, x0:-L/2, x1:L/2 };
}
function paintFaraday(fig, node){

  const inR = el.ap*S, outR = Math.max(inR + 6, el.outR*S), tpx = 4;
  const bar = (y0, y1) => `<rect x="${fx(-tpx/2)}" y="${fx(y0)}" width="${fx(tpx)}" height="${fx(y1 - y0)}" ${body(fig, pal.metal)}/>`;
  const rim = y => `<path d="M${fx(-tpx/2)},${fx(y)}L${fx(tpx/2)},${fx(y)}" stroke="${pal.ink}" stroke-width="2.4"`   // an opening edge: capped
    + ` stroke-linecap="${fig.outlines ? "round" : "butt"}"/>`;                                                      // square when nothing frames it

  }
  layers.optics.push(`<g id="${el._sid}" transform="translate(${fx(c[0])},${fx(c[1])}) rotate(${fx(screenDeg(node.dirIn))})">${g}</g>`);
  mark(c[0] - outR, c[1] - outR); mark(c[0] + outR, c[1] + outR);
  fig.label(c, labelNormal(node.dirIn), outR + 10, el._tag, null, 30);

  const edge = (sw = 1.4) => fig.outlines ? ` stroke="${pal.ink}" stroke-width="${sw}" stroke-linejoin="miter"` : "";   // square cornered, a machined block
  const half = sg => `<rect x="${fx(-L/2)}" y="${fx(sg > 0 ? h : -H)}" width="${fx(L)}" height="${fx(H - h)}" fill="${fig.cyl("black", up, "tube")}"${edge()}/>`;
  const blade = el.open ? "" : `<rect x="-1.6" y="${fx(-h - 1.5)}" width="3.2" height="${fx(2*h + 3)}" fill="${pal.cyl.chrome[pal.dark ? 1 : 2]}"${edge(1)}/>`;   // steel, set off from the page
  fig.layers.optics.push(`<g id="${el._sid}" transform="translate(${fx(c[0])},${fx(c[1])}) rotate(${fx(screenDeg(d))})">${blade}${half(-1)}${half(1)}</g>`);
  const at = lensToScreen(c, d);
  fig.markAll([at(-L/2, -H), at(L/2, -H), at(-L/2, H), at(L/2, H)]);
  fig.label(c, labelNormal(d), H + 12, el._tag, el.open ? "open" : "closed", 34);
}

/* A diffuser: a thin plate with a seeded rough exit face. */
function paintDiffuser(fig, node){
  const { P, S, pal } = fig, el = node.el, d = node.dirIn, c = P(node.p), h = Math.max(3, el.ap*S), t = 3.5;
  const n = clamp(Math.round(h/1.2), 4, 400), rnd = mulberry32(el.seed), rough = [];
  for (let i = 0; i <= n; i++) rough.push([t/2 + (i % 2 ? .5 + 1.3*rnd() : 0), -h + 2*h*i/n]);
  const outline = pathD([[-t/2, -h], ...rough, [-t/2, h]]) + "Z";
  fig.layers.optics.push(`<g id="${el._sid}" transform="translate(${fx(c[0])},${fx(c[1])}) rotate(${fx(screenDeg(d))})">`
    + `<path d="${outline}" ${body(fig, pal.glass, { sw:1, w:t + 1 })}/>`
