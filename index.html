    + `<path d="${pathD(rough)}" fill="none" stroke="${pal.ink}" stroke-width=".9" stroke-linejoin="round"/></g>`);
  const at = lensToScreen(c, d);
  fig.markAll([at(-t/2, -h), at(t/2 + 2, h)]);
  fig.label(c, labelNormal(d), h + 12, el._tag, `±${el.scatter}°`, 30);
}

/* A polygon scanner from above: mirrored facets about the spindle. Label opposite the facet in use. */
function paintScanner(fig, node){
  const { P, S, pal, layers } = fig, el = node.el, g = node.scan;
  if (!g) return;
  const pts = g.V.map(P), d = pathD(pts) + "Z", c = P(g.C), hub = clamp(.28*g.r*S, 2.5, 7);
  layers.optics.push(`<g id="${el._sid}"><path d="${d}" ${body(fig, pal.metal)}/>`
    + `<path d="${d}" fill="none" stroke="${pal.ink}" stroke-width="2.4" stroke-linejoin="miter" stroke-miterlimit="10"/>`
    + `<circle cx="${fx(c[0])}" cy="${fx(c[1])}" r="${fx(hub)}" fill="${pal.bg}" stroke="${pal.ink}" stroke-width="1.2"/>`
    + `<circle cx="${fx(c[0])}" cy="${fx(c[1])}" r="${fx(.35*hub)}" fill="${pal.ink}"/></g>`);
  fig.markAll(pts);
  const ax = g.C.x - node.p.x, ay = -(g.C.y - node.p.y);   // screen direction facet → spindle: the label goes
  const side = Math.abs(ax) > Math.abs(ay) ? { x:Math.sign(ax), y:0 } : { x:0, y:Math.sign(ay) || -1 };   // beyond, square to the page
  fig.label(c, side, g.R*S + (side.y ? 10 : 8), el._tag, `${g.n} facets`, 44);
}

/* A roof mirror end on: two mirror plates in a V. Label behind the apex. */
const retroOutline = (g, th, whole = false) => {   // V plates th mm thick; whole: V with its inside
  const at = (p, v, k) => ({ x:p.x + v.x*k, y:p.y + v.y*k }), r1 = at(g.O, g.E1, g.L), r2 = at(g.O, g.E2, g.L);
  const back = [at(r2, g.N2, th), at(g.O, g.U, -th*Math.SQRT2), at(r1, g.N1, th)];
  return whole ? [r1, r2, ...back] : [r1, g.O, r2, ...back];
};
/* A mirror pair's outline, th mm behind each face, with the gap. */
const pairOutline = (g, th) => {
  const back = (p, N) => ({ x:p.x - N.x*th, y:p.y - N.y*th });
  return [back(g.m1a, g.N1), back(g.m1b, g.N1), back(g.m2b, g.N2), back(g.m2a, g.N2)];
};
function paintRetro(fig, node){
  const { P, S, pal, layers } = fig, el = node.el, g = node.retro, th = 5/S, pts = retroOutline(g, th).map(P);
  layers.optics.push(`<g id="${el._sid}"><path d="${pathD(pts)}Z" ${body(fig, pal.metal)}/>`
    + `<path d="${pathD(pts.slice(0, 3))}" fill="none" stroke="${pal.ink}" stroke-width="2.4" stroke-linejoin="miter"/></g>`);
  fig.markAll(pts);
  fig.label(P(g.O), { x:-g.U.x, y:g.U.y }, 5*Math.SQRT2 + 14, el._tag, `Δ ${fx(2*Math.abs(el.off))} mm`, 44);
}

const polyModel = node => node.poly.V.map(v => localToModel(node.p, node.poly.dIn, v));
/* A prism: glass, coated faces as heavy lines. */
function paintPolygon(fig, node){
  const { P, pal, layers } = fig, el = node.el, pts = polyModel(node).map(P);
  const coat = (el.mirrors || []).filter(i => i < pts.length).map(i => pathD([pts[i], pts[(i + 1) % pts.length]])).join("");
  layers.optics.push(`<g id="${el._sid}"><path d="${pathD(pts)}Z" ${body(fig, pal.glass)}/>`
    + (coat ? `<path d="${coat}" fill="none" stroke="${pal.ink}" stroke-width="2.4" stroke-linecap="round"/>` : "") + `</g>`);
  fig.markAll(pts);
  let cx = 0, top = 1e9;
  for (const q of pts){ cx += q[0]; top = Math.min(top, q[1]); }
  fig.label([cx/pts.length, top], { x:0, y:-1 }, 14, el._tag, null, 30);
}

/* ---------- annotations ----------
   Rulers, protractors, labels (§2), each its own group (bench-ruler-1…) in the Annotations layer.
   Points in model mm, lines and text in figure px. Painters take { P, pal, mark } and also draw one
   being placed (§8). s: units per figure px (1 in the figure, the magnification on stage). */
const RULER = { tick:4, gap:5, fs:10.5, w:.9 };
const PROT  = { r:26, gap:7, fs:10.5, w:.9 };
const annXY = q => ({ x:q[0], y:q[1] });
const rulerLength = a => Math.hypot(a.pts[1][0] - a.pts[0][0], a.pts[1][1] - a.pts[0][1]);
const fmtDeg = d => Math.round(d*10)/10 + "°";
/* Where a ruler's length goes: beside the middle, above (or below when flipped); ang reads along the line, never upside down. */
function rulerText(A, B, flip, s, T = 1){        // T: the figure's text size (§8)
  let ang = Math.atan2(B[1] - A[1], B[0] - A[0])*180/Math.PI;
  if (ang >= 90) ang -= 180; else if (ang < -90) ang += 180;           // upright: a vertical ruler reads upward, text on its left
  const r = ang*RAD, up = [Math.sin(r), -Math.cos(r)], m = [(A[0] + B[0])/2, (A[1] + B[1])/2];
  const off = flip ? -(RULER.gap + .72*RULER.fs*T)*s : RULER.gap*s;    // flipped: the cap height clears the line
  return { x:m[0] + up[0]*off, y:m[1] + up[1]*off, ang, up };
}
function paintRuler({ P, pal, mark, T:ts = 1 }, a){
  const A = P(annXY(a.pts[0])), B = P(annXY(a.pts[1])), L = Math.hypot(B[0] - A[0], B[1] - A[1]);
  if (L < .5) return "";
  const n = [-(B[1] - A[1])/L, (B[0] - A[0])/L], t = RULER.tick, T = rulerText(A, B, a.flip, 1, ts), text = fmtLen(rulerLength(a)), fs = RULER.fs*ts;
  const tick = Q => pathD([[Q[0] - n[0]*t, Q[1] - n[1]*t], [Q[0] + n[0]*t, Q[1] + n[1]*t]]);
  const hw = Math.max(text.length*fs*.3, fs);                          // the text's half-width, roughly, whichever way it turns
  for (const Q of [A, B]){ mark(Q[0] - t, Q[1] - t); mark(Q[0] + t, Q[1] + t); }
  mark(T.x - hw, T.y - hw); mark(T.x + hw, T.y + hw);
  return `<path d="${pathD([A, B])}${tick(A)}${tick(B)}" fill="none" stroke="${pal.ink2}" stroke-width="${RULER.w}"/>`
    + `<text x="${fx(T.x)}" y="${fx(T.y)}" text-anchor="middle"${T.ang ? ` transform="rotate(${fx(T.ang)},${fx(T.x)},${fx(T.y)})"` : ""}`
    + ` font-family="${pal.mono}" font-size="${fx(fs)}" fill="${pal.ink}"${textHalo(pal, .28*fs)}>${esc(text)}</text>`;
}
/* A protractor's arms: tA first arm direction, sweep signed turn to the second (short way, or long if reflex), deg size. */
function protractorAngles(a){
  const [c, p, q] = a.pts, tA = Math.atan2(p[1] - c[1], p[0] - c[0]), tB = Math.atan2(q[1] - c[1], q[0] - c[0]);
  let sweep = tB - tA;
  sweep -= 2*Math.PI*Math.round(sweep/(2*Math.PI));
  if (a.reflex) sweep -= (sweep < 0 ? -1 : 1)*2*Math.PI;
  return { tA, sweep, deg:Math.abs(sweep)/RAD };
}
/* A protractor on the page at C, A, B: arc path (radius PROT.r, less for short arms) and text position on the bisector. */
function protractorShape(C, A, B, a, s, T = 1){   // T: text size, which the gap grows with
  const g = protractorAngles(a), arm = Math.min(Math.hypot(A[0] - C[0], A[1] - C[1]), Math.hypot(B[0] - C[0], B[1] - C[1]));
  const r = Math.max(4*s, Math.min(PROT.r*s, .7*arm));
  const at = (t, R) => [C[0] + R*Math.cos(t), C[1] - R*Math.sin(t)], p0 = at(g.tA, r), p1 = at(g.tA + g.sweep, r);
  const arc = Math.abs(g.sweep) < 1e-4 || Math.abs(g.sweep) > 2*Math.PI - 1e-4 ? ""
    : `M${fx(p0[0])},${fx(p0[1])}A${fx(r)},${fx(r)} 0 ${Math.abs(g.sweep) > Math.PI ? 1 : 0} ${g.sweep > 0 ? 0 : 1} ${fx(p1[0])},${fx(p1[1])}`;
  const tm = g.tA + g.sweep/2, cs = Math.cos(tm), at2 = at(tm, r + (PROT.gap + 3.8*(T - 1))*s);
  return { arc, x:at2[0], y:at2[1], anchor:cs > .35 ? "start" : cs < -.35 ? "end" : "middle", text:fmtDeg(g.deg) };
}
function paintProtractor({ P, pal, mark, T = 1 }, a){
  const [C, A, B] = a.pts.map(q => P(annXY(q))), sh = protractorShape(C, A, B, a, 1, T), fs = PROT.fs*T;
  const w = sh.text.length*fs*.6, x0 = sh.anchor === "start" ? sh.x : sh.anchor === "end" ? sh.x - w : sh.x - w/2;
  for (const Q of [A, B, C]) mark(Q[0], Q[1]);
  mark(x0, sh.y - fs); mark(x0 + w, sh.y + fs);
  return `<path d="${pathD([A, C, B])}${sh.arc}" fill="none" stroke="${pal.ink2}" stroke-width="${PROT.w}" stroke-linejoin="round"/>`
    + `<text x="${fx(sh.x)}" y="${fx(sh.y + .36*fs)}" text-anchor="${sh.anchor}" font-family="${pal.mono}" font-size="${fx(fs)}" fill="${pal.ink}"${textHalo(pal, .28*fs)}>${esc(sh.text)}</text>`;
}
/* A label's centred text block at s px per unit: lines, size, spacing, approx half-width and half-height. */
function labelBox(a, s, T = 1){                  // T: the figure's text size
  const lines = a.text.split("\n"), fs = a.textSize*T*s, lh = 1.25*fs;
  return { lines, fs, lh, hw:Math.max(...lines.map(l => l.trim().length))*fs*(a.bold ? .31 : .28), hh:lines.length*lh/2 };
}
function paintLabel({ P, pal, mark, T = 1 }, a){
  if (!a.text.trim()) return "";
  const c = P(annXY(a.pts[0])), b = labelBox(a, 1, T), y0 = c[1] - b.hh + b.lh/2 + .36*b.fs;
  mark(c[0] - b.hw, c[1] - b.hh); mark(c[0] + b.hw, c[1] + b.hh);
  const lines = b.lines.length === 1 ? esc(b.lines[0])               // several: a line each, at its own height
    : b.lines.map((l, i) => l.trim() ? `<tspan x="${fx(c[0])}" y="${fx(y0 + i*b.lh)}">${esc(l)}</tspan>` : "").join("");
  return `<text x="${fx(c[0])}" y="${fx(y0)}" text-anchor="middle" font-family="${pal.font}" font-size="${fx(b.fs)}"`
    + `${a.bold ? ' font-weight="700"' : ""} fill="${pal.ink}"${textHalo(pal, .28*b.fs)}>${lines}</text>`;
}
const ANN_PAINT = { ruler:paintRuler, protractor:paintProtractor, label:paintLabel };
function paintAnnotations(fig){
  const count = {};
  for (const a of fig.sc.annotations){
    const k = count[a.type] = (count[a.type] || 0) + 1, m = ANN_PAINT[a.type](fig, a);
    if (m) fig.layers.ann.push(`<g id="bench-${a.type}-${k}">${m}</g>`);
  }
}


/* =====================================================================
   8. STAGE — cached trace, drawing, view
   ===================================================================== */
const svg = document.getElementById("svg");
let view = makeView(1, 60, 200);
let tr = null;          // trace of the current scene; refreshed by commit()
let sel = "s1";         // selection: source id ("s…"), element id, or end id ("end:…")
const multi = new Set(); // multiple selection (§9) including sel; empty for one

/* ---------- zoom ----------
   The figure is built at D figure px/mm and magnified by k: screen S = D·k. Optics follow the zoom;
   the behaviour decides what figure-px sizes (labels, lines, symbols) do:
     page   ("Print") D = docScale(): zoom magnifies the exported figure
     blend  D the geometric mean: annotations follow at half rate
     map    D = S, k = 1: annotations keep screen size
   Zoom = S/docScale(); at 100% all match the export (§11). Behaviour is a browser preference. */
const ZOOM_MODES = {
  page:  { exp:1 },                              // "Print"
  blend: { exp:.5 },
  map:   { exp:0 },
};
const ZOOM_STORE = "bench.zoom";
const ZOOM_LEVELS = [2, 3, 5, 8, 12.5, 16.7, 25, 33.3, 50, 66.7, 100, 150, 200, 300, 400, 600, 800, 1200, 1600, 2400, 3200, 4800, 6400]
  .map(p => p/100);                              // + and − stops, as fractions of 100%
const S_LIMITS = [.02, 400];                     // screen px per mm
const ui = { grid:true, snap:true, zoom:"page", closed:new Set(), undo:null };   // workspace aids: grid, snap, the zoom behaviour,
                                                                    // folded beams in the browser; undo: the system before the last open
try { const z = localStorage.getItem(ZOOM_STORE); if (ZOOM_MODES[z]) ui.zoom = z; } catch {}
/* ---------- theme ----------
   Light, Gray or Dark, screen only (exports use PRINT), kept in this browser. Gray draws a brushed
   aluminum table (brushedTexture, panned by tableGrain) with dark chamfered holes. */
const THEMES = ["light", "gray", "dark"], THEME_STORE = "bench.theme";
const currentTheme = () => { const t = document.documentElement.getAttribute("data-theme"); return THEMES.includes(t) ? t : "light"; };
function setTheme(t, save = true){
  if (!THEMES.includes(t)) return;
  if (t === "gray") brushedTexture();
  document.documentElement.setAttribute("data-theme", t);
  if (save) try { localStorage.setItem(THEME_STORE, t); } catch {}
  syncThemeControls();
  screenPal = null;
  draw();
}
const syncThemeControls = () => { for (const b of document.querySelectorAll("#theme [data-theme-opt]")) b.setAttribute("aria-checked", String(b.dataset.themeOpt === currentTheme())); };
/* The table grain: faint (GRAIN) brushed rows with long waves and speckle, a neutral veil over --bg.
   Made at 2× and seamless both ways. */
const GRAIN = .3;                                // the grain's strength: 1 is plainly brushed metal
let brushed = false;
function brushedTexture(){
  if (brushed) return;
  brushed = true;
  const W = 1024, H = 512, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const cx = cv.getContext("2d"); if (!cx) return;
  const img = cx.createImageData(W, H), d = img.data;
  let seed = 7;
  const rnd = () => (seed = (seed*16807) % 2147483647)/2147483647;   // repeatable, so the table looks the same each time
  const gauss = () => Math.sqrt(-2*Math.log(rnd() + 1e-12))*Math.cos(2*Math.PI*rnd());
  const SIN = Float32Array.from({ length:W }, (_, i) => Math.sin(2*Math.PI*i/W));
  for (let y = 0; y < H; y++){
    const row = 3.2*gauss(), waves = [];
    for (let j = 0; j < 4; j++){ const k = 1 + Math.floor(rnd()*14); waves.push([k, Math.floor(rnd()*W), 3.4*gauss()/Math.sqrt(k)]); }
    for (let x = 0; x < W; x++){
      let v = row + 1.6*gauss();                 // levels (of 255) off the table's grey
      for (const [k, ph, a] of waves) v += a*SIN[(k*x + ph) % W];
      v *= GRAIN;
      const i = 4*(y*W + x), on = v > 0 ? 255 : 0;   // white lightens, black darkens, over grey ~205
      d[i] = d[i + 1] = d[i + 2] = on; d[i + 3] = Math.min(255, Math.round(255*Math.abs(v)/(v > 0 ? 50 : 205)));
    }
  }
  cx.putImageData(img, 0, 0);
  document.documentElement.style.setProperty("--brushed", `url(${cv.toDataURL("image/png")})`);
}
/* Pin the grain to the model origin as it pans. */
function tableGrain(){
  if (currentTheme() !== "gray") return;
  const o = view.pt({ x:0, y:0 });
  svg.style.backgroundPosition = `${fx(o[0] % 512)}px ${fx(o[1] % 256)}px`;
}
try { const t = localStorage.getItem(THEME_STORE); if (THEMES.includes(t) && t !== "light"){ if (t === "gray") brushedTexture(); document.documentElement.setAttribute("data-theme", t); } } catch {}
syncThemeControls();
const docScale = () => scene.scale > 0 ? scene.scale : 2.2;   // figure px per mm, as exported
/* Figure scale built at for screen scale S under the current behaviour. */
function figScaleFor(S){
  const a = ZOOM_MODES[ui.zoom].exp, D0 = docScale();
  return a === 1 ? D0 : a === 0 ? S : S**(1 - a)*D0**a;
}
const zoomOf = (S = view.S) => S/docScale();
/* A figure scale suiting the layout: beams ~900 px across, max 2.2 px/mm. */
function autoScale(){
  const b = beamBounds(tr, scene);
  return +Math.min(2.2, 900/Math.max(1, b.x1 - b.x0)).toFixed(3);
}
/* The figure built at scale D, cached while unchanged so zooms at the same D only move it. q: precision (fxQ). */
let figCache = null;
function figureAt(D, pal, q = 100){
  const key = [D, q, scene.exag, scene.mode, scene.text, scene.lines, JSON.stringify(scene.show), JSON.stringify(scene.annotations)].join("|");
  if (figCache && figCache.tr === tr && figCache.pal === pal && figCache.key === key) return figCache.fig;
  const q0 = fxQ; fxQ = q;
  try { figCache = { tr, pal, key, fig:buildFigure(tr, scene, makeView(D, 0, 0), pal) }; }
  finally { fxQ = q0; }
  return figCache.fig;
}
/* Figure scale and magnification for view v. */
const figFrame = (v = view) => { const D = figScaleFor(v.S); return { D, k:v.S/D }; };
let drag = null;        // active drag { mode, … }
let lastTap = null;     // last optic pressed { id, t }, for double clicks
let inserting = null;   // beam (+) { seg, u, sx, sy }: follows the pointer, pinned while its menu is open
let listIns = null;     // insert target from a browser "+" { list, idx, vx, vy }
let drawnAt = null;     // view offset last drawn at; panning translates from here
let tool = null;        // armed annotation tool (ANN_TYPES) or null (§9)
let placing = null;     // annotation being placed { type, need, pts, step, first }
let snapCue = null;     // point an annotation just snapped to, ringed

/* The scene changed: retrace, redraw, refresh panel. keepProps keeps the field being typed in. */
function commit({ keepProps = false } = {}){
  dropUndo();                                    // an edit makes the opened system the one to keep
  indexScene();
  tr = trace(scene);
  recordEdit();
  draw();
  refreshPanel(!keepProps);
  if (keepProps) syncLiveProps();
}
/* An annotation changed: no retrace; record, redraw, refresh panel. */
function commitAnn({ keepProps = false } = {}){
  dropUndo();
  indexScene();
  recordEdit();
  draw();
  refreshPanel(!keepProps);
}

/* ---------- undo and redo ----------
   History holds sources and annotations after each commit (not view, layers or selection). A step
   is one action: a drag, a field typed in, a run of nudges, joined by token (gesture or joinEdit).
   Opening a system starts a fresh history. */
const UNDO_MAX = 200;
const hist = { undo:[], redo:[], cur:"", sel:null, token:null, quiet:false };
let gesture = null, editToken = null;            // the drag under way; the token for the next commit
const sceneState = () => JSON.stringify({ sources:scene.sources, annotations:scene.annotations }, withoutPrivate);
const joinEdit = token => { editToken = token; };
function recordEdit(){
  const token = editToken ?? gesture; editToken = null;
  if (hist.quiet) return;
  const now = sceneState();
  if (now === hist.cur) return;
  if (token == null || token !== hist.token){    // a new step: what the scene was before it
    hist.undo.push({ state:hist.cur, sel:hist.sel });
    if (hist.undo.length > UNDO_MAX) hist.undo.shift();
    hist.redo.length = 0;
    hist.token = token;
  }
  hist.cur = now; hist.sel = sel;
}
/* A drag starts and ends a gesture; ending records it (a cancelled join is restored) and drops a no-op step. */
function startGesture(){ gesture = {}; }
function endGesture(){
  if (!gesture) return;
  recordEdit();
  const top = hist.undo[hist.undo.length - 1];
  if (hist.token === gesture && top && top.state === hist.cur){ hist.undo.pop(); hist.token = null; }
  gesture = null;
}
function resetHistory(){
  Object.assign(hist, { undo:[], redo:[], cur:sceneState(), sel, token:null });
  gesture = editToken = null;
}
/* Undo or redo, keeping the selection if it still exists. */
function stepHistory(back){
  const from = back ? hist.undo : hist.redo, to = back ? hist.redo : hist.undo;
  if (back && !from.length && ui.undo && !drag && !dispDrag){ document.getElementById("undoOpen").click(); return; }   // before the first edit: the system before this one opened
  if (drag || dispDrag || !from.length){ flashStatus(back ? "Nothing to undo" : "Nothing to redo", 1500); return; }
  const e = from.pop();
  to.push({ state:hist.cur, sel });
  const was = JSON.parse(e.state);
  scene.sources = was.sources; scene.annotations = was.annotations;
  inserting = null; closeInsMenu(); placing = null; snapCue = null; multi.clear();
  indexScene();
  if (!objects.byId.has(sel)) sel = objects.byId.has(e.sel) ? e.sel : scene.sources[0].id;
  hist.quiet = true;
  try { commit(); } finally { hist.quiet = false; }
  Object.assign(hist, { cur:sceneState(), sel, token:null });
  flashStatus(back ? "Undone" : "Redone", 1200);
}
/* Redraw from the cached trace. */
/* The figure is placed by a transform, so zooms at the same figure scale only change it. Grid, handles and (+) are in screen px. */
function draw(){
  pruneMulti();
  const W = svg.clientWidth || 800, H = svg.clientHeight || 600, pal = screenPalette();
  const { D, k } = figFrame();
  const q = 100*10**Math.max(0, Math.ceil(Math.log10(k) - 1e-9));   // finer coordinates the more it is magnified
  const fig = figureAt(D, pal, q);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  if (!svg.querySelector("#figure"))
    svg.innerHTML = `<g id="chrome"></g><g id="content"><g id="figure"></g><g id="handles"></g></g><g id="addmark" pointer-events="none"></g>`;
  const part = id => svg.querySelector("#" + id), figEl = part("figure");
  part("chrome").innerHTML = gridMarkup(W, H);
  tableGrain();
  if (figEl._fig !== fig){ figEl.innerHTML = fig.markup; figEl._fig = fig; }
  figEl.setAttribute("transform", `translate(${view.ox},${view.oy}) scale(${k})`);
  part("content").removeAttribute("transform");
  part("handles").innerHTML = handlesMarkup(pal);
  part("addmark").innerHTML = addMarkMarkup();
  drawnAt = { ox:view.ox, oy:view.oy };
  document.getElementById("tPol").hidden = !scene.sources.some(s => s.pol);   // the glyph toggle only matters with polarization on
  if (inserting && !insMenu.hidden) positionMenu();
  document.getElementById("status").textContent = statusText();
}
/* The bar's summary: sources, path, optics, broken links; or the next step while annotating. */
const TOOL_HINTS = {
  ruler:      ["Ruler: drag from one point to another, or click each", "Ruler: click the other end"],
  protractor: ["Protractor: press at the vertex, then mark each arm", "Protractor: click a point on the first arm", "Protractor: click a point on the second arm"],
  label:      ["Label: click where the text goes"],
};
function statusText(){
  if (tool){ const h = TOOL_HINTS[tool]; return h[placing ? Math.min(placing.step, h.length - 1) : 0] + "  ·  Esc to stop"; }
  const n = tr.nodes.filter(x => !x.link).length, nb = scene.sources.length;
  const miss = objects.rows.filter(r => r.kind === "el" && r.el._miss).length;
  return (nb > 1 ? `${nb} sources  ·  ` : "")
    + `${n} element${n !== 1 ? "s" : ""}` + (miss ? `  ·  ${miss} link${miss > 1 ? "s" : ""} off target` : "");
}
/* Pan without rebuilding: shift content and grid. */
function panTo(ox, oy){
  view = makeView(view.S, ox, oy);
  const content = svg.querySelector("#content");
  if (!content || !drawnAt){ draw(); return; }
  content.setAttribute("transform", `translate(${ox - drawnAt.ox},${oy - drawnAt.oy})`);
  const holes = svg.querySelector("#holes");
  if (holes){ const o = gridOrigin(); holes.setAttribute("x", o.x); holes.setAttribute("y", o.y); }
  tableGrain();
}
/* The drawing's estimated screen extent at view v, labels included. */
function screenBB(v){
  const { D, k } = figFrame(v), bb = figureAt(D, screenPalette()).bb;
  return { x0:bb.x0*k + v.ox, y0:bb.y0*k + v.oy, x1:bb.x1*k + v.ox, y1:bb.y1*k + v.oy };
}
function fitView(){
  const W = svg.clientWidth || 800, H = svg.clientHeight || 600, b = beamBounds(tr, scene);
  const S = clamp(Math.min((W - 190)/Math.max(1, b.x1 - b.x0), (H - 190)/Math.max(1, b.y1 - b.y0)), ...S_LIMITS);
  view = makeView(S, W/2 - (b.x0 + b.x1)/2*S, H/2 + (b.y0 + b.y1)/2*S);
  // Map mode: zoom out until zoom-scaled parts fit above the bar. Page mode: fit in one step.
  const grow = ui.zoom !== "map", m = grow ? { l:24, r:24, t:64, b:64 } : { l:12, r:12, t:12, b:52 };   // fitted: clear of the toolbar and buttons
  for (let i = 0; i < 8; i++){
    const bb = screenBB(view);
    if (!(bb.x1 > bb.x0)) break;
    if (!grow && bb.x0 >= m.l && bb.x1 <= W - m.r && bb.y0 >= m.t && bb.y1 <= H - m.b) break;
    const f = .97*Math.min(grow ? Infinity : 1, (W - m.l - m.r)/(bb.x1 - bb.x0), (H - m.t - m.b)/(bb.y1 - bb.y0));
    const mid = view.inv((bb.x0 + bb.x1)/2, (bb.y0 + bb.y1)/2), S2 = clamp(view.S*f, ...S_LIMITS);
    view = makeView(S2, (m.l + W - m.r)/2 - mid.x*S2, (m.t + H - m.b)/2 + mid.y*S2);
    if (grow && Math.abs(f - 1) < .01) break;
  }
  draw();
}
/* Zoom to S px/mm about screen point (cx, cy). */
function zoomAbout(S, cx, cy){
  const m = view.inv(cx, cy);
  S = clamp(S, ...S_LIMITS);
  view = makeView(S, cx - m.x*S, cy + m.y*S);
  draw();
}
/* The stage's visible middle, above the bar. */
function stageMiddle(){
  const bar = document.querySelector(".bar");
  return [(svg.clientWidth || 800)/2, ((svg.clientHeight || 600) - (bar ? bar.offsetHeight : 0))/2];
}
/* + and −: next ZOOM_LEVELS step about the middle. */
function zoomStep(dir){
  const z = zoomOf(), next = dir > 0 ? ZOOM_LEVELS.find(l => l > z*1.001) : [...ZOOM_LEVELS].reverse().find(l => l < z/1.001);
  zoomAbout((next ?? z*(dir > 0 ? 1.5 : 1/1.5))*docScale(), ...stageMiddle());
}
const zoomTo100 = () => zoomAbout(docScale(), ...stageMiddle());
/* Switch zoom behaviour, keeping the zoom. */
function setZoomMode(mode){
  if (!ZOOM_MODES[mode]) return;
  ui.zoom = mode;
  try { localStorage.setItem(ZOOM_STORE, mode); } catch {}
  syncZoomControls();
  draw();
}
/* Text and Lines: figure sizes in 10% steps, saved and exported. Text scales fonts and spacing; Lines
   scales line weights. Symbols and label gaps don't change. Fit to layout resets scale and both to 100%. */
const TEXT_LIMITS = [.1, 8];
function setFigureSize(key, v){                  // key: "text" or "lines"
  v = clamp(Math.round(v*1e4)/1e4, ...TEXT_LIMITS);
  if (v === scene[key]) return;
  scene[key] = v;
  draw();
  syncZoomControls();
}
const sizeStep = (key, dir) => {                 // onto the next tenth, so odd sizes rejoin the steps
  const t = scene[key]*10;
  setFigureSize(key, (dir > 0 ? Math.floor(t + 1e-6) + 1 : Math.ceil(t - 1e-6) - 1)/10);
};
function fitTextToLayout(){
  scene.scale = autoScale(); scene.text = 1; scene.lines = 1;
  syncZoomControls(); draw();
  flashStatus("Text and lines sized to the layout");
}
function syncZoomControls(){
  for (const b of document.querySelectorAll("#zoomMode [data-zoom]")) b.setAttribute("aria-checked", String(b.dataset.zoom === ui.zoom));
  for (const [key, id] of [["text", "txt"], ["lines", "line"]]){
    document.getElementById(id + "Pct").textContent = Math.round(scene[key]*100) + "%";
    document.getElementById(id + "Dn").disabled = scene[key] <= TEXT_LIMITS[0];
    document.getElementById(id + "Up").disabled = scene[key] >= TEXT_LIMITS[1];
  }
}

/* Holes: HOLE_D on a GRID pitch, one tiled pattern (min 1.5 px). Hidden when too dense or off; snap works regardless. */
const gridPitch = () => GRID*view.S;
function gridOrigin(){                           // tile corner so a hole sits on the origin
  const p = gridPitch(), o = view.pt({ x:0, y:0 });
  return { x:(o[0] % p) - p/2, y:(o[1] % p) - p/2 };
}
function gridMarkup(W, H){
  const p = gridPitch(); if (!ui.grid || p < 9) return "";
  const r = Math.max(.75, HOLE_D/2*view.S), o = gridOrigin(), rim = Math.min(1.8, .13*r + .3);
  const hole = currentTheme() !== "gray" ? `<circle cx="${p/2}" cy="${p/2}" r="${fx(r)}" fill="var(--hole)"/>`
    : `<circle cx="${p/2}" cy="${p/2}" r="${fx(r)}" fill="url(#holeWell)"/>`   // on the table: a dark well, its top in
      + (r > 2.5 ? `<circle cx="${p/2}" cy="${p/2}" r="${fx(r - rim/2)}" fill="none" stroke="url(#holeRim)" stroke-width="${fx(rim)}"/>` : "");   // shadow, its chamfer ring lit below
  return `<defs>` + (currentTheme() === "gray" ? `<linearGradient id="holeWell" x2="0" y2="1"><stop offset="0" stop-color="#101215"/><stop offset=".55" stop-color="#202428"/><stop offset="1" stop-color="#454B51"/></linearGradient>`
      + `<linearGradient id="holeRim" x2="0" y2="1"><stop offset="0" stop-color="#7C838A" stop-opacity=".45"/><stop offset=".5" stop-color="#C9CED2" stop-opacity=".55"/><stop offset="1" stop-color="#F6F8F9" stop-opacity=".9"/></linearGradient>` : "")
    + `<pattern id="holes" patternUnits="userSpaceOnUse" x="${o.x}" y="${o.y}" width="${p}" height="${p}">${hole}</pattern></defs>`
    + `<rect width="${W}" height="${H}" fill="url(#holes)"/>`;
}

/* The nearest hole (+ 0 avoids −0), and the next one from v toward sign. */
const onHole = k => +(k*GRID).toFixed(3) + 0;   // the k-th hole's coordinate, clear of floating-point dust
const snapToGrid = p => ({ x:onHole(Math.round(p.x/GRID)), y:onHole(Math.round(p.y/GRID)) });
const nextHole = (v, sign) => { const n = v/GRID; return onHole(sign > 0 ? Math.floor(n + 1e-9) + 1 : Math.ceil(n - 1e-9) - 1); };
/* Prism corners snap to a quarter pitch (6.25 mm); Shift: holes. */
const VERT_DIV = 4;
const vertStep = coarse => coarse ? GRID : GRID/VERT_DIV;
function snapToVertGrid(p, coarse){
  const q = vertStep(coarse), r = v => +(Math.round(v/q)*q).toFixed(3) + 0;
  return { x:r(p.x), y:r(p.y) };
}
/* Snap rotation: multiples of ROT_SNAP (Shift: 45°), nearest (snapRot) or next toward sg (nextRot). */
const ROT_SNAP = 45/4;
const rotSnapStep = coarse => coarse ? 45 : ROT_SNAP;
const snapRot = (a, coarse) => { const q = rotSnapStep(coarse); return Math.round(a/q)*q + 0; };
const nextMultiple = (a, sg, q) => { const n = a/q; return (sg > 0 ? Math.floor(n + 1e-6) + 1 : Math.ceil(n - 1e-6) - 1)*q + 0; };
const nextRot = (a, sg, coarse) => nextMultiple(a, sg, rotSnapStep(coarse));
/* Polarization angles step by whole degrees regardless of Snap ([ ] on a wave plate; Shift: 15°). Typed values stay. */
const POL_ANGLE = ' min="-360" max="360"';       // with step 1, a spinner's steps fall on whole degrees
/* Where a dragged source lands: nearest hole with Snap, else a ~2 px step (Shift: 10×). */
function placeAt(p, coarse){
  if (ui.snap) return snapToGrid(p);
  const q = niceStep(2/view.S)*(coarse ? 10 : 1), r = v => +(Math.round(v/q)*q).toFixed(3);
  return { x:r(p.x), y:r(p.y) };
}
/* Snap position along segment s near distance t: abreast of the hole nearest t among those within
   half a pitch of the beam. Positions within GAP of the start don't count; none in reach keeps t. */
function snapAlong(s, t){
  const n = leftNormal(s.dir), at = { x:s.p0.x + s.dir.x*t, y:s.p0.y + s.dir.y*t }, R = 2*GRID;
  let best = null;
  for (let i = Math.floor((at.x - R)/GRID); i <= Math.ceil((at.x + R)/GRID); i++)
    for (let j = Math.floor((at.y - R)/GRID); j <= Math.ceil((at.y + R)/GRID); j++){
      const rx = i*GRID - s.p0.x, ry = j*GRID - s.p0.y;
      if (Math.abs(rx*n.x + ry*n.y) > GRID/2 + 1e-6) continue;   // too far from this hole
      const u = rx*s.dir.x + ry*s.dir.y;                         // closest approach
      if (u >= GAP && (best === null || Math.abs(u - t) < Math.abs(best - t))) best = u;
    }
  return best === null ? t : +best.toFixed(3) + 0;
}

/* ---------- handles (screen only) ---------- */
const RADIUS_GRIP = 12;   // px from the beam edge to a source's radius grip
/* Lattice points a snapped prism corner can land on, fading around it. */
function vertLatticeMarkup(d, pal){
  const node = nodeOf(d.id);
  if (!node || !node.poly || !node.poly.V[d.vi]) return "";
  return latticeMarkup(localToModel(node.p, node.poly.dIn, node.poly.V[d.vi]), d.coarse, pal);
}
function latticeMarkup(v, coarse, pal){          // the lattice points around model point v
  const q = vertStep(coarse), px = q*view.S;
  if (px < 5) return "";
  const R = Math.max(1.5*GRID, 3*q), dots = [];
  for (let i = Math.ceil((v.x - R)/q); i*q <= v.x + R; i++)
    for (let j = Math.ceil((v.y - R)/q); j*q <= v.y + R; j++){
      const g = Math.hypot(i*q - v.x, j*q - v.y)/R; if (g > 1) continue;
      const c = view.pt({ x:i*q, y:j*q });
      dots.push(`<circle cx="${fx(c[0])}" cy="${fx(c[1])}" r="1.6" fill-opacity="${fx(.85*(1 - g*g))}"/>`);
    }
  return `<g fill="${pal.accent}" pointer-events="none">${dots.join("")}</g>`;
}
function handlesMarkup(pal){
  const S = view.S, P = view.pt, out = [], { D, k } = figFrame();   // D, k: for outlines of drawn parts
  tr.segs.forEach((s, i) => {                    // beam segments: click to add an element, drag for length
    if (s.kind === "glass" || s.geo < 4) return;
    out.push(`<path data-seg="${i}" d="${pathD([P(s.p0), P(s.p1)])}" stroke="#000" stroke-opacity="0" stroke-width="18" fill="none" pointer-events="stroke" style="cursor:pointer"/>`);
  });
  if (drag && drag.mode === "vert" && ui.snap) out.push(vertLatticeMarkup(drag, pal));
  for (const node of tr.nodes)                   // fiber cables first, under optic handles
    if (!node.link && node.fiber) out.push(`<path data-cable="${node.el.id}" d="${cablePath(node.fiber.cable, P)}" fill="none" stroke="#000"`
      + ` stroke-opacity="0" stroke-width="${fx(cableWidth(D)*k + 10)}" pointer-events="stroke" style="cursor:copy"/>`);
  for (const a of scene.annotations) out.push(annotationHandles(a, pal, k));   // under optic handles, so optics stay pickable
  for (const node of tr.nodes) out.push(elementHandles(node, pal, D, k));
  const ring = (id, ink, op, dash, at) => {      // join cue for a dragged beam end (at: fiber end)
    const n = nodeOf(id); if (!n) return;
    const c = P(at || n.p), r = clamp(Math.max(10, n.el.ap*S), 11, 30) + 6;
    out.push(`<circle cx="${fx(c[0])}" cy="${fx(c[1])}" r="${fx(r)}" fill="none" stroke="${ink}" stroke-opacity="${op}" stroke-width="1.5" stroke-dasharray="${dash}"/>`);
  };
  if (drag && drag.mode === "seg"){
    if (drag.next && !drag.target) ring(drag.next, pal.accent, .7, "4 4", drag.nextAt);   // the one optic it could join
    if (drag.over) ring(drag.over, "var(--warn)", 1, "2 3");                 // one it can't: not in its path
  }
  if (drag && drag.target){                      // the optic a dragged end is joining
    const n = nodeOf(drag.target);
    if (n){
      const c = P(drag.targetAt || n.p), r = clamp(Math.max(10, n.el.ap*S), 11, 30) + 6;
      out.push(`<circle cx="${fx(c[0])}" cy="${fx(c[1])}" r="${fx(r)}" fill="${pal.accent}" fill-opacity=".12" stroke="${pal.accent}" stroke-width="2"/>`);
    }
  }
  for (const s of tr.segs){                      // beam ends
    if (s.kind !== "tail" || s.endsOn) continue;
    const e = P(s.p1), id = endId(s.holder), on = sel === id;
    out.push(`<rect data-endpt="${id}" x="${fx(e[0] - 3.5)}" y="${fx(e[1] - 3.5)}" width="7" height="7" fill="${on ? pal.accent : "transparent"}" fill-opacity="${on ? .9 : 0}"`
      + ` stroke="${on ? pal.accent : "transparent"}" stroke-width="1.5" pointer-events="all" style="cursor:move"/>`);
  }
  for (const { src, seg } of tr.emitters){        // sources on top. When selected,
    const s0 = tr.segs[seg], c = P(s0.p0), on = sel === src.id && !multi.size, wpx = src.w0*scene.exag*S;   // a beam-radius grip on
    const ringed = on || multi.has(src.id);       // one of several selected: ringed, without grips
    out.push(`<circle data-src="${src.id}" cx="${fx(c[0])}" cy="${fx(c[1])}" r="${fx(clamp(wpx, 12, 30))}" fill="transparent" pointer-events="all"`   // the emitter bar
      + ` stroke="${ringed ? pal.accent : "transparent"}" stroke-width="1.5" stroke-dasharray="3 3" style="cursor:move"/>`);   // and a rotation grip on the axis
    const sh = sourceShape(src, Math.max(9, src.w0*scene.exag*D)), back = sh.back*k, half = sh.half*k;
    if (back > 12){                               // laser or LED body: grab anywhere
      const at = lensToScreen(c, s0.dir), q = [at(-back, -half), at(0, -half), at(0, half), at(-back, half)];
      out.push(`<path data-src="${src.id}" d="${pathD(q)}Z" fill="transparent" pointer-events="all" stroke="${ringed ? pal.accent : "transparent"}"`
        + ` stroke-width="1.5" stroke-dasharray="3 3" style="cursor:move"/>`);
    }
    if (on){
      const n = leftNormal(s0.dir), g = (wpx + RADIUS_GRIP)/S, q = P({ x:s0.p0.x + n.x*g, y:s0.p0.y + n.y*g });
      out.push(`<rect data-radius="${src.id}" x="${fx(q[0] - 2.5)}" y="${fx(q[1] - 2.5)}" width="5" height="5" fill="${pal.accent}" pointer-events="all" style="cursor:ns-resize"/>`
        + (src._aim ? "" : `<rect data-rot="${src.id}" x="${fx(c[0] + 58*s0.dir.x - 3.5)}" y="${fx(c[1] - 58*s0.dir.y - 3.5)}" width="7" height="7" fill="${pal.accent}" pointer-events="all" style="cursor:grab"/>`));
    }
  }
  out.push(annotationOverlay(pal, D, k));        // on top: annotation grips, one being placed, snap cue
  if (drag && drag.mode === "box"){              // box selection
    const b = boxRect(drag);
    out.push(`<rect x="${fx(b.x0)}" y="${fx(b.y0)}" width="${fx(b.x1 - b.x0)}" height="${fx(b.y1 - b.y0)}" fill="${pal.accent}" fill-opacity=".08"`
      + ` stroke="${pal.accent}" stroke-width="1" stroke-dasharray="4 3" pointer-events="none"/>`);
  }
  return out.join("");
}
/* An annotation's pick area: widened lines and a text box. Selected: accent tint, label box outlined. */
function annotationHandles(a, pal, k){
  const P = view.pt, on = sel === a.id, id = a.id, pts = a.pts.map(q => P(annXY(q)));
  const line = d => `<path data-ann="${id}" d="${d}" fill="none" stroke="${on ? pal.accent : "#000"}" stroke-opacity="${on ? .2 : 0}"`
    + ` stroke-width="12" stroke-linecap="round" stroke-linejoin="round" pointer-events="stroke" style="cursor:move"/>`;
  const box = (cx, cy, w, h, rot, ring) => `<rect data-ann="${id}" x="${fx(cx - w/2)}" y="${fx(cy - h/2)}" width="${fx(w)}" height="${fx(h)}" rx="3"`
    + (rot ? ` transform="rotate(${fx(rot)},${fx(cx)},${fx(cy)})"` : "") + ` fill="transparent" pointer-events="all"`
    + ` stroke="${ring ? pal.accent : "transparent"}" stroke-width="1.2" stroke-dasharray="3 3" style="cursor:move"/>`;
  if (a.type === "ruler"){
    const T = rulerText(pts[0], pts[1], a.flip, k, scene.text), fs = RULER.fs*scene.text*k, w = fmtLen(rulerLength(a)).length*fs*.6 + 8;
    return line(pathD(pts)) + box(T.x + T.up[0]*.36*fs, T.y + T.up[1]*.36*fs, w, fs + 6, T.ang, false);
  }
  if (a.type === "protractor"){
    const sh = protractorShape(pts[0], pts[1], pts[2], a, k, scene.text), fs = PROT.fs*scene.text*k, w = sh.text.length*fs*.6 + 8;
    const cx = sh.anchor === "start" ? sh.x + w/2 - 4 : sh.anchor === "end" ? sh.x - w/2 + 4 : sh.x;
    return line(pathD([pts[1], pts[0], pts[2]]) + sh.arc) + box(cx, sh.y, w, fs + 6, 0, false);
  }
  const b = labelBox(a, k, scene.text);
  return box(pts[0][0], pts[0][1], Math.max(24, 2*b.hw + 10), Math.max(16, 2*b.hh + 6), 0, on);
}
/* Over all handles: selected annotation grips, the one being placed, and the snap ring. */
function annotationOverlay(pal, D, k){
  const P = view.pt, out = [], a = selectedAnnotation();
  if (a && a.type !== "label") a.pts.forEach((q, i) => {
    const c = P(annXY(q)), vertex = a.type === "protractor" && i === 0;
    out.push(vertex ? `<circle data-annpt="${a.id}:${i}" cx="${fx(c[0])}" cy="${fx(c[1])}" r="4.5"` : `<rect data-annpt="${a.id}:${i}" x="${fx(c[0] - 3.5)}" y="${fx(c[1] - 3.5)}" width="7" height="7"`);
    out.push(` fill="${pal.accent}" stroke="${pal.bg}" stroke-width="1" pointer-events="all" style="cursor:crosshair"/>`);
  });
  if (placing){
    const pts = placing.pts, n = pts.length;
    if (placing.type === "protractor" && n < 3)   // the vertex and the first arm, so far
      out.push(`<path d="${pathD(pts.map(q => P(annXY(q))))}" fill="none" stroke="${pal.ink2}" stroke-width="${fx(PROT.w*scene.lines*k)}" pointer-events="none"/>`);
    else {
      const ghost = { type:placing.type, pts, ...ANN_TYPES[placing.type].defaults() };
      out.push(`<g transform="translate(${view.ox},${view.oy}) scale(${k})" pointer-events="none">`
        + scaleStrokes(ANN_PAINT[placing.type]({ P:makeView(D, 0, 0).pt, pal, mark(){}, T:scene.text }, ghost), scene.lines) + `</g>`);
    }
    for (let i = 0; i < placing.step; i++){ const c = P(annXY(pts[i])); out.push(`<circle cx="${fx(c[0])}" cy="${fx(c[1])}" r="3" fill="${pal.accent}" pointer-events="none"/>`); }
  }
  if (snapCue){
    const c = P(snapCue);
    out.push(`<circle cx="${fx(c[0])}" cy="${fx(c[1])}" r="7" fill="none" stroke="${pal.accent}" stroke-width="1.5" pointer-events="none"/>`);
  }
  return out.join("");
}
/* The (+) icon, 16 px, centred on 0,0. */
/* The (+): a disc with a white cross, plus a ring per other beam pass sharing the point, in its colour. */
function plusMarkup(fill, rings = []){
  const w = 2.5, g = 1.2, R = 8 + rings.length*(w + g);
  let s = rings.length ? `<circle r="${fx(R)}" fill="var(--bg)"/>` : "";
  rings.forEach((c, k) => { s += `<circle r="${fx(8 + g + k*(w + g) + w/2)}" fill="none" stroke="${c}" stroke-width="${w}"/>`; });
  return s + `<circle r="8" fill="${fill}"/>`
    + `<path d="M-3.5,0h7M0,-3.5v7" stroke="#fff" stroke-width="1.6" stroke-linecap="round" fill="none"/>`;
}
const PLUS_ICON = plusMarkup("var(--accent)");
/* A segment's colour: its first line, or grey if unlit. */
function segInk(s){
  const pal = screenPalette();
  if (!s.chans.length) return pal.ink3;
  return strokeOf(pal, lineColor(s.src, s.chans[0].nm));
}
/* Every beam pass through point u mm along segment i: { seg, u, back }, sorted in trace order. The
   first owns an insert; the rest link to it. */
const SHARED_TOL = 0.05;                         // mm off the line, and ~0.25° off its direction
function sharedAt(i, u){
  const s = tr.segs[i]; if (!s) return [];
  const P = { x:s.p0.x + s.dir.x*u, y:s.p0.y + s.dir.y*u }, out = [];
  for (const t of tr.segs){
    if (t.kind === "glass" || t.geo < 1e-6) continue;
    const dot = t.dir.x*s.dir.x + t.dir.y*s.dir.y;
    if (Math.abs(dot) < 0.99999) continue;
    const v = along(t, P);
    if (t !== s && (v < 1 || v > t.geo - 1 || Math.abs(project(P, t.p0, leftNormal(t.dir))) > SHARED_TOL)) continue;
    out.push({ seg:t.i, u:t === s ? u : v, back:dot < 0 });
  }
  return out.sort((a, b) => a.seg - b.seg);
}
/* The beam (+) at `inserting`, in screen coords, coloured by the beam; rings mark other passes. */
function addMarkMarkup(){
  if (!inserting) return "";
  const s = tr.segs[inserting.seg];
  if (!s){ inserting = null; return ""; }
  const c = view.pt({ x:s.p0.x + s.dir.x*inserting.u, y:s.p0.y + s.dir.y*inserting.u });
  inserting.sx = c[0]; inserting.sy = c[1];
  const others = sharedAt(inserting.seg, inserting.u).filter(x => x.seg !== s.i).slice(0, 3).map(x => segInk(tr.segs[x.seg]));
  return `<defs><filter id="plusShadow" x="-50%" y="-50%" width="200%" height="200%">`
    + `<feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity=".27"/></filter></defs>`
    + `<g transform="translate(${fx(c[0])},${fx(c[1])})" filter="url(#plusShadow)">${plusMarkup(segInk(s), others)}</g>`;
}
/* Move the (+) without redrawing the figure. */
function showAddMark(){
  const g = svg.querySelector("#addmark");
  if (g) g.innerHTML = addMarkMarkup(); else draw();
}
/* Fiber handles: input slides (data-el), output moves (data-fibout) and turns (data-rot), cable points drag (data-via). */
function fiberHandles(node, pal, on, D, k){
  const S = view.S, P = view.pt, el = node.el, { ends } = node.fiber, ring = on || multi.has(el.id) ? pal.accent : "transparent", out = [];
  const box = (e, into, attr) => {
    const c = P(e.p), L = fiberPkgLen(e)*S, H = fiberEndH(e, el.ap, D)*k + 3, x = fiberDome(e, el.ap, D)*k + 3;
    out.push(`<rect ${attr}="${el.id}" x="${fx(-x)}" y="${fx(-H)}" width="${fx(L + x + 3)}" height="${fx(2*H)}" rx="4"`
      + ` transform="translate(${fx(c[0])},${fx(c[1])}) rotate(${fx(screenDeg(into))})" fill="transparent" pointer-events="all"`
      + ` stroke="${ring}" stroke-width="1.5" stroke-dasharray="3 3" style="cursor:move"/>`);
  };
  box(ends.in, ends.in.dir, "data-el");
  box(ends.out, { x:-ends.out.dir.x, y:-ends.out.dir.y }, "data-fibout");
  if (!on) return out.join("");
  const B = P(ends.out.p), G = [B[0] + 58*ends.out.dir.x, B[1] - 58*ends.out.dir.y];
  if (!el._aim) out.push(`<path d="${pathD([B, G])}" stroke="${pal.accent}" stroke-width="1" stroke-dasharray="3 3"/>`   // not when a link aims it
    + `<rect data-rot="${el.id}" x="${fx(G[0] - 3.5)}" y="${fx(G[1] - 3.5)}" width="7" height="7" fill="${pal.accent}" pointer-events="all" style="cursor:grab"/>`);
  el.via.forEach(([x, y], i) => { const q = P({ x, y });
    out.push(`<circle data-via="${el.id}:${i}" cx="${fx(q[0])}" cy="${fx(q[1])}" r="4.5" fill="${pal.bg}" stroke="${pal.accent}" stroke-width="1.8"`
      + ` pointer-events="all" style="cursor:crosshair"/>`); });
  return out.join("");
}
function elementHandles(node, pal, D, k){
  const S = view.S, P = view.pt, el = node.el, c = P(node.p), on = sel === el.id && !multi.size;   // one of several: ringed, without grips
  if (node.link){                                // a visit: the owner's handle picks; a ring marks selection
    if (!on) return "";
    const r = clamp(Math.max(10, node.eff.ap*S), 11, 30) + 5;
    return `<circle cx="${fx(c[0])}" cy="${fx(c[1])}" r="${fx(r)}" fill="none" stroke="${pal.accent}" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  }
  if (el.type === "fiber") return fiberHandles(node, pal, on, D, k);
  const h = Math.max(10, el.ap*S), ring = on || multi.has(el.id) ? pal.accent : "transparent";
  const grip = B => `<rect data-rot="${el.id}" x="${fx(B[0] - 3.5)}" y="${fx(B[1] - 3.5)}" width="7" height="7" fill="${pal.accent}" pointer-events="all" style="cursor:grab"/>`;
  const box = bodyBox(el, D), housed = box && { x0:box.x0*k, x1:box.x1*k, H:box.H*k };   // as drawn, magnified
  const outline = el.type === "polygon" ? polyModel(node) : node.scan ? node.scan.V : node.retro ? retroOutline(node.retro, 5/D, true)
                : node.pair ? pairOutline(node.pair, 5/D) : null;
  let s = outline                                // prisms, polygons, roofs, pairs pick anywhere in the body
    ? `<path data-el="${el.id}" d="${pathD(outline.map(P))}Z" fill="transparent" pointer-events="all" stroke="${ring}" stroke-width="1.5" stroke-dasharray="3 3" style="cursor:move"/>`
    : housed                                     // so is a housed lens or a Faraday rotator
    ? `<rect data-el="${el.id}" x="${fx(housed.x0 - 4)}" y="${fx(-housed.H - 4)}" width="${fx(housed.x1 - housed.x0 + 8)}" height="${fx(2*housed.H + 8)}" rx="4"`
      + ` transform="translate(${fx(c[0])},${fx(c[1])}) rotate(${fx(screenDeg(node.dirIn))})" fill="transparent" pointer-events="all"`
      + ` stroke="${ring}" stroke-width="1.5" stroke-dasharray="3 3" style="cursor:move"/>`
    : `<circle data-el="${el.id}" cx="${fx(c[0])}" cy="${fx(c[1])}" r="${fx(clamp(h, 11, 30))}" fill="transparent" pointer-events="all" stroke="${ring}" stroke-width="1.5" stroke-dasharray="3 3" style="cursor:move"/>`;
  if (!on) return s;

  if (el.type === "grating"){                    // tilt grip on the normal
    const { N, refl } = node.grating, nd = refl ? { x:-N.x, y:-N.y } : N, r = 58;
    const B = [c[0] + r*nd.x, c[1] - r*nd.y];
    s += `<path d="${pathD([c, B])}" stroke="${pal.accent}" stroke-width="1" stroke-dasharray="3 3"/>` + grip(B);
  }
  if (FOLDS.has(el.type) && !el._aim){           // deflection grip on the outgoing ray (unless link-aimed)
    const r = 58, A = [c[0] + r*node.dirIn.x, c[1] - r*node.dirIn.y], B = [c[0] + r*node.dirOut.x, c[1] - r*node.dirOut.y];
    s += `<path d="M${fx(A[0])},${fx(A[1])}A${r},${r} 0 0 ${signedDeg(node.dirIn, node.dirOut) > 0 ? 1 : 0} ${fx(B[0])},${fx(B[1])}" fill="none" stroke="${pal.accent}" stroke-width="1" stroke-dasharray="3 3"/>`
       + `<path d="${pathD([c, B])}" stroke="${pal.accent}" stroke-width="1" stroke-opacity=".45"/>` + grip(B);
  }
  if (node.retro){                               // roof: tilt grip and aperture grips
    const g = node.retro, B = [c[0] + 58*g.U.x, c[1] - 58*g.U.y];
    s += `<path d="${pathD([c, B])}" stroke="${pal.accent}" stroke-width="1" stroke-dasharray="3 3" pointer-events="none"/>` + grip(B);
    for (const E of [g.E1, g.E2]){
      const q = P({ x:g.O.x + E.x*g.L, y:g.O.y + E.y*g.L });
      s += `<rect data-ap="${el.id}" x="${fx(q[0] - 2.5)}" y="${fx(q[1] - 2.5)}" width="5" height="5" fill="${pal.accent}" pointer-events="all" style="cursor:ns-resize"/>`;
    }
    return s;
  }
  if (node.pair){                                // mirror pair: first-bounce deflection
    const r = 58, dR = node.pair.dR, A = [c[0] + r*node.dirIn.x, c[1] - r*node.dirIn.y], B = [c[0] + r*dR.x, c[1] - r*dR.y];
    return s + `<path d="M${fx(A[0])},${fx(A[1])}A${r},${r} 0 0 ${signedDeg(node.dirIn, dR) > 0 ? 1 : 0} ${fx(B[0])},${fx(B[1])}" fill="none" stroke="${pal.accent}" stroke-width="1" stroke-dasharray="3 3" pointer-events="none"/>`
      + `<path d="${pathD([c, B])}" stroke="${pal.accent}" stroke-width="1" stroke-opacity=".45" pointer-events="none"/>` + grip(B);
  }
  if (el.type !== "polygon"){                    // aperture grips at ±ap, or at facet ends
    const n = node.scan ? leftNormal(node.scan.N) : leftNormal(node.dirIn), o = node.scan ? node.scan.Fc : node.p;
    for (const sg of [1, -1]){
      const q = P({ x:o.x + n.x*sg*h/S, y:o.y + n.y*sg*h/S });
      s += `<rect data-ap="${el.id}" x="${fx(q[0] - 2)}" y="${fx(q[1] - 2)}" width="4" height="4" fill="${pal.accent}" pointer-events="all" style="cursor:ns-resize"/>`;
    }
  } else {                                       // vertex grips, and ⊕ at edge midpoints to add one
    const V = node.poly.V, toS = v => P(localToModel(node.p, node.poly.dIn, v)), coated = new Set(el.mirrors || []);
    V.forEach((v, i) => {                        // a coated face's ⊕ is filled in
      const w = V[(i + 1) % V.length], q = toS({ x:(v.x + w.x)/2, y:(v.y + w.y)/2 }), on = coated.has(i);
      s += `<circle data-addvert="${el.id}:${i}" cx="${fx(q[0])}" cy="${fx(q[1])}" r="6.5" fill="${on ? pal.accent : pal.bg}" fill-opacity="${on ? 1 : .85}" stroke="${pal.accent}" stroke-width="1.2" pointer-events="all" style="cursor:copy"/>`
         + `<path d="M${fx(q[0] - 3)},${fx(q[1])}h6M${fx(q[0])},${fx(q[1] - 3)}v6" stroke="${on ? pal.bg : pal.accent}" stroke-width="1.2" pointer-events="none"/>`;
    });
    V.forEach((v, i) => {
      const q = toS(v);
      s += `<rect data-vert="${el.id}:${i}" x="${fx(q[0] - 2.5)}" y="${fx(q[1] - 2.5)}" width="5" height="5" fill="${pal.accent}" pointer-events="all" style="cursor:crosshair"/>`;
    });
  }
  return s;
}


/* =====================================================================
   9. POINTER, INSERTION, KEYBOARD
   ===================================================================== */
const modelAt = e => { const r = svg.getBoundingClientRect(); return view.inv(e.clientX - r.left, e.clientY - r.top); };
const along   = (s, m) => project(m, s.p0, s.dir);            // distance of m along segment s
const nodeOf  = id => tr.nodes.find(n => n.el.id === id);
const splitRef = ref => { const k = ref.lastIndexOf(":"); return [ref.slice(0, k), +ref.slice(k + 1)]; };   // "id:index"

svg.addEventListener("pointerdown", e => {
  if (e.button) return;                          // right button: vertex delete (contextmenu)
  endGesture(); startGesture();                  // one undo step per drag
  if (tool){ placeDown(e); svg.setPointerCapture(e.pointerId); draw(); return; }   // an annotation tool is armed: every press places
  const hit = q => e.target.closest(q);
  if (e.shiftKey && (t0 => t0 && toggleMulti(t0.dataset.src || t0.dataset.el))(hit("[data-src],[data-el]"))){   // Shift-click: add it to the selection, or take it out
    inserting = null; closeInsMenu(); draw(); return;
  }
  const endpt = hit("[data-endpt]"), segEl = hit("[data-seg]");
  let t;
  if (endpt){
    const id = endpt.dataset.endpt, seg = tr.segs.find(s => s.kind === "tail" && endId(s.holder) === id);
    drag = { mode:"seg", seg, i:seg.i, moved:true, tail0:seg.holder[seg.key] };   // tail0: its length before, should it join
    select(id);
  }
  else if ((t = hit("[data-annpt]"))){ const [id, i] = splitRef(t.dataset.annpt); drag = { mode:"annpt", id, i }; select(id); }
  else if ((t = hit("[data-ann]"))){               // an annotation: select it, and a drag moves it whole
    const id = t.dataset.ann, a = annById(id);
    if (a) drag = { mode:"ann", id, m0:modelAt(e), p0:a.pts.map(q => [...q]), x:e.clientX, y:e.clientY, moved:false };
    const tap = lastTap; lastTap = { id, t:e.timeStamp };
    if (tap && tap.id === id && e.timeStamp - tap.t < 400 && a && a.type === "label"){ lastTap = null; drag.editText = true; }   // a double click edits its text
    select(id);
  }
  else if ((t = hit("[data-addvert]"))){
    const [id, i] = splitRef(t.dataset.addvert), node = nodeOf(id);
    if (node){
      addVertexAfter(node.el, i);
      sel = id; drag = { mode:"vert", id, vi:i + 1 };
      commit();
    }
  }
  else if ((t = hit("[data-vert]"))){ const [id, vi] = splitRef(t.dataset.vert); drag = { mode:"vert", id, vi }; }
  else if ((t = hit("[data-via]"))){ const [id, i] = splitRef(t.dataset.via); drag = { mode:"via", id, i }; select(id); }
  else if ((t = hit("[data-fibout]"))){            // fiber output end: select, drag on the table
    const id = t.dataset.fibout, el = objects.elById.get(id), m = modelAt(e);
    if (el) drag = { mode:"fibout", id, off:{ x:m.x - el.ox, y:m.y - el.oy }, x:e.clientX, y:e.clientY, moved:false };
    select(id);
  }
  else if ((t = hit("[data-cable]"))){             // fiber cable: select, drag to bend
    drag = { mode:"cable", id:t.dataset.cable, x:e.clientX, y:e.clientY, m0:modelAt(e) };
    select(t.dataset.cable);
  }
  else if ((t = hit("[data-rot]")))    drag = { mode:"rot", id:t.dataset.rot };
  else if ((t = hit("[data-ap]")))     drag = { mode:"ap", id:t.dataset.ap };
  else if ((t = hit("[data-radius]"))) drag = { mode:"radius", id:t.dataset.radius };
  else if ((t = hit("[data-src]"))){               // source: select, drag the whole beam
    const src = sourceById(t.dataset.src), m = modelAt(e);
    if (src) drag = { mode:"translate", id:src.id, off:{ x:m.x - src.x, y:m.y - src.y }, x:e.clientX, y:e.clientY, moved:false };
    select(t.dataset.src);
  }
  else if ((t = hit("[data-el]"))){                // keep the grab point under the pointer
    const id = t.dataset.el, node = nodeOf(id), m = modelAt(e), seg = node && tr.segs[node.segIn];
    drag = { mode:"move", id, off:node ? along(seg, m) - node.el.d : 0,
             across:node && node.retro ? project(m, seg.p0, leftNormal(seg.dir)) + node.el.off : 0 };   // a roof moves across its beam too
    const tap = lastTap; lastTap = { id, t:e.timeStamp };
    if (tap && tap.id === id && e.timeStamp - tap.t < 400 && node && node.el.type === "shutter"){   // a double click opens or closes a shutter
      lastTap = null; toggleShutter(node.el);
    }
    select(id);
  }
  else if (segEl){
    const i = +segEl.dataset.seg, s = tr.segs[i];
    drag = { mode:"seg", seg:s, i, moved:false, x:e.clientX, y:e.clientY, pick:s.endEl ? s.endEl.id : endId(s.holder),
             tail0:s.kind === "tail" ? s.holder[s.key] : null };
  }
  else if (e.shiftKey){ const r = svg.getBoundingClientRect(); drag = { mode:"box", x0:e.clientX - r.left, y0:e.clientY - r.top, x1:e.clientX - r.left, y1:e.clientY - r.top }; }
  else { drag = { mode:"pan", x:e.clientX, y:e.clientY, ox:view.ox, oy:view.oy }; svg.classList.add("panning"); }
  if (!endpt && !segEl){ inserting = null; closeInsMenu(); }
  svg.setPointerCapture(e.pointerId);
  draw();
});

/* ---------- optics can't pass through each other ----------
   A link's distance is solved, so an upstream edit could carry optics past its target. A link is
   blocked when its optic is less than GAP ahead; edits may not block a link. */
const GAP = 2;                                   // mm: minimum spacing on a beam
function blockedLinks(){
  const out = new Set();
  (function visit(list){
    for (const el of list || []){
      if (el.type === "link" && el._d != null && el._d < GAP) out.add(el);
      visit(el.branch); if (el.arms) for (const k in el.arms) visit(el.arms[k].list);
    }
  })(scene.sources.flatMap(s => s.chain));
  return out;
}
/* Fields aiming writes (§4), so trial traces leave nothing behind. */
function aimState(){
  const saved = [], keep = (o, keys) => { for (const k of keys) if (o[k] !== undefined) saved.push([o, k, o[k]]); };
  for (const src of scene.sources){
    keep(src, ["x", "y", "rot"]);
    (function visit(list){
      for (const el of list || []){ keep(el, ["d", "angle", "ox", "oy", "orot"]); visit(el.branch); if (el.arms) for (const k in el.arms) visit(el.arms[k].list); }
    })(src.chain);
  }
  return () => { for (const [o, k, v] of saved) o[k] = v; };
}
/* Make an edit, or as much as blocks no new link: edit(s) goes s of the way (0 to 1), found by halving.
   `whole` edits are all or nothing. Returns whether the scene changed (then commit()). */
function editClear(edit, whole = false){
  const before = blockedLinks(), undoAims = aimState();
  const clear = s => { undoAims(); edit(s); trace(scene); for (const l of blockedLinks()) if (!before.has(l)) return false; return true; };
  let s = 1;
  if (!clear(1)){
    s = 0;
    if (!whole) for (let k = 0, hi = 1; k < 16; k++){ const mid = (s + hi)/2; if (clear(mid)) s = mid; else hi = mid; }
  }
  undoAims(); edit(s);
  if (!s){ tr = trace(scene); return false; }
  return true;
}
const setClear = (o, k, v) => { const v0 = o[k]; return editClear(s => { o[k] = s ? v : v0; }, true); };   // one field, whole
/* Room for a new element at list[idx]: the gap before the next link on the straight run. */
function roomAhead(list, idx){
  for (let j = idx; j < list.length; j++){
    const x = list[j];
    if (x.type === "link") return x._d ?? Infinity;
    if (!STRAIGHT.has(x.type)) break;
  }
  return Infinity;
}

/* Drag modes: edit from pointer position m, return true if changed. Shift: coarse; sources snap to holes. */
const ANN_DRAGS = new Set(["ann", "annpt"]);     // annotation-only drags (commitAnn)
const DRAG = {
  ann(d, m, e){                                  // an annotation, whole; with Snap, its point nearest a
    const a = annById(d.id); if (!a) return false; // target lands there, else its first point on the lattice
    if (!d.moved && Math.hypot(e.clientX - d.x, e.clientY - d.y) < 3) return false;   // a click only selects
    d.moved = true;
    const dx = m.x - d.m0.x, dy = m.y - d.m0.y, moved = d.p0.map(([x, y]) => ({ x:x + dx, y:y + dy }));
    let sx, sy;                                  // the shift that lands it
    snapCue = null;
    if (ui.snap){
      let best = null;
      for (const q of moved){ const f = annSnapFeature(q, a, false); if (f && (!best || f.d < best.d)) best = { ...f, q }; }
      const q = best ? best.q : moved[0], p = best ? best.p : snapToVertGrid(q, e.shiftKey);
      sx = p.x - q.x; sy = p.y - q.y; if (best) snapCue = best.p;
    } else {
      const st = niceStep(2/view.S)*(e.shiftKey ? 10 : 1);
      sx = Math.round(dx/st)*st - dx; sy = Math.round(dy/st)*st - dy;
    }
    const pts = moved.map(q => [r3(q.x + sx), r3(q.y + sy)]);
    if (pts.every((q, i) => q[0] === a.pts[i][0] && q[1] === a.pts[i][1])) return false;
    a.pts = pts;
    return true;
  },
  annpt(d, m, e){                                // one of an annotation's points
    const a = annById(d.id); if (!a || !a.pts[d.i]) return false;
    const s = annPlace(m, e.shiftKey, a), old = a.pts[d.i];
    snapCue = s.at;
    if (s.p.x === old[0] && s.p.y === old[1]) return false;
    a.pts[d.i] = [s.p.x, s.p.y];
    return true;
  },
  fibout(d, m, e){                              // fiber output end, with everything after it
    const el = objects.elById.get(d.id); if (!el || el._aimB) return false;      // not where a link has put it
    if (!d.moved && Math.hypot(e.clientX - d.x, e.clientY - d.y) < 3) return false;   // a click only selects
    d.moved = true; inserting = null;
    const p = placeAt({ x:m.x - d.off.x, y:m.y - d.off.y }, e.shiftKey), x0 = el.ox, y0 = el.oy;
    if (p.x === x0 && p.y === y0) return false;
    return editClear(s => {                      // stops where a carried optic meets a link target
      const q = s === 1 ? p : placeAt({ x:x0 + (p.x - x0)*s, y:y0 + (p.y - y0)*s }, e.shiftKey);
      el.ox = s ? q.x : x0; el.oy = s ? q.y : y0;
    });
  },
  via(d, m, e){                                  // a cable point, snapped like a source
    const el = objects.elById.get(d.id); if (!el || !el.via[d.i]) return false;
    const p = placeAt(m, e.shiftKey), old = el.via[d.i];
    if (old[0] === p.x && old[1] === p.y) return false;
    el.via[d.i] = [p.x, p.y];
    return true;
  },
  cable(d, m, e){                                // grabbing the cable adds a point there
    if (Math.hypot(e.clientX - d.x, e.clientY - d.y) < 4) return false;
    const node = nodeOf(d.id); if (!node || !node.fiber) return false;
    const k = nearestSpan(node.fiber.cable, d.m0);
    node.el.via.splice(k, 0, [r3(d.m0.x), r3(d.m0.y)]);
    Object.assign(d, { mode:"via", i:k });
    DRAG.via(d, m, e);
    return true;
  },
  radius(d, m){                                  // beam radius (undo grip offset and draw gain)
    const em = tr.emitters.find(x => x.src.id === d.id); if (!em) return false;
    const s0 = tr.segs[em.seg], r = Math.abs(project(m, s0.p0, leftNormal(s0.dir))) - RADIUS_GRIP/view.S;
    em.src.w0 = Math.max(0.01, Math.round(r/scene.exag*100)/100);
    return true;
  },
  translate(d, m, e){                            // move a source, and with it everything on its beam
    const src = sourceById(d.id); if (!src) return false;
    if (!d.moved && Math.hypot(e.clientX - d.x, e.clientY - d.y) < 3) return false;   // a click only selects
    d.moved = true; inserting = null;
    const p = placeAt({ x:m.x - d.off.x, y:m.y - d.off.y }, e.shiftKey), x0 = src.x, y0 = src.y;
    if (p.x === x0 && p.y === y0) return false;
    return editClear(s => {                      // stops where a carried optic meets a link target
      const q = s === 1 ? p : placeAt({ x:x0 + (p.x - x0)*s, y:y0 + (p.y - y0)*s }, e.shiftKey);
      src.x = s ? q.x : x0; src.y = s ? q.y : y0;
    });
  },
  ap(d, m){                                      // half-aperture: across the beam, along a facet, across a roof
    const node = nodeOf(d.id); if (!node) return false;
    const [o, n] = node.scan ? [node.scan.Fc, leftNormal(node.scan.N)] : node.retro ? [node.retro.O, leftNormal(node.retro.U)] : [node.p, leftNormal(node.dirIn)];
    const ap = Math.max(1, Math.round(Math.abs(project(m, o, n))*2)/2);
    if (ap === node.el.ap) return false;
    return setClear(node.el, "ap", ap);
  },
  vert(d, m, e){                                 // prism vertex, stored in the unrotated body frame
    const node = nodeOf(d.id); if (!node || !node.poly) return false;
    const el = node.el, dI = node.poly.dIn;
    d.coarse = e.shiftKey;
    const p = ui.snap ? snapToVertGrid(m, e.shiftKey) : m;   // with Snap on, onto the breadboard's quarter-pitch lattice
    const vx = project(p, node.p, dI), vy = project(p, node.p, leftNormal(dI));
    const a = el.rot*Math.PI/180, ca = Math.cos(a), sa = Math.sin(a), q = e.shiftKey ? 1 : 0.5;
    const bx = vx*ca + vy*sa, by = -vx*sa + vy*ca;
    const v = ui.snap ? [r3(bx), r3(by)] : [Math.round(bx/q)*q, Math.round(by/q)*q];
    const old = el.pts[d.vi];
    if (old && old[0] === v[0] && old[1] === v[1]) return false;
    el.pts[d.vi] = v; el.form = "";               // a hand-edited outline is Custom
    return true;
  },
  rot(d, m, e){                                  // source direction, deflection, grating tilt, roof tilt or fiber end direction.
    // Snap: the grip's page direction lands on ROT_SNAP (Shift: 45°); a roof's tilt snaps itself
    const toward = o => {                        // grip direction from o, snapped; null on o
      const v = { x:m.x - o.x, y:m.y - o.y }; if (Math.hypot(v.x, v.y) < 1e-9) return null;
      if (!ui.snap) return unit(v);
      const s = snapRot(Math.atan2(v.y, v.x)/RAD, e.shiftKey)*RAD;
      return { x:Math.cos(s), y:Math.sin(s) };
    };
    const step = a => ui.snap ? Math.round(a*1e4)/1e4 + 0 : e.shiftKey ? Math.round(a/15)*15 : Math.round(a*2)/2;
    const src = sourceById(d.id);
    if (src){                                    // a source turns about its own position
      if (src._aim) return false;
      const u = toward(src); if (!u) return false;
      return setClear(src, "rot", wrapDeg(step(Math.atan2(u.y, u.x)/RAD), 180));
    }
    const node = nodeOf(d.id); if (!node || node.el._aim) return false;
    if (node.fiber){                             // a fiber's output end turns about itself
      const u = toward(node.fiber.ends.out.p); if (!u) return false;
      return setClear(node.el, "orot", wrapDeg(step(Math.atan2(u.y, u.x)/RAD), 180));
    }
    const v = { x:m.x - node.p.x, y:m.y - node.p.y };
    if (Math.hypot(v.x, v.y) < 1e-9) return false;
    if (node.retro){                             // a roof's axis, from facing the beam squarely
      const t = signedDeg({ x:-node.dirIn.x, y:-node.dirIn.y }, unit(v));
      return setClear(node.el, "tilt", clamp(ui.snap ? snapRot(t, e.shiftKey) : e.shiftKey ? Math.round(t/5)*5 : Math.round(t*2)/2, -40, 40));
    }
    let a = signedDeg(node.dirIn, toward(node.p));
    if (node.el.type === "grating"){
      const refl = node.el.geom === "reflective";
      let tilt = refl ? 180 - a : -a;            // the grip sits on the normal: N = rot(dIn, −tilt)
      tilt = ((tilt + 180) % 360 + 360) % 360 - 180;
      tilt = ui.snap ? Math.round(tilt*1e4)/1e4 : e.shiftKey ? Math.round(tilt/5)*5 : Math.round(tilt*2)/2;
      if (refl){ const mg = clamp(Math.abs(tilt), 2.5, 87.5); tilt = tilt < 0 ? -mg : mg; }
      else tilt = clamp(tilt, -85, 85);
      return setClear(node.el, "tilt", tilt);
    }
    if (ui.snap){                                // a fold can't go straight on or back
      const q = rotSnapStep(e.shiftKey);
      if (Math.abs(a) > 175) a -= Math.sign(a)*q; else if (Math.abs(a) < 5) a += (a < 0 ? -1 : 1)*q;
    }
    a = step(a);
    const mag = clamp(Math.abs(a), 5, 175);
    return setClear(node.el, "angle", a < 0 ? -mag : mag);
  },
  move(d, m){                                    // slide along the incoming segment (snapped)
    const node = nodeOf(d.id); if (!node || node.link || node.el._aimD) return false;
    const el = node.el, seg = tr.segs[node.segIn], d0 = el.d, want = along(seg, m) - d.off;
    if (node.retro) return moveRetro(d, el, seg, m, want);
    const land = t => ui.snap ? snapAlong(seg, t) : Math.round(t*10)/10;
    if (land(want) === d0) return false;
    return editClear(s => { el.d = s ? Math.max(GAP, land(d0 + (want - d0)*s)) : d0; });   // up to an optic a link must reach, not through it
  },
  seg(d, m, e){                                  // segment length, snapped; a beam end can be
    if (!d.moved && Math.hypot(e.clientX - d.x, e.clientY - d.y) < 4) return false;   // dropped on an optic to join it
    if (!d.moved && d.pick) sel = d.pick;        // a real drag selects what the segment feeds
    d.moved = true; inserting = null;
    if (fixedLength(d.seg)) return false;        // its length is derived
    const len = along(d.seg, m), cue = [d.next, d.target, d.over].join();
    let undone = false;
    if (d.seg.kind === "tail"){                  // over the optic it is heading for: it joins it, live
      const c = joinCandidate(m, d.seg), id = c.ahead && c.armed ? c.ahead.n.el.id : null, face = c.ahead ? c.ahead.face : "";
      if (id && d.preview && d.target === id && d.targetFace === face) return false;   // still joined to it: nothing to redo
      if (d.preview){ d.preview.undo(); d.preview = null; undone = true; }   // moved off it: unjoined
      d.target = d.over = null; d.next = c.ahead ? c.ahead.n.el.id : null; d.nextAt = c.ahead ? c.ahead.p : null;
      if (id && !(d.refused || (d.refused = new Set())).has(id + face)){
        d.preview = tryJoin(d.seg.holder, d.seg.key, objects.elById.get(id), d.tail0);
        if (d.preview){ Object.assign(d, { target:id, targetFace:face, targetAt:c.ahead.p }); return true; }
        d.refused.add(id + face);                // unreachable: shown like any out-of-reach optic
      }
      if (id) d.over = id; else if (c.over) d.over = c.over.el.id;
    }
    const sg = d.seg, v0 = sg.endEl ? sg.endEl.d + (sg.lead || 0) : sg.holder[sg.key];
    // with Snap, the end or optic lands abreast of a hole
    const land = t => Math.max(2, ui.snap ? snapAlong(sg, t) : Math.round(t*10)/10);
    const want = ui.snap ? land(len) : Math.max(2, e.shiftKey ? Math.round(len/10)*10 : Math.round(len));
    const changed = editClear(s => setSegmentLength(sg, s === 1 ? want : s ? land(v0 + (want - v0)*s) : v0)) || undone;
    if (!changed && cue !== [d.next, d.target, d.over].join()) draw();   // the cues changed though the beam didn't
    return changed;
  },
};
/* A roof moves along and across its beam, apex under the grab point (snapped to a hole if the beam stays in the opening). Stops before passing a link target. */
function moveRetro(d, el, seg, m, want){
  const n = leftNormal(seg.dir), d0 = el.d, o0 = el.off, lim = Math.floor(retroMaxOff(el)*10)/10;
  let dd = want, oo = clamp(d.across - project(m, seg.p0, n), -lim, lim);
  const apex = ui.snap && snapToGrid({ x:seg.p0.x + seg.dir.x*dd - n.x*oo, y:seg.p0.y + seg.dir.y*dd - n.y*oo });
  const sd = apex && project(apex, seg.p0, seg.dir), so = apex && -project(apex, seg.p0, n);
  if (apex && sd >= GAP && Math.abs(so) <= lim){ dd = sd; oo = so; }
  else { dd = Math.round(dd*10)/10; oo = clamp(Math.round(oo*10)/10, -lim, lim); }
  dd = r3(Math.max(GAP, dd)); oo = r3(oo);
  if (dd === d0 && oo === o0) return false;
  return editClear(s => { el.d = s ? r3(d0 + (dd - d0)*s) : d0; el.off = s ? r3(o0 + (oo - o0)*s) : o0; });
}
/* Segments ending at a link, or at a link-slid fold, have solved lengths. */
const fixedLength = s => !!(s.endEl && (s.endEl.type === "link" || s.endEl._aimD));
/* What a beam end dragged to m can join: { ahead, armed, over }. ahead: the optic it heads for
   (headingFor); armed: pointer on it; over: another optic under the pointer. */
const pickRadius = n => (clamp(Math.max(10, n.el.ap*view.S), 11, 30) + 4)/view.S;
function joinCandidate(m, seg){
  const ahead = headingFor(seg), dist = p => Math.hypot(m.x - p.x, m.y - p.y);
  const armed = !!ahead && Math.min(dist(ahead.p), dist(ahead.at)) < pickRadius(ahead.n);
  let over = null, bd = Infinity;
  if (!armed) for (const n of tr.nodes){
    if (n.link || dist(n.p) >= pickRadius(n) || Math.hypot(n.p.x - seg.p0.x, n.p.y - seg.p0.y) < GAP) continue;
    if (dist(n.p) < bd){ over = n; bd = dist(n.p); }
  }
  return { ahead, armed, over };
}

svg.addEventListener("pointermove", e => {
  if (tool && (!drag || drag.mode === "place")){ placeMove(e); return; }
  if (!drag){ hoverInsertDot(e); return; }
  if (drag.mode === "pan"){ panTo(drag.ox + (e.clientX - drag.x), drag.oy + (e.clientY - drag.y)); return; }
  if (drag.mode === "box"){ const r = svg.getBoundingClientRect(); drag.x1 = e.clientX - r.left; drag.y1 = e.clientY - r.top; draw(); return; }
  const cue = snapCue;
  if (DRAG[drag.mode](drag, modelAt(e), e)) (ANN_DRAGS.has(drag.mode) ? commitAnn : commit)();
  else if (snapCue !== cue) draw();
});
/* Over the beam, the (+) follows the pointer; hidden elsewhere. */
function insertAt(i, e){                         // (+) position on segment i, or null if too short
  const s = tr.segs[i];
  if (!s || s.geo < 12) return null;
  let u = clamp(along(s, modelAt(e)), 3, s.geo - 3);
  if (ui.snap){ const g = snapAlong(s, u); if (g >= 3 && g <= s.geo - 3) u = g; }   // a new optic starts on the grid
  return { seg:i, u };
}
function hoverInsertDot(e){
  if (!insMenu.hidden) return;
  const segEl = e.target.closest("[data-seg]");
  const next = segEl ? insertAt(+segEl.dataset.seg, e) : null;
  if (!next && !inserting) return;
  inserting = next;
  showAddMark();
}
svg.addEventListener("pointerleave", () => {
  if (tool && !drag && snapCue){ snapCue = null; draw(); }
  if (drag || !insMenu.hidden || !inserting) return;
  inserting = null; showAddMark();
});
function endDrag(e){
  if (!drag) return;
  finishDrag(e);
  endGesture();
}
function finishDrag(e){
  if (drag.mode === "place"){ const d = drag; drag = null; placeUp(d, e); return; }
  if (drag.mode === "box"){ const d = drag; drag = null; if (e.type === "pointerup") boxSelect(d); draw(); return; }
  const edit = drag.editText;
  if (ANN_DRAGS.has(drag.mode)) snapCue = null;
  const click = drag.mode === "seg" && !drag.moved && e.type === "pointerup" ? insertAt(drag.i, e) : null;
  const joined = drag.mode === "seg" && drag.preview;
  if (joined && e.type !== "pointerup"){ joined.undo(); drag.preview = null; }   // cancelled: no join
  const missed = drag.mode === "seg" && !drag.preview && drag.over && e.type === "pointerup";
  if (missed || (joined && e.type === "pointerup")){   // dropped on an optic: joined, or the end goes back
    if (missed && drag.tail0 != null) drag.seg.holder[drag.seg.key] = drag.tail0;
    if (!missed) sel = joined.first.id;
    drag = null; svg.classList.remove("panning");
    commit();
    return;
  }
  const clear = drag.mode === "pan" && e.type === "pointerup" && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 3;
  drag = null; svg.classList.remove("panning");
  if (clear){ select(null); draw(); return; }    // empty click clears selection; drag pans
  if (click){                                    // beam click opens the element menu
    inserting = click;
    showAddMark();
    openInsMenu();
  }
  refreshPanel(true);
  draw();                                        // clear drag-only cues
  if (edit) focusAnnText();
}
svg.addEventListener("pointerup", endDrag);
svg.addEventListener("pointercancel", endDrag);

svg.addEventListener("wheel", e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect(), dy = e.deltaY*(e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);   // lines, pages → px
  zoomAbout(view.S*Math.exp(-dy*.0014), e.clientX - r.left, e.clientY - r.top);
}, { passive:false });

svg.addEventListener("contextmenu", e => {       // right-click: remove a prism vertex (keeps ≥ 3), coat a face's ⊕,
  if (tool){ e.preventDefault(); setTool(null); return; }   // or remove a cable point; with a tool armed, stop placing
  const c = e.target.closest("[data-via]");
  if (c){
    e.preventDefault();
    const [id, i] = splitRef(c.dataset.via), el = objects.elById.get(id);
    if (el && el.via[i]){ el.via.splice(i, 1); commit(); }
    return;
  }
  const v = e.target.closest("[data-vert]"), f = e.target.closest("[data-addvert]"); if (!v && !f) return;
  e.preventDefault();
  if (f){
    const [id, i] = splitRef(f.dataset.addvert), node = nodeOf(id);
    if (node){ toggleMirror(node.el, i); commit(); }
    return;
  }
  const [id, vi] = splitRef(v.dataset.vert), node = nodeOf(id);
  if (node && node.el.pts.length > 3){ removeVertex(node.el, vi); commit(); }
});

/* ---------- annotating ----------
   A tool (palette or R, A, T) places one annotation, then disarms. Ruler: drag or click both ends.
   Protractor: vertex, first arm, second arm. Label: click, then type. Esc or right-click stops.
   Snap targets: optics, sources, beam ends, other annotation points (SNAP_PX); then a beam axis
   (SNAP_LINE_PX); then the quarter-pitch lattice (Shift: holes). */
const SNAP_PX = 10, SNAP_LINE_PX = 6;
const annById = id => scene.annotations.find(a => a.id === id) || null;
const selectedAnnotation = () => { const o = selectedObject(); return o && o.kind === "ann" ? o.ann : null; };
function setTool(t){
  tool = t; placing = null; snapCue = null;
  if (t){ inserting = null; closeInsMenu(); }
  syncToolButtons();
  draw();
}
function syncToolButtons(){
  for (const b of document.querySelectorAll("[data-tool]")) b.setAttribute("aria-pressed", String(b.dataset.tool === tool));
  document.getElementById("annTools").classList.toggle("armed", !!tool);   // the pencil shows it when the tray is shut
  svg.classList.toggle("tool", !!tool);
}
/* Snap targets for annotation points (model mm): sources, optics (and fiber ends, roof ports, spindles), beam ends, other annotations. */
function annSnapPoints(skip){
  const out = [];
  for (const { seg } of tr.emitters) out.push(tr.segs[seg].p0);
  for (const n of tr.nodes){
    if (n.link) continue;
    out.push(n.p);
    if (n.fiber) out.push(n.fiber.ends.out.p);
    if (n.retro) out.push(n.retro.inP, n.retro.outP);
    if (n.scan) out.push(n.scan.C);
  }
  for (const s of tr.segs) if (s.kind === "tail" && s.geo > 0) out.push(s.p1);
  for (const a of scene.annotations) if (a !== skip) for (const q of a.pts) out.push(annXY(q));
  return out;
}
/* Snap for model point m, short of the lattice: { p, d } or null. lines: whether beam axes count. */
function annSnapFeature(m, skip, lines = true){
  let best = null, bd = SNAP_PX/view.S;
  for (const q of annSnapPoints(skip)){ const d = Math.hypot(q.x - m.x, q.y - m.y); if (d < bd){ bd = d; best = q; } }
  if (best || !lines) return best ? { p:best, d:bd } : null;
  bd = SNAP_LINE_PX/view.S;
  for (const s of tr.segs){
    if (s.geo < 1e-6) continue;
    const u = clamp(along(s, m), 0, s.geo), q = { x:s.p0.x + s.dir.x*u, y:s.p0.y + s.dir.y*u }, d = Math.hypot(q.x - m.x, q.y - m.y);
    if (d < bd){ bd = d; best = q; }
  }
  return best ? { p:best, d:bd } : null;
}
/* Where an annotation point lands for m: { p, at }. Snap off: ~2 px steps (Shift: 10×). */
function annPlace(m, coarse, skip = null){
  if (!ui.snap){
    const st = niceStep(2/view.S)*(coarse ? 10 : 1), r = v => +(Math.round(v/st)*st).toFixed(3) + 0;
    return { p:{ x:r(m.x), y:r(m.y) }, at:null };
  }
  const f = annSnapFeature(m, skip);
  return f ? { p:{ x:r3(f.p.x), y:r3(f.p.y) }, at:f.p } : { p:snapToVertGrid(m, coarse), at:null };
}
/* Placing: press starts it; click or drag sets each following point until the last. */
function placeDown(e){
  inserting = null; closeInsMenu();
  const s = annPlace(modelAt(e), e.shiftKey), q = [s.p.x, s.p.y];
  snapCue = s.at;
  if (!placing){
    placing = { type:tool, need:ANN_TYPES[tool].n, pts:[q], step:0, first:true };
    if (placing.need > 1){ placing.pts.push([...q]); placing.step = 1; }
  } else placing.pts[placing.step] = q;
  drag = { mode:"place", x:e.clientX, y:e.clientY };
}
function placeMove(e){
  const s = annPlace(modelAt(e), e.shiftKey);
  snapCue = s.at;
  if (placing) placing.pts[placing.step] = [s.p.x, s.p.y];
  draw();
}
function placeUp(d, e){
  if (!placing) return;
  if (e.type !== "pointerup"){ placing = null; snapCue = null; draw(); return; }
  const moved = Math.hypot(e.clientX - d.x, e.clientY - d.y) > 5, first = placing.first;
  placing.first = false;
  if (first && !moved && placing.need > 1){ draw(); return; }   // a click: the next point follows the pointer
  if (placing.step >= placing.need - 1){ finishPlacing(); return; }
  placing.step++; placing.pts.push([...placing.pts[placing.step - 1]]);
  draw();
}
function finishPlacing(){
  const p = placing, pts = p.pts.map(([x, y]) => [r3(x), r3(y)]);
  placing = null; snapCue = null;
  const apart = (i, j) => Math.hypot(pts[i][0] - pts[j][0], pts[i][1] - pts[j][1]) >= .5;
  if ((p.type === "ruler" && !apart(0, 1)) || (p.type === "protractor" && !(apart(0, 1) && apart(0, 2)))){
    draw(); flashStatus(p.type === "ruler" ? "A ruler needs its two ends apart" : "A protractor's arms need some length", 2500);
    return;
  }
  const n = 1 + scene.annotations.reduce((m, a) => Math.max(m, +a.id.slice(1) || 0), 0);
  const a = { id:"a" + n, type:p.type, pts, ...ANN_TYPES[p.type].defaults() };
  scene.annotations.push(a);
  tool = null; syncToolButtons();
  sel = a.id;
  commitAnn();
  if (a.type === "label") focusAnnText();
}
function removeAnnotation(a){
  const i = scene.annotations.indexOf(a);
  if (i >= 0) scene.annotations.splice(i, 1);
  sel = null;
}
/* Focus the selected label's text field, text selected. */
function focusAnnText(){                         // shows the panel if hidden
  if (!panelShown()) showPanel(true);
  const t = props.querySelector("textarea[data-ann-text]"); if (t){ t.focus(); t.select(); }
}

/* ---------- inserting elements ---------- */
/* Size a new aperture to the beam (~1.9× half-width). Lenses, windows, retroreflectors: Ø25 mm (CLEAR_AP) unless the beam needs more. */
function fitApertureTo(el, halfWidth){
  const stock = el.type === "lens" || el.type === "window" || el.type === "retro" ? CLEAR_AP : 0;
  if (el.type === "aperture"){ el.ap = Math.max(3, Math.round(halfWidth*1.15)); el.outR = Math.round(el.ap*2); el.centR = 0; }
  else if (el.type === "retro"){                 // beam in one half, returning in the other
    el.ap = Math.max(stock, Math.round(halfWidth*2.6)); el.off = el.ap/2;
  }
  else el.ap = Math.max(stock || 4, Math.round(halfWidth*1.9));
  if (el.type === "shutter") el.outR = Math.max(el.outR, Math.round(el.ap*1.8));
}
/* Drop an element u mm along segment segIdx. */
