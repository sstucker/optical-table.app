<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bench — optical layout sketcher</title>
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --line:#C7CFD6; --hole:#E6EAED;
  --ink:#242A31; --ink2:#5A6570; --ink3:#8E99A4; --accent:#2E5D7D;
  --field:#F3F5F7; --shade:#00000008; --warn:#B5452B;
  --font:Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]):not([data-theme="gray"]){
  --bg:#14171A; --panel:#1B1F24; --line:#2D343B; --hole:#242A30;
  --ink:#DBE1E7; --ink2:#99A4AF; --ink3:#69737D; --accent:#79B0D2;
  --field:#22272C; --shade:#FFFFFF08; --warn:#E8836A; } }
:root[data-theme="dark"]{
  --bg:#14171A; --panel:#1B1F24; --line:#2D343B; --hole:#242A30;
  --ink:#DBE1E7; --ink2:#99A4AF; --ink3:#69737D; --accent:#79B0D2;
  --field:#22272C; --shade:#FFFFFF08; --warn:#E8836A; }
/* Gray: a light aluminum table (grain from brushedTexture), dark holes, lighter panels. --bg is the grain's mean. */
:root[data-theme="gray"]{
  --bg:#CBCFD2; --panel:#ECEEF0; --line:#B4BBC1; --hole:#25292D;
  --ink:#1B2025; --ink2:#3A424A; --ink3:#5E666E; --accent:#2A5677;
  --field:#F3F4F5; --shade:#0000000F; --warn:#A33F26; }
:root[data-theme="gray"] #svg{background-image:var(--brushed, none);background-size:512px 256px}

/* ---------- layout ---------- */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--font);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
sub{font-size:75%;line-height:0;position:relative;vertical-align:baseline;bottom:-.25em}   /* no row-height bump */
main{flex:1 1 auto;display:flex;min-height:0}
.stage{flex:1 1 auto;position:relative;min-width:0;min-height:0}
#svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}   /* a drag never selects the figure's text */
#svg.panning{cursor:grabbing}
#svg.tool,#svg.tool *{cursor:crosshair !important}   /* an annotation tool is armed: every press places */

/* ---------- bottom bar ---------- */
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:6px;
  padding:7px 12px;border-top:1px solid var(--line);background:var(--panel);
  font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.bar .sp{flex:1}
#status{font-size:11.5px;color:var(--ink3)}
.chip{font:400 12px/1 var(--font);color:var(--ink3);background:none;
  border:1px solid var(--line);border-radius:3px;padding:5px 8px;cursor:pointer}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink3);background:var(--shade)}
.seg{display:inline-flex;margin-right:6px}      /* a choice of one: chips joined edge to edge */
.seg .chip{border-radius:0}
.seg .chip:first-child{border-radius:3px 0 0 3px}
.seg .chip:last-child{border-radius:0 3px 3px 0;margin-left:-1px}
.seg .chip[aria-pressed="true"]{position:relative}

/* ---------- file toolbar (top left): New, Open, Save, Export SVG ---------- */
.tools{position:absolute;top:12px;left:12px;z-index:6;display:flex;align-items:center;gap:2px;padding:2px;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 4px #0000001f}
.file-set button{height:30px;padding:0 10px}
.tools .tray-btn{width:30px;height:30px;padding:0;display:grid;place-items:center;color:var(--ink2);
  background:none;border-color:transparent;border-radius:4px}
.tools .tray-btn:hover{color:var(--ink);border-color:var(--line)}
.tools .tray-btn[aria-expanded="true"]{color:var(--ink)}
.file-set{display:flex;gap:2px;margin-left:2px;padding-left:4px;border-left:1px solid var(--line)}
.file-set[hidden]{display:none}

/* ---------- annotation tools (pencil, under the file toolbar) ---------- */
.annot{position:absolute;top:58px;left:12px;z-index:5;display:flex;align-items:center;gap:2px;padding:2px;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 4px #0000001f}
.annot button{width:30px;height:30px;padding:0;display:grid;place-items:center;color:var(--ink2);
  background:none;border-color:transparent;border-radius:4px}
.annot button:hover{color:var(--ink);border-color:var(--line)}
.annot button[aria-pressed="true"]{color:var(--panel);background:var(--accent);border-color:var(--accent)}
#annPencil[aria-expanded="true"]{color:var(--ink)}
.annot.armed #annPencil[aria-expanded="false"]{color:var(--panel);background:var(--accent);border-color:var(--accent)}   /* armed from the keys, shut */
.ann-set{display:flex;gap:2px;margin-left:2px;padding-left:4px;border-left:1px solid var(--line)}
.ann-set[hidden]{display:none}

/* ---------- view settings (gear, top right) ---------- */
.viewset{position:absolute;top:12px;right:12px;z-index:5}
#gear{width:36px;height:36px;padding:0;display:grid;place-items:center;color:var(--ink2);
  background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 4px #0000001f}
#gear:hover,#gear[aria-expanded="true"]{color:var(--ink);border-color:var(--ink3)}
#viewMenu{position:absolute;top:calc(100% + 6px);right:0;width:236px;max-width:calc(100vw - 24px);padding:2px 12px;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 16px #00000022}
.vm-tog{display:flex;align-items:center;justify-content:space-between;width:100%;margin:0;padding:9px 0;
  background:none;border:none;border-top:1px solid var(--line);border-radius:0;font-size:12.5px;color:var(--ink)}
.vm-tog:first-child{border-top:none}
.vm-tog:hover .knob{box-shadow:0 0 0 1px var(--ink3)}
.knob{position:relative;flex:0 0 auto;width:28px;height:16px;border-radius:8px;background:var(--line);transition:background .15s}
.knob::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px #0000002e;transition:transform .15s}
.vm-tog[aria-pressed="true"] .knob{background:var(--accent)}
.vm-tog[aria-pressed="true"] .knob::after{transform:translateX(12px)}
@media (prefers-reduced-motion: reduce){ .knob,.knob::after{transition:none} }
.vm-sec{border-top:1px solid var(--line);padding:9px 0 10px}
.vm-hd{font-size:12.5px;color:var(--ink);margin:0 0 7px}
.vm-seg{display:flex}
.vm-seg button{flex:1 1 0;min-width:0;padding:6px 0;font-size:12px;color:var(--ink2);border-radius:0;margin-left:-1px}
.vm-seg button:first-child{border-radius:3px 0 0 3px;margin-left:0}
.vm-seg button:last-child{border-radius:0 3px 3px 0}
.vm-seg button[aria-checked="true"]{position:relative;color:var(--panel);background:var(--accent);border-color:var(--accent)}
.vm-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink)}
.vm-row2{margin-top:6px}
.vm-step{display:inline-flex;align-items:center;gap:3px}
.vm-step button{width:24px;height:24px;padding:0;font-size:14px;line-height:1}
.vm-step button:disabled{opacity:.4;cursor:default}
.vm-step output{min-width:42px;text-align:center;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.vm-fit{display:block;width:100%;margin-top:8px;padding:5px 8px;font-size:12px;color:var(--ink2)}


/* ---------- save window ---------- */
#saveDlg,#newDlg,#keysDlg{width:min(430px, calc(100vw - 32px));padding:0;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);color:var(--ink);box-shadow:0 10px 36px #00000038;font:400 13px/1.45 var(--font)}
#newDlg{width:min(340px, calc(100vw - 32px))}
#keysDlg{width:min(520px, calc(100vw - 32px))}
#saveDlg::backdrop,#newDlg::backdrop,#keysDlg::backdrop{background:#0000002e}
#saveDlg .dlg,#newDlg .dlg,#keysDlg .dlg{padding:16px 18px 14px}
#saveDlg h2,#newDlg h2,#keysDlg h2{margin:0 0 13px;font-size:14px;font-weight:600}
#newDlg h2{margin-bottom:6px}
#newDlg p{margin:0;color:var(--ink2)}
#saveDlg .f{display:block;margin:0 0 12px}
#saveDlg .f>span:first-child{display:block;font-size:12px;color:var(--ink2);margin:0 0 4px}
#saveDlg input[type=text],#saveDlg textarea{display:block;width:100%;margin:0;padding:6px 8px;font:400 13px/1.4 var(--font);
  background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:3px}
#saveDlg textarea{resize:vertical;min-height:76px}
#saveDlg input[type=text]:focus,#saveDlg textarea:focus{border-color:var(--accent);outline:none}
#saveDlg .fn{display:flex;align-items:center;gap:5px;color:var(--ink3)}
#saveDlg .count{float:right;font-size:11px;color:var(--ink3)}
#saveDlg .acts,#newDlg .acts,#keysDlg .acts{display:flex;justify-content:flex-end;gap:6px;margin-top:16px}
#saveDlg .acts button,#newDlg .acts button,#keysDlg .acts button{padding:7px 12px}

/* ---------- controls splash ---------- */
#keysDlg tr:first-child th{padding-top:0}
#keysDlg .keys{max-height:min(68vh, 560px);overflow-y:auto;margin:0 -18px;padding:0 18px}
#keysDlg table{border-collapse:collapse;width:100%}
#keysDlg th{text-align:left;font-size:11.5px;font-weight:600;color:var(--ink3);padding:13px 0 4px;border-bottom:1px solid var(--line)}
#keysDlg td{padding:6px 0;vertical-align:top;border-bottom:1px solid var(--line);color:var(--ink)}
#keysDlg tr:last-child td{border-bottom:none}
#keysDlg td:first-child{width:1%;white-space:nowrap;padding-right:16px}
kbd{display:inline-block;min-width:19px;padding:3px 5px;font:500 11px/1 var(--font);text-align:center;color:var(--ink);
  background:var(--field);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px}
kbd + kbd{margin-left:3px}
#keysDlg .or{color:var(--ink3);font-size:11px;margin:0 4px 0 0}
#keysDlg .alt{margin-top:5px}
#keysDlg .about{display:flex;justify-content:space-between;gap:12px;margin:0 0 4px;font-size:12px;color:var(--ink3)}
#keysDlg .about a{color:var(--accent)}
#showKeys .info{display:grid;place-items:center;color:var(--ink2)}

/* a system file dragged over the page */
.stage.drop::after{content:"Drop to open this system";position:absolute;inset:10px;z-index:20;display:flex;
  align-items:center;justify-content:center;border:2px dashed var(--accent);border-radius:8px;color:var(--accent);
  font-size:14px;background:color-mix(in srgb, var(--bg) 75%, transparent);pointer-events:none}

/* ---------- object browser ---------- */
.panel{flex:0 0 272px;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.browser{flex:1 1 auto;overflow-y:auto;padding:6px 0}
.obj{position:relative;display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;
  border-left:3px solid transparent;font-size:13px}
.obj:hover{background:var(--shade)}
.obj.sel{border-left-color:var(--accent);background:var(--shade)}
.obj .tag{flex:0 0 auto;font:500 11px/1 var(--font);color:var(--ink);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border:1px solid var(--line);border-radius:3px;padding:3px 4px;min-width:26px;text-align:center}
.obj .nm{flex:1 1 auto;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obj .d{font-size:11px;color:var(--ink3);white-space:nowrap}
.obj.end .tag{border-style:dashed;color:var(--ink3)}
.obj.source:not(:first-child){margin-top:7px;border-top:1px solid var(--line)}   /* each beam after the first */
.ann-hd{margin-top:7px;padding:9px 14px 3px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3)}   /* annotations, after the beams */
.obj .tag.lk{border-style:dotted;color:var(--ink2)}                                /* a link: an optic met again */
.fold{position:absolute;top:2px;bottom:2px;width:13px;display:flex;align-items:center;justify-content:center;
  color:var(--ink3);cursor:pointer;font-size:10px;border-radius:3px}                /* collapses a beam or sub-beam */
.fold:hover{color:var(--ink);background:var(--shade)}
.fold::before{content:"▾"}
.fold.closed::before{content:"▸"}
.bdg.warn{color:var(--warn);border-color:var(--warn)}
.bdg[data-shut]{cursor:pointer}                                                    /* a shutter's state: click to change it */
.bdg[data-shut]:hover{border-color:var(--ink3)}
.bdg.warn[data-shut]:hover{border-color:var(--warn);background:color-mix(in srgb, var(--warn) 10%, transparent)}
.rail{position:absolute;top:0;bottom:0;pointer-events:none}
.rail.guide{width:2px;background:var(--line);opacity:.5}
.rail.beam{width:3px;border-radius:2px;box-shadow:0 0 0 1px var(--panel)}
.obj.bh{cursor:pointer;font-size:12px;padding-top:3px;padding-bottom:3px}
.obj.bh .nm{color:var(--ink2);font-size:13px}
.tag.bh{border:none;min-width:auto;color:var(--ink3);font-size:14px;padding:0}
.bdg{font:500 10px/1 var(--font);color:var(--ink2);background:var(--shade);
  border:1px solid var(--line);border-radius:3px;padding:2px 4px;flex:0 0 auto}
.bdg.dic{color:var(--ink);border-color:var(--ink3)}
.ro{font:500 12px/1.3 var(--font);color:var(--ink3);white-space:pre;text-align:right}   /* pre: a line each, where a readout has several */
.ords{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 9px}
.ords label{font:500 11.5px/1 var(--font);color:var(--ink3);background:var(--field);
  border:1px solid var(--line);border-radius:3px;padding:5px 7px;cursor:pointer;user-select:none}
.ords label.on{color:var(--ink);border-color:var(--ink3);background:var(--shade)}
.ords input{display:none}
.addrow{display:flex;gap:6px;padding:8px 14px;border-top:1px solid var(--line)}
.addrow button{flex:1 1 auto}

/* ---------- properties ---------- */
.props{flex:0 0 auto;border-top:1px solid var(--line);padding:12px 14px;
  max-height:52%;overflow-y:auto}
.props h2{margin:0 0 9px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.row label{flex:1 1 auto;font-size:13px;color:var(--ink2)}
input[type=number]{font:500 13px/1.3 var(--font);width:84px;padding:4px 6px;
  text-align:right;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:3px}
input[type=number]:focus{border-color:var(--accent)}
input[type=text]{font:500 13px/1.3 var(--font);width:112px;padding:4px 6px;margin-right:32px;
  background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:3px}
input[type=text]:focus{border-color:var(--accent);outline:none}
input[type=text]::placeholder{color:var(--ink3)}
.unit{width:24px;font-size:11.5px;color:var(--ink3)}
button{font:400 12.5px/1 var(--font);color:var(--ink);background:var(--field);
  border:1px solid var(--line);border-radius:3px;padding:6px 8px;cursor:pointer}
button:hover{border-color:var(--ink3)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.radios{display:flex;gap:11px;margin:0 0 8px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:4px;cursor:pointer}
.radios input{accent-color:var(--accent);margin:0}
.actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.multi-hint{margin:10px 0 0;font-size:11.5px;line-height:1.45;color:var(--ink2)}
.props .struct{margin:0 -14px 11px;padding:1px 14px 2px;background:var(--shade);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.props .struct .row{margin:6px 0 5px}
.props .struct .radios{margin-bottom:7px}
.radios .mini{margin-left:auto;padding:3px 7px;font-size:11.5px}
.props .row .mini{padding:3px 7px;font-size:11.5px}
.disp{margin:2px 0 4px;max-width:340px}
.props .field-sel{flex:0 0 128px;margin-right:32px}   /* a menu in a field row, aligned with the number boxes */
.disp svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;font-family:var(--font)}

/* ---------- insert menu ---------- */
#insMenu{position:fixed;z-index:60;min-width:132px;background:var(--panel);
  border:1px solid var(--line);border-radius:6px;padding:4px;
  box-shadow:0 4px 16px #00000022;font-size:13px}
#insMenu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:none;border-radius:4px;padding:7px 9px;color:var(--ink);cursor:pointer}
#insMenu button:hover{background:var(--shade)}
#insMenu .hd{padding:5px 9px 3px;font-size:11.5px;color:var(--ink3)}
/* group rows open a submenu to the side (left if no room) */
#insMenu .grp-item{position:relative}
#insMenu .grp-parent{display:flex;align-items:center;gap:9px;width:100%;
  border-radius:4px;padding:7px 9px;color:var(--ink);cursor:default;font-size:13px}
#insMenu .grp-parent:hover{background:var(--shade)}
#insMenu .grp-parent .chev{margin-left:auto;color:var(--ink3);font-size:10px}
#insMenu .grp-parent .chev::before{content:"\25B8"}
#insMenu.flip-left .grp-parent .chev::before{content:"\25C2"}
#insMenu .submenu button{white-space:nowrap}
#insMenu .submenu{display:none;position:absolute;left:100%;top:-5px;min-width:150px;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px;
  box-shadow:0 4px 16px #00000022;z-index:61}
#insMenu.flip-left .submenu{left:auto;right:100%}
#insMenu .grp-item:hover>.submenu,#insMenu .grp-item.open>.submenu{display:block}
#insMenu .k{font:500 11px/1 var(--font);color:var(--ink3);
  border:1px solid var(--line);border-radius:3px;padding:3px 4px;min-width:24px;text-align:center}
.ins-gap{height:11px;margin:-3px 0;display:flex;align-items:center;cursor:pointer;position:relative}
.ins-gap .ln{flex:1;height:1px;background:var(--accent);opacity:0;transition:opacity .1s}
.ins-gap .pl{position:absolute;left:50%;transform:translateX(-50%);width:16px;height:16px;
  border-radius:50%;opacity:0;transition:opacity .1s;box-shadow:0 1px 3px #0004}
.ins-gap .pl svg{display:block}
.ins-gap:hover .ln,.ins-gap:hover .pl{opacity:1}
.props textarea{display:block;width:100%;margin:0 0 9px;padding:5px 7px;font:500 13px/1.4 var(--font);resize:vertical;min-height:52px;
  background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:3px}
.props textarea:focus{border-color:var(--accent);outline:none}
.props .chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);cursor:pointer;margin:2px 0 8px}
.props .chk input{accent-color:var(--accent);margin:0}
.props .chk.sect{margin-top:13px}
.props .swatches{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 10px}
.props .swatches .sw{width:22px;height:22px;padding:0;border-radius:50%;border:2px solid var(--panel);
  box-shadow:0 0 0 1px var(--line);cursor:pointer}
.props .swatches .sw.on{box-shadow:0 0 0 2px var(--ink)}
.props .swatches .sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}


/* ---------- wavelength editor ---------- */
.wl-row{display:flex;align-items:center;gap:6px;margin:0 0 6px}
.wl-sw{width:15px;height:15px;border-radius:4px;box-shadow:0 0 0 1px #0003;flex:0 0 auto}
.wl-num{width:52px}
.wl-x{border:none;background:none;color:var(--ink3);cursor:pointer;font-size:17px;line-height:1;
  padding:0 2px;flex:0 0 auto;border-radius:3px}
.wl-x:hover{color:var(--ink)}
.wl-addbtn{width:100%;margin:2px 0 6px}
.wl-select{font:500 12.5px/1.3 var(--font);flex:1 1 auto;min-width:0;padding:5px 6px;
  background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:3px;cursor:pointer}
.wl-select:focus{border-color:var(--accent)}
.wl-slider{-webkit-appearance:none;appearance:none;flex:1 1 auto;min-width:0;height:14px;border-radius:7px;
  border:1px solid var(--line);margin:0;cursor:pointer;background-repeat:no-repeat;background-size:100% 100%}
.wl-slider::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:22px;border-radius:3px;
  background:var(--panel);border:2px solid var(--ink);cursor:grab;box-shadow:0 0 0 1px #0004}
.wl-slider::-moz-range-thumb{width:6px;height:20px;border-radius:3px;background:var(--panel);
  border:2px solid var(--ink);cursor:grab}

/* ---------- panel tab: hides and shows the panel ---------- */
#panelTab{position:absolute;right:0;top:50%;z-index:5;width:16px;height:56px;margin-top:-28px;padding:0;
  display:grid;place-items:center;color:var(--ink3);background:var(--panel);
  border:1px solid var(--line);border-right:none;border-radius:6px 0 0 6px}
#panelTab:hover{color:var(--ink);background:var(--field)}
#panelTab svg{transition:transform .15s}
main.nopanel .panel{display:none}
main.nopanel #panelTab svg{transform:rotate(180deg)}
@media (prefers-reduced-motion: reduce){ #panelTab svg{transition:none} }

/* must stay last: overrides .panel and main above */
@media (max-width:820px){ main{flex-direction:column}
  .panel{flex:0 0 auto;max-height:48%;border-left:none;border-top:1px solid var(--line)}
  #panelTab{top:auto;right:auto;left:50%;bottom:var(--bar-h, 41px);margin:0 0 0 -28px;width:56px;height:16px;   /* on the bar, the panel below it */
    border:1px solid var(--line);border-bottom:none;border-radius:6px 6px 0 0}
  #panelTab svg{transform:rotate(90deg)}
  main.nopanel #panelTab svg{transform:rotate(-90deg)} }
</style>
</head>

<script>
"use strict";
/* =====================================================================
   Bench — optical layout sketcher

   scene ──trace()──▶ tr ──buildFigure()──▶ SVG

   · scene        Editable model (§2): sources with element trees, plus annotations.
                  A *link* sends a beam through an optic another beam placed:
                  optics are shared nodes, beams are paths through them.
   · trace()      Pure function of the scene (§4): beam segments, nodes, ray pieces.
   · buildFigure  Pure function of (trace, scene, view, palette) (§7); draws both
                  screen and export. Zoom behaviour: §8.
   · files        Saved as JSON; opens from JSON or an exported SVG (§12).

   The UI caches one trace, `tr` (§8). Scene edits call commit() (retrace, redraw,
   refresh panel); view-only changes call draw().

   Coordinates: model mm, y up; the screen flips y (view.pt / view.inv). Elements
   are placed relative to their source. Holes (M6, HOLE_D) on a GRID mm pitch.
   In a segment's frame: h = transverse offset (mm), m = slope dh/dz.
   ===================================================================== */


/* =====================================================================
   1. UTILITIES
   ===================================================================== */
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const mean  = a => a.reduce((s, x) => s + x, 0) / a.length;
const byNum = (a, b) => a - b;
const sortedNums = a => [...a].sort(byNum);

// Model vectors are {x, y}; screen points are [x, y].
const rot  = (v, a) => ({ x:v.x*Math.cos(a) - v.y*Math.sin(a), y:v.x*Math.sin(a) + v.y*Math.cos(a) });
const unit = v => { const L = Math.hypot(v.x, v.y) || 1; return { x:v.x/L, y:v.y/L }; };
const leftNormal  = d => ({ x:-d.y, y:d.x });
const signedAngle = (a, b) => Math.atan2(a.x*b.y - a.y*b.x, a.x*b.x + a.y*b.y);   // rad, from a to b
const signedDeg   = (a, b) => signedAngle(a, b)*180/Math.PI;
const slopeRel    = (axis, d) => Math.tan(signedAngle(axis, d));   // slope of d measured from axis
const slopeDir    = m => { const a = Math.atan(m); return { x:Math.cos(a), y:Math.sin(a) }; };
const project     = (p, o, d) => (p.x - o.x)*d.x + (p.y - o.y)*d.y;   // (p − o) · d
/* Model point for local coords v in a frame at o with x axis d. */
function localToModel(o, d, v){
  const n = leftNormal(d);
  return { x:o.x + v.x*d.x + v.y*n.x, y:o.y + v.x*d.y + v.y*n.y };
}

let fxQ = 100;                                   // 0.01 px keeps markup compact; figures magnified on screen (§8) are written finer
const fx  = n => Math.round(n*fxQ)/fxQ;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
/* Text safe to show anywhere: markup characters dropped, white space collapsed. */
const safeText = (v, max) => String(v).replace(/[<>&"'`]/g, "").replace(/\s+/g, " ").trim().slice(0, max);
const pathD = pts => "M" + pts.map(q => fx(q[0]) + "," + fx(q[1])).join("L");
const fmtOrd = k => k > 0 ? "+" + k : String(k);
function fmtLen(mm){
  if (Math.abs(mm) < 0.001) return (mm*1e6).toFixed(1) + " nm";
  if (Math.abs(mm) < 1)     return (mm*1000).toFixed(1) + " µm";
  if (Math.abs(mm) >= 1000) return (mm/1000).toFixed(3) + " m";
  return (Math.round(mm*100)/100) + " mm";
}
function fmtWL(list){
  const a = sortedNums(list && list.length ? list : [633]);
  return (a.length <= 3 ? a.join(" · ") : a.length + " lines") + " nm";
}


/* =====================================================================
   2. SCENE MODEL
   Sources plus figure settings. Each source emits one beam and owns `chain`,
   an ordered element list. Every element has id, type, d (mm from the previous
   element) and ap (clear half-aperture, mm); optional name replaces its tag (L1, M2…).
   Splitting elements own a nested list for the other arm:
     splitter / dichroic / pbs   `branch`, ending at `branchTail` mm
     grating                     `arms[order] = { id, order, list, tail, sub }`
   Each branch or arm is a sub-beam lettered `sub` (1A, 1B…).
   A `link` visits an optic placed elsewhere: ref = its id; along = which way it
   leaves relative to the owner's pass: "" reaches it, "fwd" on, "back" back along
   the way in, "branch" the owner's other output, "free" the unused port. Plus
   follow/branch/arms for its outputs. Distance and deflection are derived (§4).
   tail0: the joined beam's former end length, for disconnecting (§10).
   A `fiber` runs from input end A (d mm on) to output end B at (ox, oy) model mm,
   leaving at orot°; B is absolute, not relative to the source. Links at a fiber:
   "back" enters B and leaves A, "fwd" enters A and leaves B; loose:true marks
   one only aimed at the end, not on the owner's path.
   ===================================================================== */
const WLMAX = 2000;            // spectrum picker max (nm)
const DEFAULT_TAIL = 150;      // new beam end length (mm)
const GRID = 25;               // hole pitch (mm): grid and snap step
const HOLE_D = 6;              // hole diameter (mm): M6
const CLEAR_AP = 12.5;         // default clear half-aperture (mm): Ø25
const MAX_BRANCH_DEPTH = 4;    // nested arms deeper than this aren't traced

/* Glass fields for prisms, windows, cubes: a GLASSES name, or "" for custom n = n_d, vabbe = V_d, dexp = q in n(λ) = A + B·λ^−q (§3). */
const DEFAULT_GLASS = () => { const g = GLASSES["N-BK7"]; return { glass:"N-BK7", n:g.n, vabbe:g.vabbe, dexp:g.dexp }; };
const hasGlass = el => el.type === "polygon" || el.type === "window" || el.type === "axicon" || (BRANCHING.has(el.type) && el.disp === "cube");

/* Per-type name, tag prefix and fields with defaults. */
const ELEMENTS = {
  // f (mm); shape plano | double | doublet | objective | tube (drawing only); flip
  lens:     { name:"Lens",     tag:"L",  defaults:() => ({ ap:CLEAR_AP, f:100, shape:"double", showF:false }) },   // showF: mark the focal points
  // angle: deflection (°). mount plain | galvo | mems (drawing only)
  mirror:   { name:"Mirror",   tag:"M",  defaults:() => ({ angle:90, mount:"plain" }) },
  // spherical mirror: f (mm, > 0 concave), focusing in-plane at f·cos(incidence). Default 15°
  curved:   { name:"Curved mirror", tag:"CM", defaults:() => ({ angle:150, f:100 }) },
  // polygon scanner (§3): `facets` facets, each 2·ap wide. angle: axis fold (°);
  // rot: turn from there (°), swinging the beam twice that
  scanner:  { name:"Polygon scanner", tag:"PS", defaults:() => ({ angle:90, facets:6, rot:0 }) },
  // hollow roof mirror, an in-plane retroreflector (§3), 2·ap across. off: beam offset
  // left of the apex (mm), returning 2·off right; tilt: roof rotation (°)
  retro:    { name:"Retroreflector", tag:"RR", defaults:() => ({ ap:CLEAR_AP, off:CLEAR_AP/2, tilt:0 }) },
  // facing mirror pair (§3): chirped mirrors or a multipass cavity. angle: first deflection (°);
  // len: mirror length (mm); gap: separation at first bounce (mm); wedge: second mirror's
  // angle to the first (°), positive closing ahead. Bounces are traced
  pair:     { name:"Mirror pair", tag:"MP", defaults:() => ({ angle:130, len:50, gap:12.5, wedge:0 }) },
  // Two outputs. follow transmitted | reflected: the one the chain continues on; the
  // other is the branch, a lettered sub-beam (1A, 1B…).
  // R: % reflected; disp plate | cube (a cube has glass fields)
  splitter: { name:"Splitter", tag:"BS", defaults:() => ({ angle:90, R:50, follow:"transmitted", branch:[], sub:"", disp:"plate", ...DEFAULT_GLASS(), branchTail:DEFAULT_TAIL }) },
  // cut (nm); pass "longpass" (reflects short) | "shortpass"
  dichroic: { name:"Dichroic", tag:"DC", defaults:() => ({ angle:90, cut:1000, pass:"longpass", follow:"reflected", branch:[], sub:"", disp:"plate", ...DEFAULT_GLASS(), branchTail:DEFAULT_TAIL }) },
  // ideal PBS: transmits p, reflects s. Splitter layout fields, cube by default
  pbs:      { name:"Polarizing splitter", tag:"PBS", defaults:() => ({ angle:90, follow:"transmitted", branch:[], sub:"", disp:"cube", ...DEFAULT_GLASS(), branchTail:DEFAULT_TAIL }) },
  // ideal bandpass cwl ± bw/2 (nm). Default 525/50 (GFP/FITC)
  filter:   { name:"Filter",   tag:"F",  defaults:() => ({ cwl:525, bw:50 }) },
  // ideal achromatic wave plates; axis = fast axis (°). Defaults: p to circular (quarter) or 45° (half)
  qwp:      { name:"Quarter-wave plate", tag:"QWP", defaults:() => ({ axis:45 }) },
  hwp:      { name:"Half-wave plate",    tag:"HWP", defaults:() => ({ axis:22.5 }) },
  // Faraday rotator (§3), thin. rotation (°, p toward s) on the placing pass, any wavelength;
  // nonreciprocal, so returning light turns further. len, outR (mm) drawing only; ap clear aperture
  faraday:  { name:"Faraday rotator", tag:"FR", defaults:() => ({ rotation:45, len:20, outR:12.5 }) },
  // Pockels cell (§3), thin; len, outR drawing only. effect polarization: retarder of ret waves
  // about axis (°); deflection: turns the beam dev (°), later optics staying put
  eom:      { name:"Electro-optic modulator", tag:"EOM", defaults:() => ({ effect:"polarization", ret:0.5, axis:45, dev:1, len:40, outR:12.5 }) },
  // gain medium, drawing only: the beam passes untouched. look rod | brewster | slab (GAIN_LOOKS);
  // len (mm); ap half-height; flip mirrors Brewster faces
  gain:     { name:"Laser crystal", tag:"LC", defaults:() => ({ look:"rod", len:40, flip:false }) },
  // nonlinear crystals, thin (§3): SHG doubles pm nm; THG mixes it with its second harmonic
  // to make pm/3. conv: % converted; hpol crossed | parallel; len (mm, drawing only)
  shg:      { name:"SHG crystal", tag:"SHG", defaults:() => ({ pm:1064, conv:50, hpol:"crossed", len:10 }) },
  thg:      { name:"THG crystal", tag:"THG", defaults:() => ({ pm:1064, conv:50, hpol:"crossed", len:10 }) },
  // Beam ends: detector (ap active area, outR housing half-size) or block. Both absorb all
  detector: { name:"Detector",   tag:"D",  defaults:() => ({ outR:12.5 }) },
  block:    { name:"Beam block", tag:"BB", defaults:() => ({}) },
  // plate at normal incidence: t thickness (mm), plus glass fields
  window:   { name:"Window",   tag:"W",  defaults:() => ({ ap:CLEAR_AP, t:6, ...DEFAULT_GLASS() }) },
  // ap opening radius; outR outer radius; centR central block radius (0 = none)
  aperture: { name:"Aperture", tag:"A",  defaults:() => ({ ap:8, outR:16, centR:0 }) },
  // shutter: blade across opening ap, housing outR. Closed it stops all light; later optics stay
  shutter:  { name:"Shutter",  tag:"SH", defaults:() => ({ open:true, outR:12.5 }) },
  // thin diffuser (§4): random seeded ray deflection within ±scatter (°)
  diffuser: { name:"Diffuser", tag:"DF", defaults:() => ({ scatter:10, seed:1 }) },
  // geom transmissive | reflective; pitch (µm); tilt: incidence (°); orders enabled
  grating:  { name:"Grating",  tag:"G",  defaults:() => ({ geom:"transmissive", pitch:2, tilt:0, orders:[0, 1] }) },
  // convex glass body. pts: vertices (mm), local frame, x along the beam, origin at anchor;
  // rot (°); glass fields. form: PRISM_FORMS outline at size (mm), "" once hand-edited.
  // mirrors: coated faces, face i from pts[i] to pts[i + 1]
  polygon:  { name:"Polygon",  tag:"P",  menu:"Prism",
              defaults:() => ({ form:"dove", size:24, pts:[[-40,-12],[40,-12],[16,12],[-16,12]], mirrors:[], ...DEFAULT_GLASS(), rot:0, ap:400 }) },
  // axicon: cone of base angle alpha (°), thin; flip faces the cone toward the light. Plus glass fields
  axicon:   { name:"Axicon",   tag:"AX", defaults:() => ({ alpha:5, flip:false, ...DEFAULT_GLASS() }) },
  // fiber (§3): end A on the beam, end B at (ox, oy) leaving at orot°, absolute (§2).
  // kind SM | PM | MM; NA; core: MM core Ø (µm); key: PM slow axis (°, p toward s).
  // inEnd, outEnd: collimator (lens fIn / fOut mm before the face) or tip.
  // via: cable points (model mm), drawing only
  fiber:    { name:"Fiber",    tag:"FB",
              defaults:() => ({ kind:"SM", NA:0.1, core:105, key:0, inEnd:"collimator", outEnd:"collimator", fIn:11, fOut:11, ap:2.75,
                                ox:0, oy:0, orot:0, via:[] }) },
  // meets an optic placed elsewhere (§2). Made by joining, not inserting
  link:     { name:"Link",     tag:"→", hidden:true,
              defaults:() => ({ ref:"", along:"", follow:"transmitted", branch:[], sub:"", branchTail:DEFAULT_TAIL }) },
};
const STRAIGHT = new Set(["lens", "axicon", "filter", "qwp", "hwp", "faraday", "eom", "gain", "shg", "thg", "window", "aperture", "shutter", "diffuser",
                          "detector", "block"]);   // leave the axis alone
const TERMINAL = new Set(["detector", "block"]);                 // absorb all light: the beam ends there
const BRANCHING = new Set(["splitter", "dichroic", "pbs"]);    // carry a `branch` list
const FOLDS     = new Set(["mirror", "curved", "scanner", "splitter", "dichroic", "pbs"]); // deflecting surfaces
const WAVEPLATES = { qwp:0.25, hwp:0.5 };                       // retardance (waves), achromatic
const HARMONIC = { shg:2, thg:3 };                              // each crystal's harmonic
const COMMON_KEYS = new Set(["id", "type", "d", "ap", "name"]);
const DARK_TAIL = 20;          // end length (mm) of an output carrying no light

/* Lines a dichroic reflects and a bandpass passes (ideal edges). */
const dichroicReflects = el => el.pass === "longpass" ? nm => nm < el.cut : nm => nm >= el.cut;
const filterPasses     = el => nm => nm >= el.cwl - el.bw/2 && nm <= el.cwl + el.bw/2;

const NM = 1e-6;                                 // nm → mm

function refract2d(D, N, n1, n2){

/* A ray inside the glass: legs reflecting on TIR or coated faces (mir), until a bare face refracts it out. */
function glassPath(V, O, D, nG, mir = null, maxBounces = 8){
  const legs = []; let P = { ...O }, Dir = { ...D };
  for (let b = 0; b < maxBounces; b++){
    const hs = polyHits(V, { x:P.x + Dir.x*1e-4, y:P.y + Dir.y*1e-4 }, Dir).filter(h => h.t > 1e-6);
    if (!hs.length) return null;

    if (out) return { legs, exit:hit.P, exitN:hit.N, exitD:out };      // refracts out
    const dn = Dir.x*hit.N.x + Dir.y*hit.N.y;                           // TIR or a coating: reflect, stay inside

  const gp = glassPath(V, e.P, Din, nG, mir); if (!gp) return null;
  return { entry:e.P, entryN:e.N, legs:gp.legs, exit:gp.exit, exitN:gp.exitN, exitD:gp.exitD };
}

/* ---------- prism forms ----------
   Named outlines made at size s (mm) in the beam frame (axis along +x through the anchor)
   for index n at the axis wavelength, as { pts, mirrors }, CCW. A turning form's anchor is
   where the way out, extended back, crosses the way in, so it turns like a mirror.
     triangle  equilateral, side s, at minimum deviation
     right     45-90-45, legs s: TIR off the hypotenuse, 90° fold. Needs n > √2
     penta     faces s, two silvered faces: 90° whatever the angle in
     dove      trapezoid, height s, 45° ends: one base reflection, image inverted
     pellin    Pellin–Broca, face s: exactly 90° at the axis wavelength

const RAD = Math.PI/180;

/* Slide an outline so its anchor is where the way out crosses the way in. */
function anchorAtTurn(pts, n, mirrors = []){
  const o = refractPath(pts.map(([x, y]) => ({ x, y })), { x:0, y:0 }, { x:1, y:0 }, n, new Set(mirrors));
  if (!o || Math.abs(o.exitD.y) < 1e-6) return pts;
  return ptsMove(pts, -(o.exit.x - o.exitD.x*o.exit.y/o.exitD.y), 0);
}
/* Incidence (rad) for minimum deviation through a 60° prism. */
const minDevIncidence = n => Math.asin(Math.min(0.9999, n/2));
/* Incidence (rad) at which one TIR delays s against p by phase d (the larger root, or nearest). */
function tirAngleFor(n, d){
  const ret = th => { const ci = Math.cos(th), b = Math.sqrt(Math.max(0, n*n*(1 - ci*ci) - 1));
    return 2*Math.atan2(n*b, ci) - 2*Math.atan2(b, n*ci); };

    const th = 89.9*RAD - (89.9*RAD - thc)*k/2000, r = ret(th);
    if (r > top){ top = r; best = th; }
    if (r >= d){

      for (let j = 0; j < 50; j++){ const m = (lo + hi)/2; if (ret(m) >= d) lo = m; else hi = m; }
      return (lo + hi)/2;

}
const PRISM_FORMS = {
  triangle: { label:"Triangle", dim:"Side", size:25, make(s, n){
    const H = s*Math.sqrt(3)/2, pts = [[-s/2, 0], [s/2, 0], [0, H]];
    return { pts:anchorAtTurn(toBeamFrame(pts, [-s/4, H/2], minDevIncidence(n) - 30*RAD), n), mirrors:[] };
  } },
  right: { label:"Right-angle prism", dim:"Leg", size:25, make(s){
    return { pts:[[-s/2, -s/2], [s/2, s/2], [-s/2, s/2]], mirrors:[] };    // hypotenuse through the anchor
  } },
  penta: { label:"Pentaprism", dim:"Face", size:25, make(s, n){
    const c = Math.cos(22.5*RAD), d = Math.sin(22.5*RAD), h = Math.SQRT1_2;
    const L2 = s*(2 - Math.SQRT2), L1 = L2/(Math.SQRT2*d);                 // reflecting faces 1.0824 s, closing the outline exactly
    const C = [s + d*L1, c*L1], D = [C[0] - h*L2, C[1] + h*L2];
    const pts = [[0, 0], [s, 0], C, D, [0, s]], mirrors = [1, 3];         // in at the bottom, out at the left
    return { pts:anchorAtTurn(toBeamFrame(pts, [s/2, 0], 90*RAD), n, mirrors), mirrors };
  } },
  dove: { label:"Dove prism", dim:"Height", size:24, make(s){
    return { pts:[[-40, -12], [40, -12], [16, 12], [-16, 12]].map(([x, y]) => [x*s/24, y*s/24]), mirrors:[] };
  } },
  pellin: { label:"Pellin–Broca prism", dim:"Face", size:20, make(s, n){
    const c15 = Math.cos(15*RAD), s15 = Math.sin(15*RAD), r = s/(2*s15), C = [r*c15, -s/2];
    const pts = [[0, 0], [0, -s], C, [C[0] + s/(2*Math.sqrt(3)), 0]];        // the axis leaves mid-way along the top
    return { pts:anchorAtTurn(toBeamFrame(pts, [0, -s/2], -minDevIncidence(n)), n), mirrors:[] };
  } },
  wedge: { label:"Wedge prism", dim:"Height", size:25, make(s){

  } },
  rhomb: { label:"Fresnel rhomb", dim:"Height", size:12.5, make(s, n){
    const b = Math.PI/2 - tirAngleFor(n, Math.PI/4), L = 2*s*Math.cos(b)**2/Math.sin(b);

  } },

/* An element's axis wavelength: the mean of its source's lines (§4). */
const axisLambda = el => mean(sourceLines(srcOfEl(el)));
/* Give a prism named form at size s; resizing the same form keeps hand-coated faces. */
function applyPrismForm(el, form, s = el.size){
  const F = PRISM_FORMS[form]; if (!F) return;
  s = clamp(s, 0.1, 1e5);
  const o = F.make(s, glassCurve(el).at(axisLambda(el)));
  if (form !== el.form) el.mirrors = o.mirrors;
  el.form = form; el.size = s;

}
/* Resize: a named form is remade; a custom outline scales about the anchor. */
function resizePrism(el, s){
  s = clamp(s, 0.1, 1e5);

  const k = el.size > 0 ? s/el.size : 1;
  el.pts = el.pts.map(([x, y]) => [r3(x*k), r3(y*k)]); el.size = s;

/* A legacy prism: Dove if it has the old default outline, else Custom, sized by height. */
function legacyPrismForm(el){

  if (!ok || (el.pts.length === 4 && el.pts.every((q, i) => q[0] === dove[i][0] && q[1] === dove[i][1]))){ el.form = "dove"; return; }
  el.form = "";

/* Toggle a face's coating; keep coatings in step as vertices change. */
function toggleMirror(el, i){

  el.mirrors = (el.mirrors || []).flatMap(k => k < i ? [k] : k === i ? [i, i + 1] : [k + 1]);

/* ---------- axicon ----------
   Thin plano-conical element, tip on the axis (§2). Collimated light flat side first bends
   toward the axis by β = asin(n·sin α) − α, forming the crossing sheets of a Bessel beam.
   outSlope(h, m, nm): exit slope, or null on TIR; a ray on the tip passes straight. */
function axiconRefractor(el){
  const nOf = glassCurve(el).at, a = clamp(el.alpha, 0.1, 40)*RAD, ca = Math.cos(a), sa = Math.sin(a);
  return (h, m, nm) => {
    if (Math.abs(h) < 1e-9) return m;
    const s = h > 0 ? 1 : -1, n = nOf(nm);
    const Nc = { x:ca, y:(el.flip ? -s : s)*sa }, Nf = { x:1, y:0 };   // the cone's normal on that side; the flat's
    const [N1, N2] = el.flip ? [Nc, Nf] : [Nf, Nc];
    const d1 = refract2d(slopeDir(m), N1, 1, n); if (!d1) return null;
    const d2 = refract2d(d1, N2, n, 1);

/* Deflection (°) of a collimated ray at wavelength nm. */
const axiconDeflection = (el, nm) => { const m = axiconRefractor(el)(1, 0, nm); return m == null ? null : Math.abs(Math.atan(m))/RAD; };

/* ---------- polygon scanner ----------
   n facets, each 2·ap wide: inradius r = ap/tan(π/n), circumradius R = ap/sin(π/n), centre C.
   Placed unturned d on, mid-facet, folded by `angle`. Turned by rot°, the beam meets whichever
   facet its line first crosses and turns 2·rot; it's periodic in 360°/n.
   → { t, P, N, angle, C, r, R, V, Fc, n }: distance, hit point, facet normal, deflection,
   vertices, facet middle. */
const scannerFacets = el => clamp(Math.round(el.facets) || 6, 3, 72);
function scannerAt(el, P0, D){
  const n = scannerFacets(el), half = Math.PI/n, a = Math.max(0.1, el.ap), r = a/Math.tan(half), R = a/Math.sin(half);
  const A = { x:P0.x + D.x*el.d, y:P0.y + D.y*el.d };
  const dR = rot(D, el.angle*RAD), N0 = unit({ x:dR.x - D.x, y:dR.y - D.y });   // the unturned facet, facing the light
  const C = { x:A.x - N0.x*r, y:A.y - N0.y*r }, phi = Math.atan2(N0.y, N0.x) + el.rot*RAD;
  const V = Array.from({ length:n }, (_, k) => { const p = phi + (2*k + 1)*half; return { x:C.x + R*Math.cos(p), y:C.y + R*Math.sin(p) }; });
  const h = polyHits(V, P0, D).find(h => h.t > 1e-6 && D.x*h.N.x + D.y*h.N.y < 0);
  if (!h) return { t:el.d, P:A, N:N0, angle:el.angle, C, r, R, V, Fc:A, n };      // the beam starts inside it: as unturned
  let angle = signedDeg(D, reflectDir(D, h.N));
  if (Math.abs(angle) < 0.5) angle = angle < 0 ? -0.5 : 0.5;                     // grazing a facet: barely turned
  return { t:h.t, P:h.P, N:h.N, angle, C, r, R, V, Fc:{ x:C.x + h.N.x*r, y:C.y + h.N.y*r }, n };

/* ---------- retroreflector ----------
   Hollow roof mirror seen end on: faces from apex O at ±45° to U, each ap·√2 long (opening 2·ap).
   Two reflections make a half-turn about O: the beam returns antiparallel, displaced by twice its
   offset, whatever the tilt. Stands for a corner cube too. Normals point out of the roof. */
function retroGeom(O, U, ap){
  const L = ap*Math.SQRT2, E1 = rot(U, Math.PI/4), E2 = rot(U, -Math.PI/4);

/* Ray from P along u through roof g: { t1, P1, N1, u1, t2, P2, N2 }, or null if it misses
   the opening or either face. */
function retroPath(P, u, g){
  if (u.x*g.U.x + u.y*g.U.y > -Math.SQRT1_2 + 1e-9) return null;
  const tol = 1e-9*(1 + g.L);
  const meet = (Q, v, E) => {                    // Q + v·t on the face from O along E, with t > 0
    const den = v.x*E.y - v.y*E.x; if (Math.abs(den) < 1e-12) return null;
    const wx = g.O.x - Q.x, wy = g.O.y - Q.y, t = (wx*E.y - wy*E.x)/den, s = (wx*v.y - wy*v.x)/den;
    return t > tol && s >= -tol && s <= g.L + tol ? { t, P:{ x:Q.x + v.x*t, y:Q.y + v.y*t } } : null;
  };
  const a = meet(P, u, g.E1), b = meet(P, u, g.E2);
  if (!a && !b) return null;
  const [h1, N1, E2, N2] = a && (!b || a.t <= b.t) ? [a, g.N1, g.E2, g.N2] : [b, g.N2, g.E1, g.N1];
  const u1 = reflectDir(u, N1);
  if (Math.hypot(h1.P.x - g.O.x, h1.P.y - g.O.y) < tol*10)   // into the apex itself: straight back
    return { t1:h1.t, P1:h1.P, N1, u1, t2:0, P2:h1.P, N2 };
  const h2 = meet(h1.P, u1, E2);
  return h2 ? { t1:h1.t, P1:h1.P, N1, u1, t2:h2.t, P2:h2.P, N2 } : null;
}

/* ---------- mirror pair ----------
   Two mirrors, len mm, facing across a gap. The first, at P1 d mm on, folds the beam by `angle`;
   the second stands gap mm off, turned `wedge`° (positive closes ahead). Mirrors are staggered so
   the beam enters past the second; closing mirrors stop at their apex. Parallel mirrors zigzag
   (pitch 2·gap·cot(δ/2)) and exit parallel; closing ones turn the beam back out, as in a multipass
   cavity. Trapped after PAIR_MAX bounces.

  return Object.assign(g, { hits, pts:hits.map(x => x.P), n:hits.length, path, exitP:{ ...p }, exitDir:{ ...v },

/* Mirror length giving a parallel pair n bounces (rounded up to even), well inside the ends. */
function pairLenFor(el, n){

/* ---------- polarization ----------
   Each wavelength channel carries a trace-1 coherency matrix J = ⟨E·E†⟩ (power in `pow`);
   unpolarized is I/2. Stored { a:J11, b:J22, re, im }, J12 = re + i·im. Basis: e1 = p (in the
   drawing plane), e2 = s (toward the viewer); angles run p toward s. Stokes: s1 = a − b,
   s2 = 2·re, s3 = 2·im (+1 right-circular).
   Coated optics are ideal: reflections are diag(1, −1), transmissions leave the state alone.
   Bare glass follows Fresnel, and TIR delays s and p differently (Fresnel rhomb); checked
   against 3D Maxwell boundary conditions. Prisms and Faraday rotators act at the axis

const POL_MODES   = ["linear", "unpolarized"];

const P_STATE     = { a:1, b:0, re:0, im:0 }, S_STATE = { a:0, b:1, re:0, im:0 };
const EXTINCTION  = 1e-3;                        // a split share below this is dropped, as by a real PBS
const mirrorJ = J => ({ a:J.a, b:J.b, re:-J.re, im:-J.im });
const stokes  = J => ({ s1:J.a - J.b, s2:2*J.re, s3:2*J.im });

/* Jones matrix M (complex 2×2, { re, im } entries) acts on J as M·J·M†. */
const cx   = (re, im = 0) => ({ re, im });
const cmul = (a, b) => ({ re:a.re*b.re - a.im*b.im, im:a.re*b.im + a.im*b.re });
const cadd = (a, b) => ({ re:a.re + b.re, im:a.im + b.im });
const conj = a => ({ re:a.re, im:-a.im });
/* The state M passes, renormalized, and t, the power fraction passed. */
function jonesPass(J, M){
  const Jm = [[cx(J.a), cx(J.re, J.im)], [cx(J.re, -J.im), cx(J.b)]];
  const mul = (A, B) => [0, 1].map(i => [0, 1].map(j => cadd(cmul(A[i][0], B[0][j]), cmul(A[i][1], B[1][j]))));
  const Mh = [[conj(M[0][0]), conj(M[1][0])], [conj(M[0][1]), conj(M[1][1])]];
  const O = mul(mul(M, Jm), Mh), t = O[0][0].re + O[1][1].re, k = t > 1e-12 ? t : 1;
  return { J:{ a:O[0][0].re/k, b:O[1][1].re/k, re:O[0][1].re/k, im:O[0][1].im/k }, t };
}
const jonesApply = (J, M) => jonesPass(J, M).J;
const diagJones  = (p, s) => [[p, cx(0)], [cx(0), s]];
/* Retarder: fast axis axisDeg, slow delayed by delta (rad): R(θ)·diag(1, e^iδ)·R(−θ). A quarter wave at +45° turns p right-circular. */
function retarder(axisDeg, delta){
  const t = axisDeg*Math.PI/180, c = Math.cos(t), s = Math.sin(t), er = Math.cos(delta), ei = Math.sin(delta);
  const off = cx(c*s*(1 - er), -c*s*ei);
  return [[cx(c*c + s*s*er, s*s*ei), off], [off, cx(s*s + c*c*er, c*c*ei)]];
}
const plateMatrix = el => retarder(el.axis, 2*Math.PI*WAVEPLATES[el.type]);
/* Faraday rotation: R(θ) in (p, s), fixed to the field, not the beam. Returning light's frame
   has p reversed, so it reads −θ (orientVisit, §4): a rotator doubles on the way back where a
   wave plate undoes itself, hence an isolator. Independent of angle and wavelength. */
function rotatorMatrix(deg){
  const t = deg*RAD, c = Math.cos(t), s = Math.sin(t);
  return [[cx(c), cx(-s)], [cx(s), cx(c)]];
}
/* Bare glass at cos θi = ci, n1 to n2. Transmission scaled by √(n2·cosθt / n1·cosθi) so the trace is the power fraction. */
function fresnelTransmit(ci, n1, n2){
  const ct = Math.sqrt(Math.max(0, 1 - (n1/n2)**2*(1 - ci*ci))), g = Math.sqrt(n2*ct/(n1*ci));
  return diagJones(cx(2*n1*ci/(n2*ci + n1*ct)*g), cx(2*n1*ci/(n1*ci + n2*ct)*g));
}
/* TIR: unit amplitudes, s and p phase-delayed differently. */
function fresnelTIR(ci, n1, n2){
  const b = Math.sqrt(Math.max(0, n1*n1*(1 - ci*ci) - n2*n2)), cis = a => cx(Math.cos(a), Math.sin(a));
  return diagJones(cis(-2*Math.atan2(n1*b, n2*n2*ci)), cis(-2*Math.atan2(b, n1*ci)));
}

/* Polarization ellipse of J's polarized part: kind unpolarized | linear | elliptical; psi major
   axis (rad, p toward s), chi ellipticity (rad, + right-handed), dop degree of polarization. */
function polEllipse(J){
  const { s1, s2, s3 } = stokes(J), dop = Math.hypot(s1, s2, s3);
  if (dop < 0.05) return { kind:"unpolarized", dop };
  const psi = Math.atan2(s2, s1)/2, chi = Math.asin(clamp(s3/dop, -1, 1))/2;
  return { kind:Math.abs(chi) < 0.015 ? "linear" : "elliptical", psi, chi, dop };
}
/* A state in words: "linear 45°", "circular R", "8% polarized, linear 0° (p)". */
function describePol(J){
  const e = polEllipse(J);
  if (e.kind === "unpolarized") return "unpolarized";
  let a = Math.round(e.psi*1800/Math.PI)/10; if (a <= -90) a += 180;
  const hand = e.chi > 0 ? "R" : "L";
  const st = e.kind === "linear" ? `linear ${a}°` + (a === 0 ? " (p)" : a === 90 ? " (s)" : "")
           : Math.abs(e.chi) > Math.PI/4 - 0.02 ? `circular ${hand}` : `elliptical ${hand}, ${a}°`;
  return e.dop < 0.95 ? `${Math.round(e.dop*100)}% polarized, ${st}` : st;
}
/* A state's key at display precision; lines sharing a key draw as one. */
const polKey = J => { const t = stokes(J); return [t.s1, t.s2, t.s3].map(v => (Math.round(v*50)/50).toFixed(2)).join(","); };
/* A wavelength to 0.01 nm (354.67). */
const fmtNm = nm => String(Math.round(nm*100)/100);
/* A beam's lines for the panel; same wavelength and state merged, powers summed. */
function mergeLines(chans){
  const m = new Map();
  for (const c of chans){
    const k = fmtNm(c.nm) + "|" + polKey(c.J), x = m.get(k);
    if (x) x.pow += c.pow; else m.set(k, { nm:c.nm, J:c.J, pow:c.pow });
  }
  return [...m.values()];
}
/* A beam's line states in words: one if shared, else per line. fn picks what's told. */
function linesPol(chans, fn = describePol){
  if (!chans.length) return "no light";
  if (new Set(chans.map(c => polKey(c.J))).size === 1) return fn(chans[0].J);
  return mergeLines(chans).map(c => `${fmtNm(c.nm)} nm: ${fn(c.J)}`).join("\n");
}

/* ---------- harmonics ----------
   Ideal thin crystals, phase-matched at their fundamental (within PM_TOL), either direction,
   converting conv regardless of polarization (§4, stepHarmonic). SHG doubles; THG sums the
   fundamental with its second harmonic (fundamental gives 1/3 of the power, harmonic 2/3).
   Energy is conserved; unconverted light passes weaker.
   The harmonic leaves linear, crossed (Type I) or parallel (Type 0) to the fundamental's major
   axis, or to p if it has none. A Gaussian's k-th harmonic keeps q: radius w/√k, same Rayleigh
   range; its rays are scaled 1/√k. */
const PM_TOL = 0.5;                              // nm tolerance to the fundamental or its harmonic
const HPOL = [["crossed", "Crossed"], ["parallel", "Parallel"]];
const linearState = deg => jonesApply(P_STATE, rotatorMatrix(deg));
/* The harmonic's state from a fundamental in state J. */
function harmonicState(el, J){
  const e = polEllipse(J), axis = e.kind === "unpolarized" || Math.abs(e.chi) > Math.PI/4 - 0.02 ? 0 : e.psi/RAD;
  return linearState(axis + (el.hpol === "parallel" ? 0 : 90));
}
/* Lines a beam carrying nms has after crystal el, for planning joins. */
function harmonicLines(el, nms){
  const near = (nm, to) => Math.abs(nm - to) <= PM_TOL, has = to => nms.some(nm => near(nm, to));
  return HARMONIC[el.type] === 2 ? (has(el.pm) ? [...nms, el.pm/2] : nms) : (has(el.pm) && has(el.pm/2) ? [...nms, el.pm/3] : nms);
}

/* ---------- fibers ----------
   Light enters one end and leaves the other (§4). Kinds, set by NA (the half-angle sine):
     SM  one Gaussian mode, waist w = λ/(π·NA); a collimator matches f = W/NA
     PM  single-mode, preserving polarization along its axes
     MM  fills its core (µm) and NA; accepts all light inside both */
const FIBER_KINDS = { SM:{ name:"Single-mode", NA:0.1 }, PM:{ name:"Polarization-maintaining", NA:0.1 }, MM:{ name:"Multimode", NA:0.22 } };
const JACKET = { SM:"#F2C230", PM:"#2F6EBA", MM:"#EE7A22" };   // the colours patch cables of each kind come in
const fiberSpec = el => ({ kind:FIBER_KINDS[el.kind] ? el.kind : "SM", NA:clamp(el.NA, 0.01, 0.95), core:Math.max(1, el.core) });
const fiberTan = F => Math.tan(Math.asin(F.NA));   // the half-angle's slope
/* SM/PM mode field radius (mm) at nm. */
const modeRadius = (F, nm) => nm*NM/(Math.PI*fiberTan(F));
/* Short fiber description for its label and the browser. */
const fiberWords = F => F.kind + (F.kind === "MM" ? ` Ø${fx(F.core)} µm` : "") + `, NA ${F.NA}`;

/* An end's package (mm from the face): collimator barrel f + 5 long, or a tip's ferrule; then an FC nut and boot (radii, lengths). */
const FC = { ferrule:1.25, proud:5, nutR:4.5, nutL:9, bootR0:2.6, bootR1:1.6, bootL:28, jacketR:1.5 };
const fiberBarrel = f => f + 5;
const fiberPkgLen = e => (e.end === "collimator" ? fiberBarrel(e.f) : FC.proud) + FC.nutL + FC.bootL;
const collimatorR = ap => Math.max(ap + 2.75, 2*ap);   // collimator housing radius: Ø11 mm for Ø5.5 mm clear aperture
const LENS_DOME = 0.35;        // lens bulge past the barrel (barrel radii, drawing only)
const hasCollimator = el => el.inEnd === "collimator" || el.outEnd === "collimator";

/* A fiber's two ends, input met at A along dirIn: each { p, dir, end, f }, dir the way light crosses the face. */
function fiberEnds(el, A, dirIn){
  const a = el.orot*RAD;
  return { in:{ p:{ ...A }, dir:{ ...dirIn }, end:el.inEnd, f:el.fIn },
           out:{ p:{ x:el.ox, y:el.oy }, dir:{ x:Math.cos(a), y:Math.sin(a) }, end:el.outEnd, f:el.fOut } };
}

/* Power fraction coupled at end `entry` for channel c, chief ray h mm off axis at slope m
   (a collimator first focuses it, f on). SM/PM: Gaussian overlap
     4 / [(w/wf + wf/w)² + (π·w·wf/λ)²/R²]
   times Joyce–DeLoach offset and tilt losses; M² > 1 holds ~(M²)² modes, one coupled.
   MM: the Gaussian's share inside the core and NA. */
function fiberCoupling(F, entry, c, h, m){
  let q = c.q;
  if (entry.end === "collimator"){
    const f = entry.f, m1 = m - h/f;
    q = lensQ(q, f); q = { re:q.re + f, im:q.im }; h += m1*f; m = m1;
  }
  const M2 = c.m2 || 1, iq = cInv(q), W = Math.sqrt(-c.lam*M2/(Math.PI*iq.im));   // the beam's radius at the face
  if (F.kind === "MM"){
    const a = F.core/2e3, Nt = fiberTan(F);
    const th = Math.sqrt(c.lam*M2/(Math.PI*Math.abs(q.im)));                     // its far-field half-angle, W0/zR
    const ae = Math.max(0, a - Math.abs(h)), Ne = Math.max(0, Nt - Math.abs(m));
    return (1 - Math.exp(-2*ae*ae/(W*W)))*(1 - Math.exp(-2*Ne*Ne/(th*th)));
  }
  const wf = modeRadius(F, c.nm), w = W/Math.sqrt(M2), lam = c.lam, s2 = w*w + wf*wf, k = Math.PI*w*wf/lam*iq.re;
  return 4/((w/wf + wf/w)**2 + k*k)*Math.exp(-2*h*h/s2)*Math.exp(-2*(Math.PI*m*w*wf/lam)**2/s2)/(M2*M2);
}
/* The output at end `exit`: a Gaussian beam and ray fan, all lines on the fiber axis. SM/PM
   leave in the mode (waist w, spreading λ/πw); MM fills core and NA, M² = π·a·NA/λ. A
   collimator has the face at its focus. */
function fiberEmission(F, exit, c, frac, idBase){
  const lam = c.lam, f = exit.f, coll = exit.end === "collimator";
  let w0, th, M2 = 1, sg = 1;
  if (F.kind === "MM"){ w0 = F.core/2e3; th = fiberTan(F); M2 = Math.max(1, Math.PI*w0*th/lam); sg = -1; }
  else { w0 = modeRadius(F, c.nm); th = lam/(Math.PI*w0); }
  const q = coll ? lensQ({ re:f, im:w0/th }, f) : { re:0, im:w0/th };          // zR = w0/θ: πw0²/λ when M² = 1
  const rays = frac.map((u, i) => {
    let h = sg*w0*u, m = th*u;
    if (coll){ h += m*f; m -= h/f; }
    return { id:idBase + "_" + c.nm + "_" + i, ri:i, nm:c.nm, ci:c.ci, h, m, mg:0, pow:c.pow };
  });
  return { chan:{ ...c, q, h:0, m:0, m2:M2 }, rays };
}
/* Output size and spread at nm: W the 1/e² radius (mm), th the far-field half-angle. */
function fiberOutput(F, exit, nm){
  const lam = nm*NM, mm = F.kind === "MM", w0 = mm ? F.core/2e3 : modeRadius(F, nm);
  const th = mm ? fiberTan(F) : lam/(Math.PI*w0);
  return exit.end === "collimator" ? { W:Math.hypot(exit.f*th, w0), th:w0/exit.f } : { W:w0, th };
}
/* A fiber's effect on polarization, entering frame to leaving frame (§3). SM and MM: unpolarized.
   PM: slow (key°) and fast axes kept, but leaving as their incoherent sum. Entering by the output
   end mirrors the key (orientVisit). */
function fiberPolarization(F, J, key){
  if (F.kind !== "PM") return UNPOLARIZED;
  const Jk = jonesApply(J, rotatorMatrix(-key));
  return jonesApply({ a:Jk.a, b:Jk.b, re:0, im:0 }, rotatorMatrix(key));
}

/* The cable as cubic Bézier spans (model mm) between the end packages through via: a clamped, chord-length cubic spline. */
function fiberCable(el, ends){
  const back = (e, sg) => { const L = fiberPkgLen(e); return { x:e.p.x + sg*e.dir.x*L, y:e.p.y + sg*e.dir.y*L }; };
  const K = [back(ends.in, 1), ...(el.via || []).map(([x, y]) => ({ x, y })), back(ends.out, -1)], n = K.length - 1;
  const h = K.slice(1).map((q, i) => Math.max(1e-6, Math.hypot(q.x - K[i].x, q.y - K[i].y)));
  // Knot tangents D: ends fixed; inner from h[i]·D[i−1] + 2(h[i−1] + h[i])·D[i] + h[i−1]·D[i+1] = r[i]
  const D = K.map(() => ({ x:0, y:0 }));
  D[0] = { ...ends.in.dir }; D[n] = { ...ends.out.dir };
  if (n > 1){
    const a = [], b = [], c = [], r = [];
    for (let i = 1; i < n; i++){
      const p = h[i - 1], q = h[i], k = (A, B) => ({ x:(B.x - A.x)*3, y:(B.y - A.y)*3 });
      const u = k(K[i], K[i + 1]), v = k(K[i - 1], K[i]);
      a.push(q); b.push(2*(p + q)); c.push(p);
      r.push({ x:p/q*u.x + q/p*v.x, y:p/q*u.y + q/p*v.y });
    }
    r[0].x -= a[0]*D[0].x; r[0].y -= a[0]*D[0].y;
    r[n - 2].x -= c[n - 2]*D[n].x; r[n - 2].y -= c[n - 2]*D[n].y;
    for (let i = 1; i < n - 1; i++){              // Thomas' algorithm
      const w = a[i]/b[i - 1];
      b[i] -= w*c[i - 1]; r[i].x -= w*r[i - 1].x; r[i].y -= w*r[i - 1].y;
    }
    for (let i = n - 2; i >= 0; i--){
      const nx = i < n - 2 ? D[i + 2] : { x:0, y:0 }, cc = i < n - 2 ? c[i] : 0;
      D[i + 1] = { x:(r[i].x - cc*nx.x)/b[i], y:(r[i].y - cc*nx.y)/b[i] };
    }
  }
  const spans = [];
  for (let i = 0; i < n; i++){
    const P = K[i], Q = K[i + 1], t = h[i]/3;
    spans.push([P, { x:P.x + D[i].x*t, y:P.y + D[i].y*t }, { x:Q.x - D[i + 1].x*t, y:Q.y - D[i + 1].y*t }, Q]);
  }
  return { knots:K, spans };
}
const bezAt = ([a, b, c, d], t) => { const u = 1 - t, A = u*u*u, B = 3*u*u*t, C = 3*u*t*t, D = t*t*t;
  return { x:A*a.x + B*b.x + C*c.x + D*d.x, y:A*a.y + B*b.y + C*c.y + D*d.y }; };
const bezPoints = (sp, n = 24) => Array.from({ length:n + 1 }, (_, k) => bezAt(sp, k/n));
/* The cable span nearest model point m. */
function nearestSpan(cable, m){
  let best = 0, bd = Infinity;
  cable.spans.forEach((sp, i) => { for (const p of bezPoints(sp)){ const d = Math.hypot(p.x - m.x, p.y - m.y); if (d < bd){ bd = d; best = i; } } });
  return best;
}


/* =====================================================================
   4. TRACE
   The beam carries
     chans  per wavelength: Gaussian q, chief ray (h, m) vs the segment axis (true mm),
            pow, polarization J (§3), and m2 (M², 1 except after a multimode fiber).
     rays   the fan, as offsets from their channel's chief ray, drawn ×exag.
   The walker steps element by element, one segment per free-space or glass run,
   recursing into branches and arms; each source is walked in turn.

   Links. A link's distance is derived: the beam runs to its owner node and acts through
   its real orientation. To hit it, the last mirror before (else the source) is *aimed*:
   reaching sets its angle; joining also slides it so the output leaves by along's port (§2).
   Solved values are written to the scene (el.d, el.angle, src.rot, src.x/y), marked _aim/_aimD.

   Waiting. Walks are queued. A sub-beam meeting an unplaced optic is requeued alone while
   its parent goes on; a main walk is requeued whole. A walk stuck through a full round is
   walked with the link skipped, marked _miss = "unplaced".

   Output
     segs    { i, prev, kind:"free"|"glass"|"tail", p0, p1, dir, geo, opt, endEl,
               list, holder, key, src, chans, cutStart, cutEnd, arcStart, arcEnd, apA, rayMax, endsOn? }
             prev: previous segment; geo/opt: drawn/optical length; cutStart/cutEnd: plane
             normals where rays meet a face (at cutStartAt/cutEndAt if off axis); arcStart/arcEnd
             { id, c, r }: curved mirror face; roofEnd/roofMid/roofStart: a roof crossed (§3);
             lead: extra run past d to a retroreflector apex; apA: leaving aperture;
             endsOn: detector or block ending a zero-length tail.
     nodes   { el, p, dirIn, dirOut, segIn, N?, grating?, poly?, fiber?, scan?, retro? }
             scan: scannerAt result; retro: retroGeom with inP, outP;
             fiber: { ends, cable, couple, entry, exit }
     pieces  per ray per segment: { seg, id, ri, ci, nm, h0, h1, c0, c1, pow, draw? };
             ri fan index, ci line; draw "fill" (axicon edge ray, fill only) or "rays"
     emitters { src, seg }: each source's first segment
     A link's node has el = the link, ref = the optic, eff = what it traced as, link = true;
     only owner nodes are drawn.
   ===================================================================== */
const sourceLines = src => (src.lambdas && src.lambdas.length ? src.lambdas : [633]).slice();
const chanIndex = chans => new Map(chans.map(c => [c.ci, c]));

class Deferred extends Error {}                   // a link's target isn't placed yet: try this walk later
/* What a walk has emitted, so a waiting walk can be taken back. */
const traceMark = T => ({ segs:T.segs.length, nodes:T.nodes.length, pieces:T.pieces.length, em:T.emitters.length, queue:T.queue.length });
function rollBack(T, m){
  for (const n of T.nodes.slice(m.nodes)) if (T.nodeById.get(n.el.id) === n) T.nodeById.delete(n.el.id);
  T.segs.length = m.segs; T.nodes.length = m.nodes; T.pieces.length = m.pieces; T.emitters.length = m.em;
  T.queue.length = m.queue;                      // and the sub-beams it queued: it will queue them again
}
/* Deep enough copy of a beam to walk without touching the original. */
const cloneBeam = b => ({ ...b, p:{ ...b.p }, dir:{ ...b.dir }, chans:b.chans.map(c => ({ ...c, q:{ ...c.q } })), rays:b.rays.map(r => ({ ...r })) });
/* Queue entries: { src } or { route, beam, refLam } for a sub-beam. waited = T.placed at its last wait. */
function runWalk(T, task){
  if (task.src){
    const src = task.src, nms = sourceLines(src);
    T.refLam = mean(nms);                        // axis λ = mean of the beam's source
    aimSource(T, src);
    T.emitters.push({ src, seg:T.segs.length });
    walk(T, { list:src.chain, holder:src, key:"tail", depth:0, src }, emitBeam(src, nms));
  } else {
    T.refLam = task.refLam;
    walk(T, task.route, cloneBeam(task.beam));
  }
}
function trace(sc){
  const T = { K:sc.exag, refLam:0, segs:[], nodes:[], pieces:[], emitters:[], nodeById:new Map(), known:scanScene(sc),
              force:false, queue:sc.sources.map(src => ({ src, waited:null })), placed:0 };
  while (T.queue.length){
    const task = T.queue.shift(), mark = traceMark(T);
    T.force = task.waited === T.placed;          // nothing new was placed since it waited: stop waiting
    try { runWalk(T, task); T.placed++; }
    catch (err){
      if (!(err instanceof Deferred)) throw err;
      rollBack(T, mark); task.waited = T.placed; T.queue.push(task);
    }
  }
  return { segs:T.segs, nodes:T.nodes, pieces:T.pieces, emitters:T.emitters };
}
/* Walk a sub-beam now, or requeue it if it meets an unplaced optic while its parent walks on (which may place it). */
function walkSub(T, route, beam){
  const task = { route, beam:cloneBeam(beam), refLam:T.refLam, waited:null }, mark = traceMark(T), force = T.force;
  T.force = false;
  try { walk(T, route, beam); }
  catch (err){
    if (!(err instanceof Deferred)) throw err;
    rollBack(T, mark); task.waited = T.placed; T.queue.push(task);
  }
  finally { T.force = force; }
}
/* Every real element's id, for links; clears derived marks. */
function scanScene(sc){
  const known = new Set();
  (function visit(list){
    for (const el of list || []){
      delete el._aim; delete el._aimD; delete el._aimB; delete el._miss; delete el._d;
      if (el.type !== "link") known.add(el.id);
      visit(el.branch); if (el.arms) for (const k in el.arms) visit(el.arms[k].list);
    }
  })(sc.sources.flatMap(s => s.chain));
  for (const src of sc.sources){ delete src._aim; delete src._aimD; }
  return known;
}

/* ---------- aiming ----------
   The first link down `sub` before any axis-bending element: { link, target, Darr, Q },
   Darr the required arrival direction (null to just reach), Q the point (faceOf). Null if none. */
function lookAhead(T, sub){
  for (const x of sub){
    if (x.type === "link"){
      const target = T.nodeById.get(x.ref);
      if (!target){ if (T.force || !T.known.has(x.ref)) return null; throw new Deferred(); }
      return { link:x, target, Darr:arrivalDir(x, target), Q:faceOf(x, target) };
    }
    if (!STRAIGHT.has(x.type)) return null;
  }
  return null;
}
const mainDir = node => node.dirMain || node.dirOut;            // where the owner's list continues
/* The point a link must reach: a fiber's output end if entering there; a roof's way out if coming back; else the optic's place. */
function faceOf(link, target){
  if (target.el.type === "fiber" && link.along === "back") return target.fiber.ends.out.p;
  if (target.retro) return link.along === "back" ? target.retro.outP : target.retro.inP;

/* Clip rays to the aperture (and an aperture's central block), in drawn transverse space. A fold at δ spans ap·sin(δ/2). */

const STEP = {
